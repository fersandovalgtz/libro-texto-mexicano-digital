name: Validate LTMD U1 W4 computational validation

on:
  pull_request:
    branches: [main]
    paths:
      - 'data/research/ltmd_u1_w4_distributed_global_evidence.json'
      - 'data/research/ltmd_u1_w4_computational_validation.json'
      - 'scripts/validate_ltmd_u1_w4_computational_validation.py'
      - '.github/workflows/validate-ltmd-u1-w4-computational-validation.yml'
  push:
    branches: [main]
    paths:
      - 'data/research/ltmd_u1_w4_distributed_global_evidence.json'
      - 'data/research/ltmd_u1_w4_computational_validation.json'
      - 'scripts/validate_ltmd_u1_w4_computational_validation.py'
      - '.github/workflows/validate-ltmd-u1-w4-computational-validation.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Compile validator
        run: python -m py_compile scripts/validate_ltmd_u1_w4_computational_validation.py
      - name: Validate W4 text-free computational evidence
        run: python scripts/validate_ltmd_u1_w4_computational_validation.py

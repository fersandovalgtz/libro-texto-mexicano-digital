name: Encrypted private bundle — 1993 CER batch 1

on:
  push:
    paths: ['.github/workflows/cer-private-bundle-1993-batch1.yml']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  bundle:
    runs-on: ubuntu-24.04
    env:
      OMP_THREAD_LIMIT: '1'
    steps:
      - name: Install exact production OCR
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq tesseract-ocr tesseract-ocr-spa python3-pil
          tesseract --version | head -1 | tee version.txt
          grep -F 'tesseract 5.3.4' version.txt

      - name: Write one-use public certificate
        run: |
          cat > cert.pem <<'PEM'
          -----BEGIN CERTIFICATE-----
          MIIEgTCCAumgAwIBAgIUYF+4bMQguZv+WN1rix5v65/dOqMwDQYJKoZIhvcNAQEL
          BQAwUDEnMCUGA1UEAwweTFRNRCBDRVIgMTk5MyBiYXRjaDEgdHJhbnNwb3J0MSUw
          IwYDVQQKDBxMaWJybyBUZXh0byBNZXhpY2FubyBEaWdpdGFsMB4XDTI2MDgxNTE2
          Mzg1MloXDTI2MDgxNzE2Mzg1MlowUDEnMCUGA1UEAwweTFRNRCBDRVIgMTk5MyBi
          YXRjaDEgdHJhbnNwb3J0MSUwIwYDVQQKDBxMaWJybyBUZXh0byBNZXhpY2FubyBE
          aWdpdGFsMIIBojANBgkqhkiG9w0BAQEFAAOCAY8AMIIBigKCAYEA3YTXpqLw/iZX
          8XRD+ZTTiqn3iVdewDM44Wac1bjQ6NBdCtPm3w2RJ1JtihsPGjy3iN06klVt04tY
          hwzZ0YZYHysS435PCOtpXqhu7IvnBWwOHL+uqxCmbuiuvZFmV06hOvO/E1hJoSDw
          21BC5VUYAfjwTeAzXoeqWle4/A4WdM8A89QNF9+uI9DeDSPHeg/VTlBLWmJPWgbi
          iVpGl+SVWFldaY+HbljWqeFS4ihhq/+av7Wm99XonuaXi/3U0W8nyX+t/5lGB9iy
          GDOrLx0ND6hX4UIu0f2KilLyWHOXKbe11hMLxnAz012B4++OunR8/GdmZATMihtL
          eytvWID7uV6IeTVZbca4HS7/0sY3iWSWvIqojuSeXPDqmtpJ+k9hKMvG2XQiFTkz
          tmzAgsemJ0SZ2VvZii14riOufiK9b2PsqydRPwc4AsJ5/3N1oM1JalhPyneHYCgU
          RRLMwKDJqdbDQE3Q98yp7LpxSgy0FQt/dZa2ySYfUqYcLEaRviwlAgMBAAGjUzBR
          MB0GA1UdDgQWBBRCFjkbyxUnRdOJIJ/VUvwMmmJeFDAfBgNVHSMEGDAWgBRCFjkb
          yxUnRdOJIJ/VUvwMmmJeFDAPBgNVHRMBAf8EBTADAQH/MA0GCSqGSIb3DQEBCwUA
          A4IBgQBNNWTEhjRmj0Q4aq//3CIZU6TpUII5tDqbi2AoX68r7LbX8hCAFqcMn/V2
          cQbxsd0SxHpJo1kGYVmUbDtbptl7ks6G/tnJ6XrrtO/Y/+gNH26dinUFQB139kmu
          nElirh1Di62KreznOg7duccoBVI/CoSf2lUBHYCcbDsnj//rhxfKsWF1xioG2bdj
          TjPAlWkjKFJOoitCc9Wt6L76k8yqOv1P31KNPs//GXVTct55VshntSeQbZS3/Vii
          D83bz8IiJCA7rdjyr6eK44jl++wyc6lLXe6b3rrMPE9Z30b6VCBd3LkYMUdFt8xK
          j0mO1THQf0FMnEGnWnn0FHIwkD5fI6A03gfn94vmDUuVpnb5VkPE0B9tBmBUxyaM
          KN8N+fOQZ/rE/OTBd8WQiremQTHhVXFiQiQCUOrD+jX1GRRB/KZIE9UzMX4nODO5
          XhRhmH6aUczb9KPi5qLqdAeyo/ubzlPi5fgdA07Kl8q9P6nn79VMnY7DMEtkrjCl
          jhV/2Tw=
          -----END CERTIFICATE-----
          PEM
          openssl x509 -in cert.pem -noout -fingerprint -sha256

      - name: Acquire source pages and full-page production OCR
        run: |
          set -euo pipefail
          mkdir -p private_bundle
          for n in 002 003 018; do
            curl -fsSL --retry 3 --connect-timeout 15 --max-time 90 "https://historico.conaliteg.gob.mx/c/H1993P5CI200/${n}.jpg" -o "private_bundle/${n}.jpg"
          done
          python3 - <<'PY'
          from PIL import Image
          for n in ('002','003','018'):
              with Image.open(f'private_bundle/{n}.jpg') as im:
                  assert im.size == (797,1045), (n, im.size)
          PY
          for n in 002 003 018; do
            tesseract "private_bundle/${n}.jpg" "private_bundle/${n}" -l spa --psm 3 txt tsv >/dev/null 2>"private_bundle/${n}.stderr"
          done

      - name: Write manifests
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib,json
          from pathlib import Path
          pages=[('LTMD-CER-1993-LEGAL','002','LTMD-CN5-G1993-VP002'),('LTMD-CER-1993-TOC','003','LTMD-CN5-G1993-VP003'),('LTMD-CER-1993-Q1_1','018','LTMD-CN5-G1993-VP018')]
          ver=Path('version.txt').read_text().strip(); pub=[]
          for sid,n,pid in pages:
              b=Path(f'private_bundle/{n}.jpg').read_bytes()
              pub.append({'sample_id':sid,'page_id':pid,'viewer_page':int(n),'selected_psm':3,'tesseract_version':ver,'source_sha256':hashlib.sha256(b).hexdigest(),'source_bytes':len(b),'full_page_text_chars':len(Path(f'private_bundle/{n}.txt').read_text(encoding='utf-8')),'tsv_chars':len(Path(f'private_bundle/{n}.tsv').read_text(encoding='utf-8'))})
          Path('private_bundle/private_manifest.json').write_text(json.dumps({'pages':pub},ensure_ascii=False,indent=2),encoding='utf-8')
          Path('manifest.json').write_text(json.dumps({'transport':'encrypted tar bundle containing private source JPEG + production full-page TXT/TSV','certificate_fingerprint_sha256':'E6:82:0E:7C:54:33:30:17:F7:E1:A9:76:16:A3:C7:48:9D:AC:D3:4F:C3:F5:5D:3E:FA:08:C6:99:0E:43:A5:55','pages':pub},ensure_ascii=False,indent=2),encoding='utf-8')
          PY

      - name: Encrypt and erase plaintext
        run: |
          set -euo pipefail
          tar -czf private_bundle.tar.gz private_bundle/
          openssl cms -encrypt -binary -aes256 -in private_bundle.tar.gz -outform DER -out payload.p7m cert.pem
          sha256sum payload.p7m > ciphertext.sha256
          rm -rf private_bundle private_bundle.tar.gz cert.pem version.txt
          test ! -d private_bundle

      - name: Upload ciphertext and manifest only
        uses: actions/upload-artifact@v4
        with:
          name: ltmd-cer-1993-batch1-private-bundle-encrypted
          path: |
            payload.p7m
            manifest.json
            ciphertext.sha256
          retention-days: 1
          if-no-files-found: error

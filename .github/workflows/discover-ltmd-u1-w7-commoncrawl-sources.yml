name: discover-ltmd-u1-w7-commoncrawl-sources

on:
  workflow_dispatch:
  push:
    paths:
      - 'scripts/discover_ltmd_u1_w7_commoncrawl_sources.py'
      - '.github/workflows/discover-ltmd-u1-w7-commoncrawl-sources.yml'

concurrency:
  group: ltmd-u1-w7-commoncrawl-source-discovery
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  discover:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Query exact institutional URIs in Common Crawl
        run: python3 scripts/discover_ltmd_u1_w7_commoncrawl_sources.py
      - name: Publish Common Crawl discovery race-safely
        run: |
          set -euo pipefail
          rm -rf /tmp/ltmd-w7-commoncrawl
          mkdir -p /tmp/ltmd-w7-commoncrawl
          cp data/catalog/ltmd_u1_w7_commoncrawl_source_discovery.csv /tmp/ltmd-w7-commoncrawl/
          cp data/catalog/ltmd_u1_w7_commoncrawl_source_discovery.md /tmp/ltmd-w7-commoncrawl/
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          for attempt in 1 2 3; do
            git fetch origin main
            git reset --hard origin/main
            cp /tmp/ltmd-w7-commoncrawl/* data/catalog/
            git add data/catalog/ltmd_u1_w7_commoncrawl_source_discovery.csv \
                    data/catalog/ltmd_u1_w7_commoncrawl_source_discovery.md
            if git diff --cached --quiet; then exit 0; fi
            git commit -m 'Publish LTMD U1 W7 Common Crawl source discovery'
            if git push origin HEAD:main; then exit 0; fi
            sleep $((attempt * 2))
          done
          exit 1

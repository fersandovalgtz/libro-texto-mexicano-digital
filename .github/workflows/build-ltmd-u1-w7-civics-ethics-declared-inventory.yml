name: build-ltmd-u1-w7-civics-ethics-declared-inventory

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/build-ltmd-u1-w7-civics-ethics-declared-inventory.yml'
  workflow_run:
    workflows: ['audit-ltmd-u1-w7-civics-ethics-architecture']
    types: [completed]

permissions:
  contents: write

jobs:
  build:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - run: python3 scripts/build_ltmd_u1_w7_civics_ethics_declared_inventory.py
      - name: Publish W7 declared inventory race-safely
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/w7-declared
          cp data/catalog/ltmd_u1_w7_declared_inventory.csv /tmp/w7-declared/
          cp data/catalog/ltmd_u1_w7_declared_inventory_summary.csv /tmp/w7-declared/
          cp data/catalog/ltmd_u1_w7_declared_inventory.md /tmp/w7-declared/
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          for attempt in 1 2 3; do
            git fetch origin main
            git reset --hard origin/main
            cp /tmp/w7-declared/* data/catalog/
            git add data/catalog/ltmd_u1_w7_declared_inventory.csv data/catalog/ltmd_u1_w7_declared_inventory_summary.csv data/catalog/ltmd_u1_w7_declared_inventory.md
            if git diff --cached --quiet; then exit 0; fi
            git commit -m 'Publish LTMD-U1 W7 Civics Ethics declared inventory'
            if git push origin HEAD:main; then exit 0; fi
            sleep $((attempt * 2))
          done
          exit 1

name: analyze-ltmd-u1-w7-civics-ethics-exact-reuse

on:
  workflow_dispatch:
    inputs:
      pipeline:
        description: 'Allow explicit W7 pipeline execution'
        required: true
        default: false
        type: boolean

permissions:
  actions: write
  contents: write

concurrency:
  group: analyze-ltmd-u1-w7-civics-ethics-exact-reuse
  cancel-in-progress: false

jobs:
  analyze:
    if: ${{ inputs.pipeline == true }}
    runs-on: ubuntu-24.04
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Analyze W7 exact fragment reuse
        run: python3 scripts/analyze_ltmd_u1_w7_civics_ethics_exact_reuse.py
      - name: Publish W7 exact-reuse analysis race-safely
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/w7-exact
          mkdir -p /tmp/w7-exact
          cp data/catalog/ltmd_u1_w7_civics_ethics_exact_content_units.csv /tmp/w7-exact/
          cp data/catalog/ltmd_u1_w7_civics_ethics_exact_viewer_overlap.csv /tmp/w7-exact/
          cp data/catalog/ltmd_u1_w7_civics_ethics_exact_reuse.md /tmp/w7-exact/
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          for attempt in 1 2 3; do
            git fetch origin main
            git reset --hard origin/main
            cp /tmp/w7-exact/* data/catalog/
            git add data/catalog/ltmd_u1_w7_civics_ethics_exact_content_units.csv data/catalog/ltmd_u1_w7_civics_ethics_exact_viewer_overlap.csv data/catalog/ltmd_u1_w7_civics_ethics_exact_reuse.md
            if git diff --cached --quiet; then exit 0; fi
            git commit -m 'Publish LTMD-U1 W7 Civics Ethics exact-reuse analysis'
            if git push origin HEAD:main; then exit 0; fi
            sleep $((attempt * 2))
          done
          exit 1
      - name: Dispatch W7 technical completion
        run: gh workflow run build-ltmd-u1-w7-completion-report.yml --repo "$GITHUB_REPOSITORY" --ref main -f pipeline=true

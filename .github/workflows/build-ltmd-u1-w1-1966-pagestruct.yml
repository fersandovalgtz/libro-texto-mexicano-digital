name: build-ltmd-u1-w1-1966-pagestruct

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/build-ltmd-u1-w1-1966-pagestruct.yml'
      - 'scripts/extract_ltmd_u1_w1_1966_structural_flags_book.py'
      - 'scripts/combine_ltmd_u1_w1_1966_structural_flags.py'
      - 'scripts/classify_ltmd_u1_w1_1966_page_structure.py'
      - 'data/catalog/ltmd_u1_w1_1966_ocr_metrics.csv'

permissions:
  contents: write

jobs:
  flags:
    strategy:
      fail-fast: false
      matrix:
        book_id:
          - U1-H1966P6CI374
          - U1-H1966P6CI375
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Require published OCR layer
        run: test -f data/catalog/ltmd_u1_w1_1966_ocr_metrics.csv
      - name: Install Spanish Tesseract
        run: |
          sudo apt-get update
          sudo apt-get install -y tesseract-ocr tesseract-ocr-spa
      - name: Extract structural flags from front/end zones
        run: python3 scripts/extract_ltmd_u1_w1_1966_structural_flags_book.py --book-id '${{ matrix.book_id }}'
      - uses: actions/upload-artifact@v7
        with:
          name: ltmd-u1-w1-1966-struct-${{ matrix.book_id }}
          path: data/work/ltmd_u1_w1_1966_structkw/*.csv
          if-no-files-found: error
          retention-days: 1

  classify:
    needs: flags
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Require published OCR layer
        run: test -f data/catalog/ltmd_u1_w1_1966_ocr_metrics.csv
      - uses: actions/download-artifact@v4
        with:
          pattern: ltmd-u1-w1-1966-struct-*
          path: data/work/ltmd_u1_w1_1966_structkw
          merge-multiple: true
      - name: Combine structural flags
        run: python3 scripts/combine_ltmd_u1_w1_1966_structural_flags.py
      - name: Classify all 340 source pages
        run: python3 scripts/classify_ltmd_u1_w1_1966_page_structure.py
      - name: Publish PAGESTRUCT race-safely
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/ltmd-u1-w1-1966-pagestruct
          cp data/catalog/ltmd_u1_w1_1966_structural_keyword_flags.csv /tmp/ltmd-u1-w1-1966-pagestruct/
          cp data/catalog/ltmd_u1_w1_1966_page_structure.csv /tmp/ltmd-u1-w1-1966-pagestruct/
          cp data/catalog/ltmd_u1_w1_1966_page_structure_summary.csv /tmp/ltmd-u1-w1-1966-pagestruct/
          cp data/catalog/ltmd_u1_w1_1966_page_structure.md /tmp/ltmd-u1-w1-1966-pagestruct/
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          for attempt in 1 2 3; do
            git fetch origin main
            git reset --hard origin/main
            cp /tmp/ltmd-u1-w1-1966-pagestruct/* data/catalog/
            git add data/catalog/ltmd_u1_w1_1966_structural_keyword_flags.csv data/catalog/ltmd_u1_w1_1966_page_structure.csv data/catalog/ltmd_u1_w1_1966_page_structure_summary.csv data/catalog/ltmd_u1_w1_1966_page_structure.md
            if git diff --cached --quiet; then exit 0; fi
            git commit -m 'Publish LTMD-U1 W1 1966 PAGESTRUCT'
            if git push origin HEAD:main; then exit 0; fi
            sleep $((attempt * 2))
          done
          exit 1

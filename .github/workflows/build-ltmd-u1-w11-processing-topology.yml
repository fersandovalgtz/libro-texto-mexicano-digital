name: build-ltmd-u1-w11-processing-topology

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/build-ltmd-u1-w11-processing-topology.yml'
      - 'scripts/build_ltmd_u1_w11_processing_topology.py'
      - 'data/catalog/ltmd_u1_w11_source_admissibility.csv'
  workflow_run:
    workflows: ['build-ltmd-u1-w11-source-admissibility']
    types: [completed]

permissions:
  contents: write

concurrency:
  group: build-ltmd-u1-w11-processing-topology
  cancel-in-progress: false

jobs:
  build:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: ready
        shell: bash
        run: |
          if [[ -f data/catalog/ltmd_u1_w11_source_admissibility.csv && -f data/catalog/ltmd_u1_w11_standard_asset_manifest.csv && -f data/catalog/ltmd_u1_w11_nonstandard_asset_manifest.csv ]]; then
            echo 'ready=true' >> "$GITHUB_OUTPUT"
          else
            echo 'ready=false' >> "$GITHUB_OUTPUT"
            echo 'W11 topology prerequisites are not all published yet.'
          fi
      - name: Build cross-route W11 topology
        if: steps.ready.outputs.ready == 'true'
        run: python3 scripts/build_ltmd_u1_w11_processing_topology.py
      - name: Publish W11 topology race-safely
        if: steps.ready.outputs.ready == 'true'
        shell: bash
        run: |
          set -euo pipefail
          cp data/catalog/ltmd_u1_w11_processing_inventory.csv /tmp/ltmd_u1_w11_processing_inventory.csv
          cp data/catalog/ltmd_u1_w11_canonical_page_manifest.csv /tmp/ltmd_u1_w11_canonical_page_manifest.csv
          cp docs/LTMD_U1_W11_PROCESSING_TOPOLOGY.md /tmp/LTMD_U1_W11_PROCESSING_TOPOLOGY.md
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          for attempt in 1 2 3; do
            git fetch origin main
            git reset --hard origin/main
            cp /tmp/ltmd_u1_w11_processing_inventory.csv data/catalog/
            cp /tmp/ltmd_u1_w11_canonical_page_manifest.csv data/catalog/
            cp /tmp/LTMD_U1_W11_PROCESSING_TOPOLOGY.md docs/
            git add data/catalog/ltmd_u1_w11_processing_inventory.csv data/catalog/ltmd_u1_w11_canonical_page_manifest.csv docs/LTMD_U1_W11_PROCESSING_TOPOLOGY.md
            if git diff --cached --quiet; then exit 0; fi
            git commit -m 'data(w11): publish byte-exact processing topology'
            if git push origin HEAD:main; then exit 0; fi
            sleep $((attempt*2))
          done
          exit 1

name: Build reproducibility snapshot

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/build-reproducibility-snapshot.yml'

permissions:
  contents: write

jobs:
  snapshot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Build cryptographic manifest
        run: |
          python scripts/build_reproducibility_manifest.py \
            --source-commit "$GITHUB_SHA"
      - name: Validate manifest
        run: |
          python - <<'PY'
          import csv
          rows=list(csv.DictReader(open('data/derived/reproducibility_manifest.csv',encoding='utf-8')))
          assert len(rows)==21, len(rows)
          assert all(len(r['sha256'])==64 for r in rows)
          expected={
            'data/derived/ocr_page_metrics.csv':'759',
            'data/samples/ocr_cer_wer_page_sample.csv':'48',
            'data/samples/ocr_cer_wer_stress_sample.csv':'12',
            'data/samples/human_validation_page_pool.csv':'100',
            'data/derived/fragments_schema.csv':'0',
          }
          found={r['path']:r['csv_data_rows'] for r in rows}
          for path,n in expected.items():
            assert found[path]==n,(path,found[path],n)
          commits={r['snapshot_source_commit'] for r in rows}
          assert commits=={__import__('os').environ['GITHUB_SHA']}
          print('Validated reproducibility manifest:',len(rows),'files')
          PY
      - name: Commit snapshot
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/derived/reproducibility_manifest.csv
          git commit -m "repro: freeze pre-validation technical snapshot"
          git push

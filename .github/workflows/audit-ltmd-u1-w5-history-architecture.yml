name: audit-ltmd-u1-w5-history-architecture

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/audit-ltmd-u1-w5-history-architecture.yml'
      - 'scripts/build_ltmd_u1_w5_history_scope.py'
      - 'scripts/audit_ltmd_u1_w5_history_architecture.py'
      - 'data/catalog/ltmd_u1_wave_queue.csv'

permissions:
  contents: write

jobs:
  audit:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Freeze exact W5 scope
        run: python3 scripts/build_ltmd_u1_w5_history_scope.py
      - name: Audit W5 viewer architecture only
        run: python3 scripts/audit_ltmd_u1_w5_history_architecture.py
      - name: Publish W5 scope and architecture race-safely
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/ltmd-w5
          cp data/catalog/ltmd_u1_w5_scope.csv /tmp/ltmd-w5/
          cp data/catalog/ltmd_u1_w5_scope.md /tmp/ltmd-w5/
          cp data/catalog/ltmd_u1_w5_viewer_architecture.csv /tmp/ltmd-w5/
          cp data/catalog/ltmd_u1_w5_viewer_architecture.md /tmp/ltmd-w5/
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          for attempt in 1 2 3; do
            git fetch origin main
            git reset --hard origin/main
            cp /tmp/ltmd-w5/* data/catalog/
            git add data/catalog/ltmd_u1_w5_scope.csv data/catalog/ltmd_u1_w5_scope.md data/catalog/ltmd_u1_w5_viewer_architecture.csv data/catalog/ltmd_u1_w5_viewer_architecture.md
            if git diff --cached --quiet; then exit 0; fi
            git commit -m 'Publish LTMD-U1 W5 History scope and architecture audit'
            if git push origin HEAD:main; then exit 0; fi
            sleep $((attempt * 2))
          done
          exit 1

name: build-ltmd-u1-w11-ocr

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/build-ltmd-u1-w11-ocr.yml'
      - 'scripts/ocr_ltmd_u1_w11_book.py'
      - 'scripts/combine_ltmd_u1_w11_ocr.py'
      - 'data/catalog/ltmd_u1_w11_processing_inventory.csv'
      - 'data/catalog/ltmd_u1_w11_canonical_page_manifest.csv'
  workflow_run:
    workflows: ['build-ltmd-u1-w11-processing-topology']
    types: [completed]

permissions:
  contents: write

concurrency:
  group: build-ltmd-u1-w11-ocr
  cancel-in-progress: false

env:
  OMP_THREAD_LIMIT: '1'

jobs:
  matrix:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-24.04
    outputs:
      ready: ${{ steps.make.outputs.ready }}
      viewers: ${{ steps.make.outputs.viewers }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Refresh authoritative main before idempotence check
        run: |
          git fetch origin main
          git reset --hard origin/main
      - id: make
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
        run: |
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import csv,json,os
          proc_path='data/catalog/ltmd_u1_w11_processing_inventory.csv'
          man_path='data/catalog/ltmd_u1_w11_canonical_page_manifest.csv'
          if not (os.path.exists(proc_path) and os.path.exists(man_path)):
              print('ready=false');print('viewers=[]');raise SystemExit(0)
          proc=list(csv.DictReader(open(proc_path,encoding='utf-8')));man=list(csv.DictReader(open(man_path,encoding='utf-8')))
          assert len(proc)==111 and len({r['viewer_key'] for r in proc})==111
          assert {r['topology_version'] for r in proc}=={'LTMD_U1_W11_PROCESSING_TOPOLOGY_0.1'}
          keys=sorted(r['viewer_key'] for r in proc if r['source_admitted']=='1' and r['is_canonical_processing_object']=='1')
          assert keys and {r['viewer_key'] for r in man}==set(keys)
          assert {r['manifest_version'] for r in man}=={'LTMD_U1_W11_PROCESSING_TOPOLOGY_0.1'}
          expected=sum(int(r['source_pages']) for r in proc if r['viewer_key'] in set(keys))
          assert len(man)==expected,(len(man),expected)
          assert len({r['page_id'] for r in man})==len(man)
          assert all(r['asset_status']=='source_jpeg' and len(r['sha256'])==64 and int(r['byte_size'])>0 for r in man)
          metrics_path='data/catalog/ltmd_u1_w11_ocr_metrics.csv'
          summary_path='data/catalog/ltmd_u1_w11_ocr_summary.csv'
          report_path='docs/LTMD_U1_W11_OCR.md'
          if os.environ.get('EVENT_NAME')!='workflow_dispatch' and all(os.path.exists(p) for p in [metrics_path,summary_path,report_path]):
              metrics=list(csv.DictReader(open(metrics_path,encoding='utf-8')))
              summary=list(csv.DictReader(open(summary_path,encoding='utf-8')))
              current_pages={r['page_id'] for r in man}
              complete=(len(metrics)==len(man) and {r['page_id'] for r in metrics}==current_pages and
                        {r['ocr_version'] for r in metrics}=={'LTMD_U1_W11_OCR_0.1'} and
                        all(r['source_sha256_verified']=='1' and r['ocr_status']=='ok' and r['ocr_class']!='unresolved' for r in metrics) and
                        len(summary)==len(keys) and sum(int(r['pages']) for r in summary)==len(man))
              if complete:
                  print('ready=false');print('viewers=[]');raise SystemExit(0)
          print('ready=true');print('viewers='+json.dumps(keys,separators=(',',':')))
          PY

  ocr:
    needs: matrix
    if: needs.matrix.outputs.ready == 'true'
    strategy:
      fail-fast: false
      max-parallel: 8
      matrix:
        viewer_key: ${{ fromJSON(needs.matrix.outputs.viewers) }}
    runs-on: ubuntu-24.04
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v7
      - name: Install Spanish Tesseract
        run: |
          sudo apt-get update
          sudo apt-get install -y tesseract-ocr tesseract-ocr-spa
      - name: OCR one canonical W11 viewer
        run: python3 scripts/ocr_ltmd_u1_w11_book.py --viewer-key '${{ matrix.viewer_key }}'
      - uses: actions/upload-artifact@v4
        with:
          name: ltmd-u1-w11-ocr-${{ matrix.viewer_key }}
          path: data/work/ltmd_u1_w11_ocr/*.csv
          if-no-files-found: error
          retention-days: 1

  combine:
    needs: [matrix,ocr]
    if: needs.matrix.outputs.ready == 'true'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@v4
        with:
          pattern: ltmd-u1-w11-ocr-*
          path: data/work/ltmd_u1_w11_ocr
          merge-multiple: true
      - name: Combine topology-authoritative W11 OCR
        run: python3 scripts/combine_ltmd_u1_w11_ocr.py
      - name: Publish W11 OCR metrics race-safely
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/w11-ocr;mkdir -p /tmp/w11-ocr
          cp data/catalog/ltmd_u1_w11_ocr_metrics.csv /tmp/w11-ocr/
          cp data/catalog/ltmd_u1_w11_ocr_summary.csv /tmp/w11-ocr/
          cp docs/LTMD_U1_W11_OCR.md /tmp/w11-ocr/
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          for attempt in 1 2 3; do
            git fetch origin main
            git reset --hard origin/main
            cp /tmp/w11-ocr/ltmd_u1_w11_ocr_metrics.csv data/catalog/
            cp /tmp/w11-ocr/ltmd_u1_w11_ocr_summary.csv data/catalog/
            cp /tmp/w11-ocr/LTMD_U1_W11_OCR.md docs/
            git add data/catalog/ltmd_u1_w11_ocr_metrics.csv data/catalog/ltmd_u1_w11_ocr_summary.csv docs/LTMD_U1_W11_OCR.md
            if git diff --cached --quiet; then exit 0; fi
            git commit -m 'data(w11): publish topology-driven OCR metrics'
            if git push origin HEAD:main; then exit 0; fi
            sleep $((attempt*2))
          done
          exit 1

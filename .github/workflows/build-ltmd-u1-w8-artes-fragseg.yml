name: build-ltmd-u1-w8-artes-fragseg

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/build-ltmd-u1-w8-artes-fragseg.yml'
      - 'scripts/segment_ltmd_u1_w8_artes_fragments.py'
      - 'scripts/combine_ltmd_u1_w8_artes_fragment_shards.py'
      - 'data/catalog/ltmd_u1_w8_artes_page_structure.csv'
      - 'data/catalog/ltmd_u1_w8_artes_page_structure_summary.csv'
      - 'data/catalog/ltmd_u1_w8_artes_page_structure.md'

permissions:
  contents: write

env:
  OMP_THREAD_LIMIT: '1'

concurrency:
  group: build-ltmd-u1-w8-artes-fragseg
  cancel-in-progress: false

jobs:
  matrix:
    runs-on: ubuntu-24.04
    outputs:
      viewers: ${{ steps.make.outputs.viewers }}
    steps:
      - uses: actions/checkout@v4
      - id: make
        shell: bash
        run: |
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import csv,json
          rows=list(csv.DictReader(open('data/catalog/ltmd_u1_w8_artes_page_structure.csv',encoding='utf-8')))
          proc=list(csv.DictReader(open('data/catalog/ltmd_u1_w8_processing_inventory.csv',encoding='utf-8')))
          keys=sorted({r['viewer_key'] for r in rows})
          expected={r['viewer_key'] for r in proc if r['ocr_identity_eligible']=='1' and r['is_canonical_processing_object']=='1'}
          assert len(proc)==20 and len([r for r in proc if r['ocr_identity_eligible']=='0'])==4
          assert len(rows)==1490 and len(keys)==16 and set(keys)==expected
          assert {r['classifier_version'] for r in rows}=={'PAGESTRUCT_LTMD_U1_W8_ARTES_0.1'}
          eligible={k:0 for k in keys}
          for r in rows:
              if r['primary_structure'] in {'textual','mixed_text_image'}: eligible[r['viewer_key']]+=1
          assert sum(eligible.values())==1025, sum(eligible.values())
          bad=[k for k,n in eligible.items() if n==0]
          if bad: raise SystemExit(f'W8 FRAGSEG gate closed: viewers without eligible pages={bad}')
          print('viewers='+json.dumps(keys,separators=(',',':')))
          PY

  fragment:
    needs: matrix
    strategy:
      fail-fast: false
      max-parallel: 8
      matrix:
        viewer_key: ${{ fromJSON(needs.matrix.outputs.viewers) }}
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - name: Install Spanish Tesseract
        run: |
          sudo apt-get update
          sudo apt-get install -y tesseract-ocr tesseract-ocr-spa
      - name: Segment one canonical W8 viewer
        run: python3 scripts/segment_ltmd_u1_w8_artes_fragments.py --viewer-key '${{ matrix.viewer_key }}'
      - uses: actions/upload-artifact@v7
        with:
          name: ltmd-u1-w8-artes-fragments-${{ matrix.viewer_key }}
          path: data/work/ltmd_u1_w8_artes_fragments/*.csv
          if-no-files-found: error
          retention-days: 1

  combine:
    needs: fragment
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@v4
        with:
          pattern: ltmd-u1-w8-artes-fragments-*
          path: data/work/ltmd_u1_w8_artes_fragments
          merge-multiple: true
      - name: Combine exact 16-viewer W8 FRAGSEG layer
        run: python3 scripts/combine_ltmd_u1_w8_artes_fragment_shards.py
      - name: Publish W8 FRAGSEG 0.1 race-safely
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/w8-fragseg
          mkdir -p /tmp/w8-fragseg
          cp data/catalog/ltmd_u1_w8_artes_fragment_manifest.csv /tmp/w8-fragseg/
          cp data/catalog/ltmd_u1_w8_artes_fragment_manifest_summary.csv /tmp/w8-fragseg/
          cp data/catalog/ltmd_u1_w8_artes_fragment_sequence_gaps.csv /tmp/w8-fragseg/
          cp data/catalog/ltmd_u1_w8_artes_fragment_manifest.md /tmp/w8-fragseg/
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          for attempt in 1 2 3; do
            git fetch origin main
            git reset --hard origin/main
            cp /tmp/w8-fragseg/* data/catalog/
            git add data/catalog/ltmd_u1_w8_artes_fragment_manifest.csv data/catalog/ltmd_u1_w8_artes_fragment_manifest_summary.csv data/catalog/ltmd_u1_w8_artes_fragment_sequence_gaps.csv data/catalog/ltmd_u1_w8_artes_fragment_manifest.md
            if git diff --cached --quiet; then exit 0; fi
            git commit -m 'Publish LTMD-U1 W8 Artes FRAGSEG 0.1'
            if git push origin HEAD:main; then exit 0; fi
            sleep $((attempt * 2))
          done
          exit 1

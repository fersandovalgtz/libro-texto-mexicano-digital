name: build-ltmd-u1-w7-completion-report

on:
  workflow_dispatch:
  workflow_run:
    workflows: ['analyze-ltmd-u1-w7-civics-ethics-exact-reuse']
    types: [completed]

permissions:
  contents: write

concurrency:
  group: build-ltmd-u1-w7-completion-report
  cancel-in-progress: false

jobs:
  validate:
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Validate and build W7 admitted-cohort completion report
        run: python3 scripts/build_ltmd_u1_w7_completion_report.py
      - name: Publish W7 completion report race-safely
        shell: bash
        run: |
          set -euo pipefail
          cp docs/LTMD_U1_W7_COMPLETION.md /tmp/LTMD_U1_W7_COMPLETION.md
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          for attempt in 1 2 3; do
            git fetch origin main
            git reset --hard origin/main
            cp /tmp/LTMD_U1_W7_COMPLETION.md docs/LTMD_U1_W7_COMPLETION.md
            git add docs/LTMD_U1_W7_COMPLETION.md
            if git diff --cached --quiet; then exit 0; fi
            git commit -m 'Publish LTMD-U1 W7 admitted-cohort technical completion report'
            if git push origin HEAD:main; then exit 0; fi
            sleep $((attempt * 2))
          done
          exit 1

name: close-stuck-ltmd-u1-w2-source-run

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/close-stuck-ltmd-u1-w2-source-run.yml'

permissions:
  actions: write
  contents: read

jobs:
  close:
    runs-on: ubuntu-24.04
    env:
      SOURCE_RUN_ID: '31923111570'
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Verify all instantiated source jobs are terminal and successful
        shell: bash
        run: |
          set -euo pipefail
          json="$(gh api --paginate "repos/$GITHUB_REPOSITORY/actions/runs/$SOURCE_RUN_ID/jobs?per_page=100")"
          python3 - "$json" <<'PY'
          import json,sys
          data=json.loads(sys.argv[1])
          jobs=data['jobs']
          assert len(jobs)==65, f'expected matrix + 64 audit jobs, got {len(jobs)}'
          bad=[(j['name'],j['status'],j['conclusion']) for j in jobs if j['status']!='completed' or j['conclusion']!='success']
          assert not bad, f'non-success source jobs: {bad[:10]}'
          print('verified 65/65 instantiated source jobs completed success')
          PY
      - name: Cancel orchestration shell only after successful shard verification
        shell: bash
        run: |
          set -euo pipefail
          status="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$SOURCE_RUN_ID" --jq .status)"
          echo "source run status before close: $status"
          if [ "$status" != completed ]; then
            gh api --method POST "repos/$GITHUB_REPOSITORY/actions/runs/$SOURCE_RUN_ID/cancel" || true
          fi
          for i in $(seq 1 12); do
            status="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$SOURCE_RUN_ID" --jq .status)"
            conclusion="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$SOURCE_RUN_ID" --jq '.conclusion // ""')"
            echo "poll $i: status=$status conclusion=$conclusion"
            if [ "$status" = completed ]; then exit 0; fi
            sleep 5
          done
          echo 'source run did not become completed after verified cancellation' >&2
          exit 1

name: ocr-cn46-expansion-metrics

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/ocr-cn46-expansion-metrics.yml'
      - 'scripts/ocr_cn46_expansion_metrics.py'
      - 'data/expansion/cn46_page_manifest.csv'

permissions:
  contents: write

jobs:
  ocr:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      OMP_THREAD_LIMIT: '1'
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Install pinned OCR runtime
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq tesseract-ocr tesseract-ocr-spa
          tesseract --version | head -1
      - name: Run hash-verified adaptive OCR metrics
        run: python3 scripts/ocr_cn46_expansion_metrics.py
      - name: Publish OCR metrics race-safely
        run: |
          set -euo pipefail
          cp data/expansion/cn46_ocr_page_metrics.csv /tmp/cn46_ocr_page_metrics.csv
          cp data/expansion/cn46_ocr_summary.csv /tmp/cn46_ocr_summary.csv
          cp data/expansion/cn46_ocr_report.md /tmp/cn46_ocr_report.md
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          for attempt in 1 2 3; do
            git fetch origin main
            git reset --hard origin/main
            mkdir -p data/expansion
            cp /tmp/cn46_ocr_page_metrics.csv data/expansion/
            cp /tmp/cn46_ocr_summary.csv data/expansion/
            cp /tmp/cn46_ocr_report.md data/expansion/
            git add data/expansion/cn46_ocr_page_metrics.csv data/expansion/cn46_ocr_summary.csv data/expansion/cn46_ocr_report.md
            if git diff --cached --quiet; then exit 0; fi
            git commit -m 'Publish hash-verified CN4/CN6 OCR metrics'
            if git push origin HEAD:main; then exit 0; fi
            sleep $((attempt * 2))
          done
          exit 1

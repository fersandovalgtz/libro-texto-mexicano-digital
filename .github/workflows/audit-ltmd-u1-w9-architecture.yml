name: audit-ltmd-u1-w9-architecture

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/audit-ltmd-u1-w9-architecture.yml'
      - 'scripts/audit_ltmd_u1_w9_educacion_fisica_architecture.py'
      - 'data/catalog/ltmd_u1_w9_scope.csv'

permissions:
  contents: write

concurrency:
  group: audit-ltmd-u1-w9-architecture
  cancel-in-progress: false

jobs:
  audit:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Audit W9 viewer architecture
        run: python3 scripts/audit_ltmd_u1_w9_educacion_fisica_architecture.py
      - name: Verify architecture contract
        run: |
          python3 - <<'PY'
          import csv
          rows=list(csv.DictReader(open('data/catalog/ltmd_u1_w9_viewer_architecture.csv',encoding='utf-8')))
          assert len(rows)==4 and len({r['viewer_key'] for r in rows})==4
          assert {r['architecture_version'] for r in rows}=={'LTMD_U1_W9_ARCHITECTURE_0.1'}
          print('W9 architecture rows=',len(rows),'standard=',sum(r['standard_dynamic_architecture']=='1' for r in rows))
          PY
      - name: Publish architecture products
        shell: bash
        run: |
          set -euo pipefail
          cp data/catalog/ltmd_u1_w9_viewer_architecture.csv /tmp/
          cp data/catalog/ltmd_u1_w9_viewer_architecture.md /tmp/
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          for attempt in 1 2 3; do
            git fetch origin main
            git reset --hard origin/main
            cp /tmp/ltmd_u1_w9_viewer_architecture.csv data/catalog/
            cp /tmp/ltmd_u1_w9_viewer_architecture.md data/catalog/
            git add data/catalog/ltmd_u1_w9_viewer_architecture.csv data/catalog/ltmd_u1_w9_viewer_architecture.md
            if git diff --cached --quiet; then exit 0; fi
            git commit -m 'data(w9): publish physical-education architecture audit'
            if git push origin HEAD:main; then exit 0; fi
            sleep $((attempt*2))
          done
          exit 1

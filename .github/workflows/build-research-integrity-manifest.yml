name: build-research-integrity-manifest

# Transitional freeze: LTMD_INTEGRITY_0.14 remains the current published
# integrity snapshot while W10 is still incomplete. Automatic regeneration is
# deliberately paused so intermediate W10 commits cannot blur the perimeter of
# the frozen 0.14 snapshot. After W10 technical closure this workflow is promoted
# to the gated 0.15 builder and its normal automatic triggers are restored.
on:
  workflow_dispatch:

concurrency:
  group: ltmd-research-integrity-manifest
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  integrity:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Build frozen integrity manifest 0.14
        run: python3 scripts/build_research_integrity_manifest_v14.py
      - name: Publish integrity manifest race-safely
        run: |
          set -euo pipefail
          rm -rf /tmp/ltmd-integrity
          mkdir -p /tmp/ltmd-integrity
          cp data/derived/research_integrity_manifest.json /tmp/ltmd-integrity/
          cp data/derived/research_integrity_manifest.md /tmp/ltmd-integrity/
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          for attempt in 1 2 3; do
            git fetch origin main
            git reset --hard origin/main
            cp /tmp/ltmd-integrity/* data/derived/
            git add data/derived/research_integrity_manifest.json data/derived/research_integrity_manifest.md
            if git diff --cached --quiet; then exit 0; fi
            git commit -m 'Publish LTMD research integrity manifest 0.14'
            if git push origin HEAD:main; then exit 0; fi
            sleep $((attempt * 2))
          done
          exit 1

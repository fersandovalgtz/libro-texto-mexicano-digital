name: Summarize OCR structure by quartile

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/summarize-ocr-structure.yml'

permissions:
  contents: write

jobs:
  summarize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build technical quartile summary
        run: python scripts/summarize_ocr_structure_by_quartile.py
      - name: Validate and commit
        run: |
          python - <<'PY'
          import csv
          rows=list(csv.DictReader(open('data/derived/ocr_structure_by_quartile.csv',encoding='utf-8')))
          assert len(rows)==16, len(rows)
          assert sum(int(r['source_assets']) for r in rows)==759
          assert sum(int(r['text_pages']) for r in rows)==757
          assert sum(int(r['fallback_pages']) for r in rows)==59
          print('Validated 16 generation-quartile cells')
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/derived/ocr_structure_by_quartile.csv
          git commit -m "analysis: add OCR technical profile by quartile"
          git push

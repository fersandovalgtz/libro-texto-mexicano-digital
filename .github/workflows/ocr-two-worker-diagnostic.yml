name: Two-worker OCR diagnostic

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/ocr-two-worker-diagnostic.yml'

permissions:
  contents: read

jobs:
  diagnostic:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      OMP_THREAD_LIMIT: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Install Spanish Tesseract model
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq tesseract-ocr tesseract-ocr-spa
      - name: Build page manifest
        run: python scripts/build_page_manifest.py
      - name: Run two-worker OCR diagnostic
        run: python scripts/ocr_adaptive_metrics.py --slots q1_1,q4_2 --modes 3 --timeout 60 --workers 2 --output data/derived/ocr_two_worker_diagnostic.csv
      - name: Show metrics
        run: cat data/derived/ocr_two_worker_diagnostic.csv
      - name: Upload metrics only
        uses: actions/upload-artifact@v4
        with:
          name: ocr-two-worker-diagnostic
          path: data/derived/ocr_two_worker_diagnostic.csv
          retention-days: 30

name: audit-ltmd-u1-w7-bibliographic-candidate-support

on:
  workflow_dispatch:
  push:
    paths:
      - 'scripts/audit_ltmd_u1_w7_bibliographic_candidate_support.py'
      - 'data/catalog/ltmd_u1_w7_admitted_bibliographic_fingerprints.csv'
      - '.github/workflows/audit-ltmd-u1-w7-bibliographic-candidate-support.yml'

concurrency:
  group: ltmd-u1-w7-bibliographic-candidate-support
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  audit:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Audit multipsm candidate support and ISBN checksums
        run: python3 scripts/audit_ltmd_u1_w7_bibliographic_candidate_support.py
      - name: Publish support audit race-safely
        run: |
          set -euo pipefail
          rm -rf /tmp/ltmd-w7-biblio-support
          mkdir -p /tmp/ltmd-w7-biblio-support
          cp data/catalog/ltmd_u1_w7_bibliographic_candidate_support.csv /tmp/ltmd-w7-biblio-support/
          cp data/catalog/ltmd_u1_w7_bibliographic_candidate_support.md /tmp/ltmd-w7-biblio-support/
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          for attempt in 1 2 3; do
            git fetch origin main
            git reset --hard origin/main
            cp /tmp/ltmd-w7-biblio-support/* data/catalog/
            git add data/catalog/ltmd_u1_w7_bibliographic_candidate_support.csv \
                    data/catalog/ltmd_u1_w7_bibliographic_candidate_support.md
            if git diff --cached --quiet; then exit 0; fi
            git commit -m 'Publish LTMD U1 W7 bibliographic candidate-support audit'
            if git push origin HEAD:main; then exit 0; fi
            sleep $((attempt * 2))
          done
          exit 1

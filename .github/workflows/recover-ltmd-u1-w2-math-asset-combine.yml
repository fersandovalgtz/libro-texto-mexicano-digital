name: recover-ltmd-u1-w2-math-asset-combine

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/recover-ltmd-u1-w2-math-asset-combine.yml'

permissions:
  actions: read
  contents: write

jobs:
  recover:
    runs-on: ubuntu-24.04
    env:
      SOURCE_RUN_ID: '31923111570'
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Download all 64 completed audit artifacts from source run
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p data/work/ltmd_u1_w2_math_assets_downloads
          gh run download "$SOURCE_RUN_ID" \
            --repo "$GITHUB_REPOSITORY" \
            --pattern 'ltmd-u1-w2-math-assets-*' \
            --dir data/work/ltmd_u1_w2_math_assets_downloads
          mkdir -p data/work/ltmd_u1_w2_math_assets
          find data/work/ltmd_u1_w2_math_assets_downloads -type f -name 'asset_*.csv' -exec cp {} data/work/ltmd_u1_w2_math_assets/ \;
          count="$(find data/work/ltmd_u1_w2_math_assets -maxdepth 1 -type f -name 'asset_*.csv' | wc -l)"
          test "$count" -eq 64
      - name: Combine exact 64-viewer audit
        run: python3 scripts/combine_ltmd_u1_w2_math_asset_shards.py
      - name: Publish recovered W2 asset audit race-safely
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/ltmd-u1-w2-assets
          cp data/catalog/ltmd_u1_w2_math_asset_manifest.csv /tmp/ltmd-u1-w2-assets/
          cp data/catalog/ltmd_u1_w2_math_asset_summary.csv /tmp/ltmd-u1-w2-assets/
          cp data/catalog/ltmd_u1_w2_math_asset_audit.md /tmp/ltmd-u1-w2-assets/
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          for attempt in 1 2 3; do
            git fetch origin main
            git reset --hard origin/main
            cp /tmp/ltmd-u1-w2-assets/* data/catalog/
            git add data/catalog/ltmd_u1_w2_math_asset_manifest.csv data/catalog/ltmd_u1_w2_math_asset_summary.csv data/catalog/ltmd_u1_w2_math_asset_audit.md
            if git diff --cached --quiet; then exit 0; fi
            git commit -m 'Publish recovered LTMD-U1 W2 mathematics source asset audit'
            if git push origin HEAD:main; then exit 0; fi
            sleep $((attempt * 2))
          done
          exit 1

name: build-ltmd-u1-w5-history-ocr

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/build-ltmd-u1-w5-history-ocr.yml'
      - 'scripts/ocr_ltmd_u1_w5_history_book.py'
      - 'scripts/combine_ltmd_u1_w5_history_ocr.py'
      - 'data/catalog/ltmd_u1_w5_history_processing_inventory.csv'
      - 'data/catalog/ltmd_u1_w5_history_canonical_page_manifest.csv'

permissions:
  contents: write

env:
  OMP_THREAD_LIMIT: '1'

jobs:
  matrix:
    runs-on: ubuntu-24.04
    outputs:
      viewers: ${{ steps.make.outputs.viewers }}
    steps:
      - uses: actions/checkout@v4
      - id: make
        shell: bash
        run: |
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import csv,json
          proc=list(csv.DictReader(open('data/catalog/ltmd_u1_w5_history_processing_inventory.csv',encoding='utf-8')))
          man=list(csv.DictReader(open('data/catalog/ltmd_u1_w5_history_canonical_page_manifest.csv',encoding='utf-8')))
          assert len(proc)==18 and len({r['viewer_key'] for r in proc})==18
          assert all(r['technical_identity_covered']=='1' for r in proc)
          keys=[r['viewer_key'] for r in proc if r['is_canonical_processing_object']=='1']
          aliases=[r for r in proc if r['processing_mode']=='route_alias_to_2019']
          assert len(keys)==15 and len(set(keys))==15
          assert len(aliases)==3 and all(r['is_canonical_processing_object']=='0' for r in aliases)
          assert all(r['processing_mode']=='direct_canonical' for r in proc if r['viewer_key'] in set(keys))
          assert len(man)==2653 and {r['viewer_key'] for r in man}==set(keys)
          assert all(r['asset_status']=='source_jpeg' for r in man)
          print('viewers='+json.dumps(keys,separators=(',',':')))
          PY

  ocr:
    needs: matrix
    strategy:
      fail-fast: false
      max-parallel: 8
      matrix:
        viewer_key: ${{ fromJSON(needs.matrix.outputs.viewers) }}
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4
      - name: Install Spanish Tesseract
        run: |
          sudo apt-get update
          sudo apt-get install -y tesseract-ocr tesseract-ocr-spa
      - name: OCR one canonical W5 History viewer
        run: python3 scripts/ocr_ltmd_u1_w5_history_book.py --viewer-key '${{ matrix.viewer_key }}'
      - uses: actions/upload-artifact@v7
        with:
          name: ltmd-u1-w5-history-ocr-${{ matrix.viewer_key }}
          path: data/work/ltmd_u1_w5_history_ocr/*.csv
          if-no-files-found: error
          retention-days: 1

  combine:
    needs: ocr
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@v4
        with:
          pattern: ltmd-u1-w5-history-ocr-*
          path: data/work/ltmd_u1_w5_history_ocr
          merge-multiple: true
      - name: Combine exact 15-canonical-viewer OCR layer
        run: python3 scripts/combine_ltmd_u1_w5_history_ocr.py
      - name: Publish W5 History OCR 0.1 race-safely
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/ltmd-u1-w5-ocr
          cp data/catalog/ltmd_u1_w5_history_ocr_metrics.csv /tmp/ltmd-u1-w5-ocr/
          cp data/catalog/ltmd_u1_w5_history_ocr_summary.csv /tmp/ltmd-u1-w5-ocr/
          cp data/catalog/ltmd_u1_w5_history_ocr.md /tmp/ltmd-u1-w5-ocr/
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          for attempt in 1 2 3; do
            git fetch origin main
            git reset --hard origin/main
            cp /tmp/ltmd-u1-w5-ocr/* data/catalog/
            git add data/catalog/ltmd_u1_w5_history_ocr_metrics.csv data/catalog/ltmd_u1_w5_history_ocr_summary.csv data/catalog/ltmd_u1_w5_history_ocr.md
            if git diff --cached --quiet; then exit 0; fi
            git commit -m 'Publish LTMD-U1 W5 History OCR 0.1 metrics'
            if git push origin HEAD:main; then exit 0; fi
            sleep $((attempt * 2))
          done
          exit 1

name: Encrypted full-page TSV — 1972 CER batch 1 correction

on:
  push:
    paths:
      - '.github/workflows/cer-fullpage-tsv-1972-batch1.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  extract:
    runs-on: ubuntu-24.04
    env:
      OMP_THREAD_LIMIT: '1'
    steps:
      - name: Install exact production OCR
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq tesseract-ocr tesseract-ocr-spa
          tesseract --version | head -1 | tee tesseract-version.txt
          grep -F 'tesseract 5.3.4' tesseract-version.txt

      - name: Write one-use public certificate
        shell: bash
        run: |
          cat > cert.pem <<'PEM'
          -----BEGIN CERTIFICATE-----
          MIIEkTCCAvmgAwIBAgIUQsjpGwb7jBEwMySYU6hkBhSI2OgwDQYJKoZIhvcNAQEL

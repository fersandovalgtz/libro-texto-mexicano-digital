          2KyTAq6yKZ/0ASfibiUXecnQpYAfIlaAGzDFvIo6tXT06QPXabNZyQfbTjA6u8+0
          GjpvBYsnvmNxVP/+mtCBcFAGjyR89c8Iuhsw+Jjnpm5+LGXowQs1RDsM9DeUdW61
          offMd4qOuJ+W6BX0oe+YxM3Os6+WlQMyjOFFhIcHkZ6XUew00H4mI60yxmD6ZSHQ
          C2E2I5rFrDawT46HEl9IUqgeCHmB
          -----END CERTIFICATE-----
          PEM
          openssl x509 -in cert.pem -noout -fingerprint -sha256

      - name: Full-page production OCR and TSV
        shell: bash
        run: |
          set -euo pipefail
          mkdir private_work
          curl -fsSL --retry 3 --connect-timeout 15 --max-time 90 'https://historico.conaliteg.gob.mx/c/H1972P5CI084/004.jpg' -o private_work/legal.jpg
          curl -fsSL --retry 3 --connect-timeout 15 --max-time 90 'https://historico.conaliteg.gob.mx/c/H1972P5CI084/007.jpg' -o private_work/toc.jpg
          curl -fsSL --retry 3 --connect-timeout 15 --max-time 90 'https://historico.conaliteg.gob.mx/c/H1972P5CI084/026.jpg' -o private_work/q1.jpg
          for n in legal toc q1; do
            identify "private_work/${n}.jpg" | grep -F '670x993'
            tesseract "private_work/${n}.jpg" "private_work/${n}" -l spa --psm 3 txt tsv >/dev/null 2>"private_work/${n}.stderr"
          done

      - name: Package private TSV/text with public provenance manifest
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib,json,subprocess
          from pathlib import Path
          specs=[
            ('LTMD-CER-1972-LEGAL','legal','LTMD-CN5-G1972-VP004',[100,139,576,380]),
            ('LTMD-CER-1972-TOC','toc','LTMD-CN5-G1972-VP007',[35,20,635,950]),
            ('LTMD-CER-1972-Q1_1','q1','LTMD-CN5-G1972-VP026',[28,22,635,135]),
          ]
          ver=Path('tesseract-version.txt').read_text().strip()
          priv=[]; pub=[]
          for sid,n,pid,crop in specs:
            source=Path(f'private_work/{n}.jpg').read_bytes()
            txt=Path(f'private_work/{n}.txt').read_text(encoding='utf-8')
            tsv=Path(f'private_work/{n}.tsv').read_text(encoding='utf-8')
            sha=hashlib.sha256(source).hexdigest()
            priv.append({'sample_id':sid,'page_id':pid,'crop_px':crop,'selected_psm':3,'tesseract_version':ver,'source_sha256':sha,'full_page_text_private':txt,'full_page_tsv_private':tsv})
            pub.append({'sample_id':sid,'page_id':pid,'crop_px':crop,'selected_psm':3,'tesseract_version':ver,'source_sha256':sha,'full_page_text_chars':len(txt),'tsv_chars':len(tsv)})
          Path('private.json').write_text(json.dumps(priv,ensure_ascii=False),encoding='utf-8')
          Path('manifest.json').write_text(json.dumps({'alignment_rule':'full-page OCR; regional token selection by bounding-box center','certificate_fingerprint_sha256':'0E:C0:08:98:D7:84:72:F1:0F:08:74:F7:AD:71:E5:9B:58:45:B1:41:22:3F:91:FF:82:B1:40:3C:75:E6:E7:96','samples':pub},ensure_ascii=False,indent=2),encoding='utf-8')
          PY

      - name: Encrypt and destroy readable sources/OCR
        shell: bash
        run: |
          set -euo pipefail
          openssl cms -encrypt -binary -aes256 -in private.json -outform DER -out payload.p7m cert.pem
          sha256sum payload.p7m > ciphertext.sha256
          rm -rf private_work private.json cert.pem tesseract-version.txt
          test ! -e private.json
          test ! -d private_work

      - name: Upload ciphertext only plus non-text manifest
        uses: actions/upload-artifact@v4
        with:
          name: ltmd-cer-1972-batch1-fullpage-tsv-encrypted
          path: |
            payload.p7m
            manifest.json
            ciphertext.sha256
          retention-days: 1
          if-no-files-found: error

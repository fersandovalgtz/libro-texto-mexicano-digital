name: Audit CONALITEG viewers

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/audit-viewers.yml'
      - 'scripts/inspect_viewer.py'
      - 'scripts/probe_viewer_architecture.py'
      - 'data/book_inventory.csv'

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Validate inventory
        run: python scripts/validate_inventory.py

      - name: Inspect official viewers
        run: python scripts/inspect_viewer.py

      - name: Probe dynamic architecture
        run: python scripts/probe_viewer_architecture.py

      - name: Show audit result
        run: |
          echo '=== viewer_inspection.json ==='
          cat data/derived/viewer_inspection.json
          echo '=== viewer_architecture_probe.json ==='
          cat data/derived/viewer_architecture_probe.json

      - name: Upload audit artifacts
        uses: actions/upload-artifact@v4
        with:
          name: viewer-audit
          path: |
            data/derived/viewer_inspection.json
            data/derived/viewer_architecture_probe.json
          if-no-files-found: error
          retention-days: 30

name: inspect-ltmd-u1-w7-addpage-contract

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/inspect-ltmd-u1-w7-addpage-contract.yml'
      - 'scripts/inspect_ltmd_u1_w7_addpage_contract.py'
      - 'data/catalog/ltmd_u1_w7_routing_diagnostics.json'

permissions:
  contents: write

concurrency:
  group: inspect-ltmd-u1-w7-addpage-contract
  cancel-in-progress: false

jobs:
  inspect:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Inspect observed addPage contract
        run: python3 scripts/inspect_ltmd_u1_w7_addpage_contract.py
      - name: Publish addPage evidence race-safely
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/ltmd-u1-w7-addpage
          mkdir -p /tmp/ltmd-u1-w7-addpage
          cp data/catalog/ltmd_u1_w7_addpage_contract.json /tmp/ltmd-u1-w7-addpage/
          cp data/catalog/ltmd_u1_w7_addpage_contract.md /tmp/ltmd-u1-w7-addpage/
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          for attempt in 1 2 3; do
            git fetch origin main
            git reset --hard origin/main
            cp /tmp/ltmd-u1-w7-addpage/ltmd_u1_w7_addpage_contract.json data/catalog/
            cp /tmp/ltmd-u1-w7-addpage/ltmd_u1_w7_addpage_contract.md data/catalog/
            git add data/catalog/ltmd_u1_w7_addpage_contract.json data/catalog/ltmd_u1_w7_addpage_contract.md
            if git diff --cached --quiet; then exit 0; fi
            git commit -m 'Publish LTMD-U1 W7 addPage contract'
            if git push origin HEAD:main; then exit 0; fi
            sleep $((attempt * 2))
          done
          exit 1

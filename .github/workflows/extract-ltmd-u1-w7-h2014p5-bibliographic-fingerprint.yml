name: extract-ltmd-u1-w7-h2014p5-bibliographic-fingerprint

on:
  workflow_dispatch:
  push:
    paths:
      - 'scripts/extract_ltmd_u1_w7_h2014p5_bibliographic_fingerprint.py'
      - 'data/catalog/ltmd_u1_w7_civics_ethics_asset_manifest.csv'
      - '.github/workflows/extract-ltmd-u1-w7-h2014p5-bibliographic-fingerprint.yml'

concurrency:
  group: ltmd-u1-w7-h2014p5-bibliographic-fingerprint
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  fingerprint:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Install bounded OCR dependency
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends tesseract-ocr tesseract-ocr-spa
      - name: Extract verified bibliographic fingerprint
        run: python3 scripts/extract_ltmd_u1_w7_h2014p5_bibliographic_fingerprint.py
      - name: Publish bibliographic evidence race-safely
        run: |
          set -euo pipefail
          rm -rf /tmp/ltmd-w7-h2014-biblio
          mkdir -p /tmp/ltmd-w7-h2014-biblio
          cp data/catalog/ltmd_u1_w7_h2014p5_bibliographic_fingerprint.csv /tmp/ltmd-w7-h2014-biblio/
          cp data/catalog/ltmd_u1_w7_h2014p5_bibliographic_fingerprint.md /tmp/ltmd-w7-h2014-biblio/
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          for attempt in 1 2 3; do
            git fetch origin main
            git reset --hard origin/main
            cp /tmp/ltmd-w7-h2014-biblio/* data/catalog/
            git add data/catalog/ltmd_u1_w7_h2014p5_bibliographic_fingerprint.csv \
                    data/catalog/ltmd_u1_w7_h2014p5_bibliographic_fingerprint.md
            if git diff --cached --quiet; then exit 0; fi
            git commit -m 'Publish LTMD U1 W7 H2014P5 bibliographic fingerprint'
            if git push origin HEAD:main; then exit 0; fi
            sleep $((attempt * 2))
          done
          exit 1

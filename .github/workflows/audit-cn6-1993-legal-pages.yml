name: audit-cn6-1993-legal-pages

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/audit-cn6-1993-legal-pages.yml'
      - 'scripts/audit_cn6_1993_legal_pages.py'

permissions:
  contents: write

jobs:
  audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install OCR runtime
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq tesseract-ocr tesseract-ocr-spa
      - name: Audit the two legal pages
        run: python3 scripts/audit_cn6_1993_legal_pages.py
      - name: Publish targeted facts race-safely
        run: |
          set -euo pipefail
          cp data/expansion/cn6_1993_legal_page_facts.csv /tmp/cn6_1993_legal_page_facts.csv
          cp data/expansion/cn6_1993_legal_page_facts.md /tmp/cn6_1993_legal_page_facts.md
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          for attempt in 1 2 3; do
            git fetch origin main
            git reset --hard origin/main
            mkdir -p data/expansion
            cp /tmp/cn6_1993_legal_page_facts.csv data/expansion/
            cp /tmp/cn6_1993_legal_page_facts.md data/expansion/
            git add data/expansion/cn6_1993_legal_page_facts.csv data/expansion/cn6_1993_legal_page_facts.md
            if git diff --cached --quiet; then exit 0; fi
            git commit -m 'Publish targeted CN6 1993 legal-page audit'
            if git push origin HEAD:main; then exit 0; fi
            sleep $((attempt * 2))
          done
          exit 1

name: Encrypted private bundle — 1993 CER batch 3

on:
  push:
    paths: ['.github/workflows/cer-private-bundle-1993-batch3.yml']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  bundle:
    runs-on: ubuntu-24.04
    env:
      OMP_THREAD_LIMIT: '1'
    steps:
      - name: Install exact production OCR
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq tesseract-ocr tesseract-ocr-spa python3-pil
          tesseract --version | head -1 | tee version.txt
          grep -F 'tesseract 5.3.4' version.txt

      - name: Write one-use public certificate
        run: |
          cat > cert.pem <<'PEM'
          -----BEGIN CERTIFICATE-----
          MIIEgTCCAumgAwIBAgIUCf9LCvElTC1mWZxy0IEj/wS5EaowDQYJKoZIhvcNAQEL
          BQAwUDEnMCUGA1UEAwweTFRNRCBDRVIgMTk5MyBiYXRjaDMgdHJhbnNwb3J0MSUw
          IwYDVQQKDBxMaWJybyBUZXh0byBNZXhpY2FubyBEaWdpdGFsMB4XDTI2MDgxNTE2
          NTEwNVoXDTI2MDgxNzE2NTEwNVowUDEnMCUGA1UEAwweTFRNRCBDRVIgMTk5MyBi
          YXRjaDMgdHJhbnNwb3J0MSUwIwYDVQQKDBxMaWJybyBUZXh0byBNZXhpY2FubyBE
          aWdpdGFsMIIBojANBgkqhkiG9w0BAQEFAAOCAY8AMIIBigKCAYEAsMoQyu7zUG+V
          uDlf+weWEj811HYaB+I100U9TrI0TYN1U6bybTmaArNPiOnq2l0ioz0CbyNVpkTf
          y/crN7u5BYKXlSewYUGwtxmwthlagxglNK0tEllWMBAiFpLWuMnwToC/Wquxg5gb
          o9RU3xe8L3BgUQpP+qCua4006ZUls2Q+8CIvK0eyysLBe3G0wz5Gk/LFyDiMRvxI
          7w6ZD5D7xt3H+9/b74/ZrjrxTob48InMbZoAvPfbXzaLhU3UetHxZ2PNaBFDwO8p
          osk9q3JDklcf8F5Hqhc3hNR832/b0F25FeFKfwN2DPFRE/6x0RknpsM4m2NgbdfY
          yE7AFATld084m5fKwrU2iq7P7HjJVW35SXgInIa1gK9m1LUia/66uNLuvIjQEob/
          hROFXD5+8wHvI8wVtR+RwY6NUwnM0IJJBhxt/+U+0ZDgcPKnWOXR7tCKrwMSLs2a
          7cwNyqRlKa7dUgNCt31UCSxMwn6+bAecyegLQ/nMRQH50F0rr+bdAgMBAAGjUzBR
          MB0GA1UdDgQWBBRC6Q0Mrfu21kGGC+zqZ+jD/FIizzAfBgNVHSMEGDAWgBRC6Q0M
          rfu21kGGC+zqZ+jD/FIizzAPBgNVHRMBAf8EBTADAQH/MA0GCSqGSIb3DQEBCwUA
          A4IBgQCjE3/Ml5mrMkzbPbFl4Kz3qcuIN91MCEUqonNmT8FFL3KH7JY+rL48ajqD
          YvOakmYNJZ2H9JDks+0eEOSCcr+/48pYvCKA7oJH2Gy5et5qawkL6TfygbhTUt/N
          Q/Q2S18mrzsMNXFKZ6fFcewCJx/LLkfPPHT6suD8UPLe5SzNIwVzaanWlGw5gPAv
          qcThnGqY1U3btWvsxXOLyIwZ2U9FBB7GOQVew327e/93hOQD6zDc73sa7KHEj5oh
          eJXdTCl5CuTsolun0/Cy0x/Rbu3U0ohQHOxzS2m5H6sUe41mpKQ7yMu7k5H72tD/
          3dZ/Bvz6U87hMZx/M8VhOkXog39Scg56WZ+nYdtcK9iKoTMFTJe5zmjG3+c207W9
          Ft1iewFrMfbXZNjUTsNurWo5wYjgyx9f32lSeT9+g+xsbq6gBcwzwM9H4/HaqY03
          4OHW0AgQFgsasnEvWrEhMw2y5HVgd9/s8zzVGuqv95JXizz/mHAMdZVGk0OSTXdh
          +iXV5Ds=
          -----END CERTIFICATE-----
          PEM
          openssl x509 -in cert.pem -noout -fingerprint -sha256

      - name: Acquire source pages and full-page production OCR
        run: |
          set -euo pipefail
          mkdir -p private_bundle
          for n in 086 104 120; do
            curl -fsSL --retry 3 --connect-timeout 15 --max-time 90 "https://historico.conaliteg.gob.mx/c/H1993P5CI200/${n}.jpg" -o "private_bundle/${n}.jpg"
          done
          python3 - <<'PY'
          from PIL import Image
          for n in ('086','104','120'):
              with Image.open(f'private_bundle/{n}.jpg') as im:
                  assert im.size == (797,1045), (n, im.size)
          PY
          for n in 086 104 120; do
            tesseract "private_bundle/${n}.jpg" "private_bundle/${n}" -l spa --psm 3 txt tsv >/dev/null 2>"private_bundle/${n}.stderr"
          done

      - name: Write manifests
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib,json
          from pathlib import Path
          pages=[('LTMD-CER-1993-Q2_3','086','LTMD-CN5-G1993-VP086'),('LTMD-CER-1993-Q3_1','104','LTMD-CN5-G1993-VP104'),('LTMD-CER-1993-Q3_2','120','LTMD-CN5-G1993-VP120')]
          ver=Path('version.txt').read_text().strip(); pub=[]
          for sid,n,pid in pages:
              b=Path(f'private_bundle/{n}.jpg').read_bytes()
              pub.append({'sample_id':sid,'page_id':pid,'viewer_page':int(n),'selected_psm':3,'tesseract_version':ver,'source_sha256':hashlib.sha256(b).hexdigest(),'source_bytes':len(b),'full_page_text_chars':len(Path(f'private_bundle/{n}.txt').read_text(encoding='utf-8')),'tsv_chars':len(Path(f'private_bundle/{n}.tsv').read_text(encoding='utf-8'))})
          Path('private_bundle/private_manifest.json').write_text(json.dumps({'pages':pub},ensure_ascii=False,indent=2),encoding='utf-8')
          Path('manifest.json').write_text(json.dumps({'transport':'encrypted tar bundle containing private source JPEG + production full-page TXT/TSV','certificate_fingerprint_sha256':'BD:D9:FD:4F:0C:5B:C2:96:6B:58:79:34:D5:C4:78:A1:5D:CB:8A:82:D7:CD:F5:13:53:77:30:F5:59:03:10:85','pages':pub},ensure_ascii=False,indent=2),encoding='utf-8')
          PY

      - name: Encrypt and erase plaintext
        run: |
          set -euo pipefail
          tar -czf private_bundle.tar.gz private_bundle/
          openssl cms -encrypt -binary -aes256 -in private_bundle.tar.gz -outform DER -out payload.p7m cert.pem
          sha256sum payload.p7m > ciphertext.sha256
          rm -rf private_bundle private_bundle.tar.gz cert.pem version.txt

      - name: Upload ciphertext and manifest only
        uses: actions/upload-artifact@v7
        with:
          name: ltmd-cer-1993-batch3-private-bundle-encrypted
          path: |
            payload.p7m
            manifest.json
            ciphertext.sha256
          retention-days: 1
          if-no-files-found: error

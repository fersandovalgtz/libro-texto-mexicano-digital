name: build-ltmd-u1-w9-educacion-fisica-fragseg

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/build-ltmd-u1-w9-educacion-fisica-fragseg.yml'
      - 'scripts/segment_ltmd_u1_w9_educacion_fisica_fragments.py'
      - 'scripts/combine_ltmd_u1_w9_educacion_fisica_fragment_shards.py'
      - 'data/catalog/ltmd_u1_w9_educacion_fisica_page_structure.csv'
      - 'data/catalog/ltmd_u1_w9_educacion_fisica_page_structure_summary.csv'
      - 'data/catalog/ltmd_u1_w9_educacion_fisica_page_structure.md'
  workflow_run:
    workflows: ['build-ltmd-u1-w9-educacion-fisica-pagestruct']
    types: [completed]

permissions:
  contents: write

env:
  OMP_THREAD_LIMIT: '1'

concurrency:
  group: build-ltmd-u1-w9-educacion-fisica-fragseg
  cancel-in-progress: false

jobs:
  matrix:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-24.04
    outputs:
      viewers: ${{ steps.make.outputs.viewers }}
    steps:
      - uses: actions/checkout@v4
      - id: make
        shell: bash
        run: |
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import csv,json
          rows=list(csv.DictReader(open('data/catalog/ltmd_u1_w9_educacion_fisica_page_structure.csv',encoding='utf-8')))
          proc=list(csv.DictReader(open('data/catalog/ltmd_u1_w9_processing_inventory.csv',encoding='utf-8')))
          keys=sorted({r['viewer_key'] for r in rows})
          expected={r['viewer_key'] for r in proc if r['ocr_identity_eligible']=='1' and r['is_canonical_processing_object']=='1'}
          assert len(proc)==4 and len(rows)==448 and len(keys)==4 and set(keys)==expected
          assert {r['classifier_version'] for r in rows}=={'PAGESTRUCT_LTMD_U1_W9_EDUCACION_FISICA_0.1'}
          eligible={k:0 for k in keys}
          for r in rows:
              if r['primary_structure'] in {'textual','mixed_text_image'}:
                  eligible[r['viewer_key']]+=1
          bad=[k for k,n in eligible.items() if n==0]
          if bad:
              raise SystemExit(f'W9 FRAGSEG gate closed: viewers without eligible pages={bad}')
          print('viewers='+json.dumps(keys,separators=(',',':')))
          PY

  fragment:
    needs: matrix
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        viewer_key: ${{ fromJSON(needs.matrix.outputs.viewers) }}
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - name: Install Spanish Tesseract
        run: |
          sudo apt-get update
          sudo apt-get install -y tesseract-ocr tesseract-ocr-spa
      - name: Segment one canonical W9 viewer
        run: python3 scripts/segment_ltmd_u1_w9_educacion_fisica_fragments.py --viewer-key '${{ matrix.viewer_key }}'
      - uses: actions/upload-artifact@v4
        with:
          name: ltmd-u1-w9-educacion-fisica-fragments-${{ matrix.viewer_key }}
          path: data/work/ltmd_u1_w9_educacion_fisica_fragments/*.csv
          if-no-files-found: error
          retention-days: 1

  combine:
    needs: fragment
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@v8
        with:
          pattern: ltmd-u1-w9-educacion-fisica-fragments-*
          path: data/work/ltmd_u1_w9_educacion_fisica_fragments
          merge-multiple: true
      - name: Combine exact four-viewer W9 FRAGSEG layer
        run: python3 scripts/combine_ltmd_u1_w9_educacion_fisica_fragment_shards.py
      - name: Publish W9 FRAGSEG 0.1 race-safely
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/w9-fragseg
          mkdir -p /tmp/w9-fragseg
          cp data/catalog/ltmd_u1_w9_educacion_fisica_fragment_manifest.csv /tmp/w9-fragseg/
          cp data/catalog/ltmd_u1_w9_educacion_fisica_fragment_manifest_summary.csv /tmp/w9-fragseg/
          cp data/catalog/ltmd_u1_w9_educacion_fisica_fragment_sequence_gaps.csv /tmp/w9-fragseg/
          cp data/catalog/ltmd_u1_w9_educacion_fisica_fragment_manifest.md /tmp/w9-fragseg/
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          for attempt in 1 2 3; do
            git fetch origin main
            git reset --hard origin/main
            cp /tmp/w9-fragseg/* data/catalog/
            git add data/catalog/ltmd_u1_w9_educacion_fisica_fragment_manifest.csv data/catalog/ltmd_u1_w9_educacion_fisica_fragment_manifest_summary.csv data/catalog/ltmd_u1_w9_educacion_fisica_fragment_sequence_gaps.csv data/catalog/ltmd_u1_w9_educacion_fisica_fragment_manifest.md
            if git diff --cached --quiet; then exit 0; fi
            git commit -m 'Publish LTMD-U1 W9 Educación Física FRAGSEG 0.1'
            if git push origin HEAD:main; then exit 0; fi
            sleep $((attempt * 2))
          done
          exit 1

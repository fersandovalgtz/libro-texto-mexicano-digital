name: Encrypted private bundle — 1988 CER batch 3

on:
  push:
    paths: ['.github/workflows/cer-private-bundle-1988-batch3.yml']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  bundle:
    runs-on: ubuntu-24.04
    env:
      OMP_THREAD_LIMIT: '1'
    steps:
      - name: Install exact production OCR
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq tesseract-ocr tesseract-ocr-spa python3-pil
          tesseract --version | head -1 | tee version.txt
          grep -F 'tesseract 5.3.4' version.txt

      - name: Write one-use public certificate
        run: |
          cat > cert.pem <<'PEM'
          -----BEGIN CERTIFICATE-----
          MIIEgTCCAumgAwIBAgIUe4dmakNzXSuOklRXNAf5upky4sAwDQYJKoZIhvcNAQEL
          BQAwUDEnMCUGA1UEAwweTFRNRCBDRVIgMTk4OCBiYXRjaDMgdHJhbnNwb3J0MSUw
          IwYDVQQKDBxMaWJybyBUZXh0byBNZXhpY2FubyBEaWdpdGFsMB4XDTI2MDgxNTE2
          MjAyNFoXDTI2MDgxNzE2MjAyNFowUDEnMCUGA1UEAwweTFRNRCBDRVIgMTk4OCBi
          YXRjaDMgdHJhbnNwb3J0MSUwIwYDVQQKDBxMaWJybyBUZXh0byBNZXhpY2FubyBE
          aWdpdGFsMIIBojANBgkqhkiG9w0BAQEFAAOCAY8AMIIBigKCAYEAq92ewzAES8UP
          FQsVVx7QlIVFvPNP0MeRzHt1oUnn8xrVJdzApHHz7oMay4kjXwZZIKe6a7+ipWJ7
          nea16NkwE6kkKoVUPXcqf8jDtyCPS8xKHQy+OBTJ1wJzFJFNmYOUNVX+9rLbQpFn
          /bRkI2zCxmI/aSDc9TgvzTpdGvPpj3JGC6tb089E5xVd3rMzyN5ZOM3kvI/qheca
          EjnObSEvKqmb+k2qS9cxvNS0Edk1/iA//fhjwOCUszejO87AH+/9tggluCOHbQrh
          d1NpfaM2oPOEXWtDNQA7aJw+JwARWZR7SNPgSXL2nMnrGwzBS0vxbNhka8fxetkI
          c8UItD07sUzR9Gb9giCCc0cAS4psVz/MhaQ6tOE6dOJqucAa+EEoDiAIVwY5hEsB
          V+r/X0qrjaCbdUmbAyqY5HpBm12Vse7Vip+6uLo7BPJfxso3ubhXC86tBwkeMpil
          amWU3PKb/0YXVS3YrqHO7Rn5AI69/SK18T138QPuUJ9H6w+1J+avAgMBAAGjUzBR
          MB0GA1UdDgQWBBSVa0TPJHWrj9FWaTZsxOe3pcutjDAfBgNVHSMEGDAWgBSVa0TP
          JHWrj9FWaTZsxOe3pcutjDAPBgNVHRMBAf8EBTADAQH/MA0GCSqGSIb3DQEBCwUA
          A4IBgQCqG3WEsKnaHsiEuyLm+T+/VRxW7gxPtTizmizXWH/dCXIY+ElL6s1nV2sF
          pRbf6beKYj+QWMajEbL6Q18uC5IFCTk5AG3Cqj4/72txllQI/GmDgVUZszOGVoxo
          Pfc6yP4WzVZxivgJQ+VfxnR3RYWIcpPU4HtsWcLWotNdK3naAjEe3sKbEhlIF36l
          SvDGy135G9ZZcIi6yVgJAbn+Z5/kk1OaoXWLfVWQIApXNrhw6ksIE3MCQjOSCgfn
          xxgywa/KwC8feALODk/X8KRMZqsG0YVRdUfEx4YReMA2yOAoRIDsxvgryqm4NKuL
          EgG7ZCRCzyl5MMt8f6ztGmHyMJKgvSdUt7NtElUFd28MalpsQUt2uoRO1iSHdI0j
          0TcMnr+E5jU6HXL09PCAQ8C0xIOGa+H6J1yCe/29072eABPoUqxKg1sLmQ7bBSrP
          T3PrUCgwlRy9vlXpajPPyoCTPeiWoab68RwXp0d66yqE+ZbO0jxmW0MHH7uHY/CX
          /uPBRtM=
          -----END CERTIFICATE-----
          PEM
          openssl x509 -in cert.pem -noout -fingerprint -sha256

      - name: Acquire source pages and full-page production OCR
        run: |
          set -euo pipefail
          mkdir -p private_bundle
          for n in 078 095 109; do
            curl -fsSL --retry 3 --connect-timeout 15 --max-time 90 "https://historico.conaliteg.gob.mx/c/H1988P5CI123/${n}.jpg" -o "private_bundle/${n}.jpg"
          done
          python3 - <<'PY'
          from PIL import Image
          for n in ('078','095','109'):
              with Image.open(f'private_bundle/{n}.jpg') as im:
                  assert im.size == (670,993), (n, im.size)
          PY
          for n in 078 095 109; do
            tesseract "private_bundle/${n}.jpg" "private_bundle/${n}" -l spa --psm 3 txt tsv >/dev/null 2>"private_bundle/${n}.stderr"
          done

      - name: Write manifests
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib,json
          from pathlib import Path
          pages=[('LTMD-CER-1988-Q2_3','078','LTMD-CN5-G1988-VP078'),('LTMD-CER-1988-Q3_1','095','LTMD-CN5-G1988-VP095'),('LTMD-CER-1988-Q3_2','109','LTMD-CN5-G1988-VP109')]
          ver=Path('version.txt').read_text().strip(); pub=[]
          for sid,n,pid in pages:
              b=Path(f'private_bundle/{n}.jpg').read_bytes()
              pub.append({'sample_id':sid,'page_id':pid,'viewer_page':int(n),'selected_psm':3,'tesseract_version':ver,'source_sha256':hashlib.sha256(b).hexdigest(),'source_bytes':len(b),'full_page_text_chars':len(Path(f'private_bundle/{n}.txt').read_text(encoding='utf-8')),'tsv_chars':len(Path(f'private_bundle/{n}.tsv').read_text(encoding='utf-8'))})
          Path('private_bundle/private_manifest.json').write_text(json.dumps({'pages':pub},ensure_ascii=False,indent=2),encoding='utf-8')
          Path('manifest.json').write_text(json.dumps({'transport':'encrypted tar bundle containing private source JPEG + production full-page TXT/TSV','certificate_fingerprint_sha256':'1A:0D:22:69:16:AF:F6:39:E4:CE:94:14:D2:4B:26:02:EE:35:63:46:1D:2D:C7:9E:39:A2:A9:82:2A:13:F5:D2','pages':pub},ensure_ascii=False,indent=2),encoding='utf-8')
          PY

      - name: Encrypt and erase plaintext
        run: |
          set -euo pipefail
          tar -czf private_bundle.tar.gz private_bundle/
          openssl cms -encrypt -binary -aes256 -in private_bundle.tar.gz -outform DER -out payload.p7m cert.pem
          sha256sum payload.p7m > ciphertext.sha256
          rm -rf private_bundle private_bundle.tar.gz cert.pem version.txt
          test ! -d private_bundle

      - name: Upload ciphertext and manifest only
        uses: actions/upload-artifact@v4
        with:
          name: ltmd-cer-1988-batch3-private-bundle-encrypted
          path: |
            payload.p7m
            manifest.json
            ciphertext.sha256
          retention-days: 1
          if-no-files-found: error

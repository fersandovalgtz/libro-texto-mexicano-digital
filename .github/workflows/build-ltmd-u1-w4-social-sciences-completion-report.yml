name: build-ltmd-u1-w4-social-sciences-completion-report

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - run: python3 scripts/build_ltmd_u1_w4_social_sciences_completion_report.py
      - name: Publish W4 completion report race-safely
        shell: bash
        run: |
          set -euo pipefail
          cp docs/LTMD_U1_W4_COMPLETION.md /tmp/LTMD_U1_W4_COMPLETION.md
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          for attempt in 1 2 3; do
            git fetch origin main
            git reset --hard origin/main
            cp /tmp/LTMD_U1_W4_COMPLETION.md docs/LTMD_U1_W4_COMPLETION.md
            git add docs/LTMD_U1_W4_COMPLETION.md
            if git diff --cached --quiet; then exit 0; fi
            git commit -m 'Publish LTMD-U1 W4 Social Sciences completion report'
            if git push origin HEAD:main; then exit 0; fi
            sleep $((attempt * 2))
          done
          exit 1

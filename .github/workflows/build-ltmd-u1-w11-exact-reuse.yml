name: build-ltmd-u1-w11-exact-reuse

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/build-ltmd-u1-w11-exact-reuse.yml'
      - 'scripts/analyze_ltmd_u1_w11_exact_reuse.py'
      - 'data/catalog/ltmd_u1_w11_fragment_manifest.csv'
  workflow_run:
    workflows: ['build-ltmd-u1-w11-fragseg']
    types: [completed]

permissions:
  contents: write

concurrency:
  group: build-ltmd-u1-w11-exact-reuse
  cancel-in-progress: false

jobs:
  build:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Refresh authoritative main before readiness gate
        run: |
          git fetch origin main
          git reset --hard origin/main
      - id: ready
        shell: bash
        run: |
          if [[ -f data/catalog/ltmd_u1_w11_fragment_manifest.csv && -f data/catalog/ltmd_u1_w11_processing_inventory.csv ]]; then
            echo 'ready=true' >> "$GITHUB_OUTPUT"
          else
            echo 'ready=false' >> "$GITHUB_OUTPUT"
          fi
      - name: Analyze exact W11 reuse
        if: steps.ready.outputs.ready == 'true'
        run: python3 scripts/analyze_ltmd_u1_w11_exact_reuse.py
      - name: Publish W11 exact reuse race-safely
        if: steps.ready.outputs.ready == 'true'
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/w11-reuse;mkdir -p /tmp/w11-reuse
          cp data/catalog/ltmd_u1_w11_exact_content_units.csv /tmp/w11-reuse/
          cp data/catalog/ltmd_u1_w11_exact_viewer_overlap.csv /tmp/w11-reuse/
          cp docs/LTMD_U1_W11_EXACT_REUSE.md /tmp/w11-reuse/
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          for attempt in 1 2 3; do
            git fetch origin main
            git reset --hard origin/main
            cp /tmp/w11-reuse/ltmd_u1_w11_exact_content_units.csv data/catalog/
            cp /tmp/w11-reuse/ltmd_u1_w11_exact_viewer_overlap.csv data/catalog/
            cp /tmp/w11-reuse/LTMD_U1_W11_EXACT_REUSE.md docs/
            git add data/catalog/ltmd_u1_w11_exact_content_units.csv data/catalog/ltmd_u1_w11_exact_viewer_overlap.csv docs/LTMD_U1_W11_EXACT_REUSE.md
            if git diff --cached --quiet; then exit 0; fi
            git commit -m 'data(w11): publish exact textual-reuse analysis'
            if git push origin HEAD:main; then exit 0; fi
            sleep $((attempt*2))
          done
          exit 1

name: probe-cn-asset-routing-viewers

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/probe-cn-asset-routing-viewers.yml'
      - 'data/catalog/cn_asset_routing_problem_inventory.csv'
      - 'scripts/probe_viewer_architecture.py'

permissions:
  contents: write

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Probe unresolved viewer architectures
        run: |
          python3 scripts/probe_viewer_architecture.py \
            --inventory data/catalog/cn_asset_routing_problem_inventory.csv \
            --out data/catalog/cn_asset_routing_viewer_architecture.md
      - name: Publish architecture probe
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/catalog/cn_asset_routing_viewer_architecture.md
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Publish unresolved CN viewer architecture probe'
          git pull --rebase origin main
          git push origin HEAD:main

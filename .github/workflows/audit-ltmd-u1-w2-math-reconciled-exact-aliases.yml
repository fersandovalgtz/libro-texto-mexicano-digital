name: audit-ltmd-u1-w2-math-reconciled-exact-aliases

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/audit-ltmd-u1-w2-math-reconciled-exact-aliases.yml'
      - 'scripts/audit_ltmd_u1_w2_math_reconciled_exact_aliases.py'
      - 'data/catalog/ltmd_u1_w2_math_reconciled_manifest.csv'
      - 'data/catalog/ltmd_u1_w2_math_reconciled_summary.csv'

permissions:
  contents: write

jobs:
  audit:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - run: python3 scripts/audit_ltmd_u1_w2_math_reconciled_exact_aliases.py
      - name: Publish reconciled alias audit race-safely
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/w2-recon-alias
          cp data/catalog/ltmd_u1_w2_math_reconciled_exact_aliases.csv /tmp/w2-recon-alias/
          cp data/catalog/ltmd_u1_w2_math_reconciled_exact_aliases.md /tmp/w2-recon-alias/
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          for attempt in 1 2 3; do
            git fetch origin main
            git reset --hard origin/main
            cp /tmp/w2-recon-alias/* data/catalog/
            git add data/catalog/ltmd_u1_w2_math_reconciled_exact_aliases.csv data/catalog/ltmd_u1_w2_math_reconciled_exact_aliases.md
            if git diff --cached --quiet; then exit 0; fi
            git commit -m 'Publish reconciled LTMD-U1 W2 mathematics alias audit'
            if git push origin HEAD:main; then exit 0; fi
            sleep $((attempt * 2))
          done
          exit 1

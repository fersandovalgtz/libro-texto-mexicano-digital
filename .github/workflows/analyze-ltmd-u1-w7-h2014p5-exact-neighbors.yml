name: analyze-ltmd-u1-w7-h2014p5-exact-neighbors

on:
  workflow_dispatch:
  push:
    paths:
      - 'scripts/analyze_ltmd_u1_w7_h2014p5_exact_neighbors.py'
      - 'data/catalog/ltmd_u1_w7_civics_ethics_asset_manifest.csv'
      - '.github/workflows/analyze-ltmd-u1-w7-h2014p5-exact-neighbors.yml'

concurrency:
  group: ltmd-u1-w7-h2014p5-exact-neighbors
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  analyze:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Analyze exact positional neighbors
        run: python3 scripts/analyze_ltmd_u1_w7_h2014p5_exact_neighbors.py
      - name: Publish exact-neighbor evidence race-safely
        run: |
          set -euo pipefail
          rm -rf /tmp/ltmd-w7-h2014-neighbors
          mkdir -p /tmp/ltmd-w7-h2014-neighbors
          cp data/catalog/ltmd_u1_w7_h2014p5_exact_neighbors.csv /tmp/ltmd-w7-h2014-neighbors/
          cp data/catalog/ltmd_u1_w7_h2014p5_exact_neighbor_mismatches.csv /tmp/ltmd-w7-h2014-neighbors/
          cp data/catalog/ltmd_u1_w7_h2014p5_exact_neighbors.md /tmp/ltmd-w7-h2014-neighbors/
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          for attempt in 1 2 3; do
            git fetch origin main
            git reset --hard origin/main
            cp /tmp/ltmd-w7-h2014-neighbors/* data/catalog/
            git add data/catalog/ltmd_u1_w7_h2014p5_exact_neighbors.csv \
                    data/catalog/ltmd_u1_w7_h2014p5_exact_neighbor_mismatches.csv \
                    data/catalog/ltmd_u1_w7_h2014p5_exact_neighbors.md
            if git diff --cached --quiet; then exit 0; fi
            git commit -m 'Publish LTMD U1 W7 H2014P5 exact-neighbor evidence'
            if git push origin HEAD:main; then exit 0; fi
            sleep $((attempt * 2))
          done
          exit 1

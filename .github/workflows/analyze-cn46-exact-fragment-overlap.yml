name: analyze-cn46-exact-fragment-overlap

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/analyze-cn46-exact-fragment-overlap.yml'
      - 'scripts/analyze_cn46_exact_fragment_overlap.py'
      - 'data/expansion/cn46_fragment_manifest.csv'

permissions:
  contents: write

jobs:
  analyze:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Analyze exact fragment text overlap
        run: python3 scripts/analyze_cn46_exact_fragment_overlap.py
      - name: Publish fragment-overlap diagnostics race-safely
        run: |
          set -euo pipefail
          cp data/expansion/cn46_exact_fragment_overlap.csv /tmp/cn46_exact_fragment_overlap.csv
          cp data/expansion/cn46_exact_fragment_overlap.md /tmp/cn46_exact_fragment_overlap.md
          cp data/expansion/cn4_1972_1988_fragment_reuse.csv /tmp/cn4_1972_1988_fragment_reuse.csv
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          for attempt in 1 2 3; do
            git fetch origin main
            git reset --hard origin/main
            mkdir -p data/expansion
            cp /tmp/cn46_exact_fragment_overlap.csv data/expansion/
            cp /tmp/cn46_exact_fragment_overlap.md data/expansion/
            cp /tmp/cn4_1972_1988_fragment_reuse.csv data/expansion/
            git add data/expansion/cn46_exact_fragment_overlap.csv data/expansion/cn46_exact_fragment_overlap.md data/expansion/cn4_1972_1988_fragment_reuse.csv
            if git diff --cached --quiet; then exit 0; fi
            git commit -m 'Publish CN4/CN6 exact fragment overlap analysis'
            if git push origin HEAD:main; then exit 0; fi
            sleep $((attempt * 2))
          done
          exit 1

name: Build structural page classification

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/build-page-structure.yml'
      - 'scripts/extract_structural_keyword_flags.py'
      - 'scripts/classify_page_structure.py'

concurrency:
  group: page-structure-main
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  classify:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      OMP_THREAD_LIMIT: '1'
    steps:
      - uses: actions/checkout@v7
      - name: Install exact OCR family
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq tesseract-ocr tesseract-ocr-spa
          tesseract --version | head -1
      - name: Scan structural keyword signals without persisting OCR text
        run: python3 scripts/extract_structural_keyword_flags.py
      - name: Classify all source pages
        run: python3 scripts/classify_page_structure.py
      - name: Validate derived outputs
        run: |
          python3 - <<'PY'
          import csv
          from pathlib import Path
          p=Path('data/derived/page_structure.csv')
          rows=list(csv.DictReader(p.open(encoding='utf-8')))
          assert len(rows)==759, len(rows)
          allowed={'textual','mixed_text_image','visual_only','front_matter','toc_or_navigation','bibliography_or_credits','unknown'}
          assert set(r['primary_structure'] for r in rows) <= allowed
          assert all(r['classifier_version']=='PAGESTRUCT_0.2' for r in rows)
          known_visual={'LTMD-CN5-G2014-VP068','LTMD-CN5-G2014-VP078','LTMD-CN5-G2014-VP094','LTMD-CN5-G2014-VP118'}
          got={r['page_id']:r['primary_structure'] for r in rows if r['page_id'] in known_visual}
          assert set(got)==known_visual and all(v=='visual_only' for v in got.values()), got
          unknown=sum(r['primary_structure']=='unknown' for r in rows)
          assert unknown/len(rows) <= 0.10, unknown
          dense_end=[r for r in rows if r['classification_rule']=='END_ZONE_DENSE_UNCERTAIN']
          print('validated rows:',len(rows))
          print('known visual controls:',got)
          print('unknown:',unknown,f'({unknown/len(rows):.2%})')
          print('dense end-zone uncertain:',[(r['page_id'],r['recognized_words'],r['mean_word_confidence']) for r in dense_end])
          PY
          cat data/derived/page_structure_summary.csv
      - name: Publish validated derived datasets from latest main
        run: |
          set -euo pipefail
          mkdir -p /tmp/page-structure-derived
          cp data/derived/structural_keyword_flags.csv /tmp/page-structure-derived/
          cp data/derived/page_structure.csv /tmp/page-structure-derived/
          cp data/derived/page_structure_summary.csv /tmp/page-structure-derived/
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git fetch origin main
          git reset --hard origin/main
          cp /tmp/page-structure-derived/structural_keyword_flags.csv data/derived/
          cp /tmp/page-structure-derived/page_structure.csv data/derived/
          cp /tmp/page-structure-derived/page_structure_summary.csv data/derived/
          git add data/derived/structural_keyword_flags.csv data/derived/page_structure.csv data/derived/page_structure_summary.csv
          if git diff --cached --quiet; then
            echo 'No derived changes to commit.'
          else
            git commit -m 'data: publish structural page classification 0.2'
            git push origin HEAD:main
          fi

name: Run FTRL W11 Otros No Clasificados

on:
  workflow_dispatch:
  push:
    branches: [ftrl/w11-otros-no-clasificados]
    paths:
      - 'data/research/ltmd_u1_w11_ftrl_run_stamp.json'
  pull_request:
    branches: [main]
    paths:
      - 'scripts/build_ftrl_w11_inputs.py'
      - 'scripts/run_ftrl_w11_book.py'
      - 'scripts/validate_ftrl_w11_distributed.py'
      - '.github/workflows/run-ftrl-w11-otros-no-clasificados.yml'
      - 'data/research/ltmd_u1_w11_ftrl_run_stamp.json'

permissions:
  contents: read

concurrency:
  group: ftrl-w11-otros-no-clasificados-${{ github.ref }}
  cancel-in-progress: false

jobs:
  config-gate:
    name: validate-ftrl-w11-config
    runs-on: ubuntu-latest
    outputs:
      viewers: ${{ steps.matrix.outputs.viewers }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Compile W11 FTRL scripts
        run: python -m py_compile scripts/build_ftrl_w11_inputs.py scripts/run_ftrl_w11_book.py scripts/validate_ftrl_w11_distributed.py
      - name: Rebuild normalized W11 inputs without network
        run: |
          python scripts/build_ftrl_w11_inputs.py \
            --asset-output /tmp/w11_asset_manifest.csv \
            --processing-output /tmp/w11_processing_inventory.csv
      - name: Validate W11 denominator and derive exact matrix
        id: matrix
        shell: bash
        run: |
          python - <<'PY'
          import csv, json, os
          from collections import Counter

          def read(path):
              with open(path, encoding='utf-8', newline='') as fh:
                  return list(csv.DictReader(fh))

          assets = read('/tmp/w11_asset_manifest.csv')
          proc = read('/tmp/w11_processing_inventory.csv')
          gate = read('data/catalog/ltmd_u1_w11_source_admissibility.csv')
          topo = read('data/catalog/ltmd_u1_w11_processing_inventory.csv')
          withheld = {'H2014P1EAM', 'H2014P2EAM', 'H2014P3COL', 'H2014P3MOR'}
          aliases = {'H2008P4CI270': 'H1993P4CI192'}
          admitted = {r['viewer_key'] for r in gate if r['ocr_source_admitted'] == '1'}
          canonical = {r['viewer_key'] for r in proc}
          topo_alias = {
              r['viewer_key']: r['canonical_viewer_key']
              for r in topo if r['processing_mode'] == 'exact_source_alias'
          }
          assert len(gate) == 111
          assert len(topo) == 111
          assert len(admitted) == 107
          assert len(proc) == 106
          assert len(assets) == 19862
          assert {r['viewer_key'] for r in gate if r['ocr_source_admitted'] == '0'} == withheld
          assert topo_alias == aliases
          assert admitted == canonical | set(aliases)
          assert canonical.isdisjoint(set(aliases))
          assert not ({r['viewer_key'] for r in assets} & withheld)
          assert not ({r['viewer_key'] for r in assets} & set(aliases))
          assert all(r['is_canonical_processing_object'] == '1' for r in proc)
          assert all(r['technical_identity_covered'] == '1' for r in proc)
          assert all(r['persistent_internal_source_gaps'] == '0' for r in proc)
          expected = Counter({r['viewer_key']: int(r['direct_source_jpegs']) for r in proc})
          observed = Counter(r['viewer_key'] for r in assets)
          assert observed == expected
          viewers = [r['viewer_key'] for r in proc]
          assert len(viewers) == len(set(viewers)) == 106
          with open(os.environ['GITHUB_OUTPUT'], 'a', encoding='utf-8') as fh:
              print('viewers=' + json.dumps(viewers, separators=(',', ':')), file=fh)
          print('W11 config gate: 111 historical / 107 admitted / 106 canonical / 1 alias / 4 withheld / 19862 pages')
          PY

  precondition:
    name: require-prior-archival-closures
    if: github.event_name != 'pull_request'
    needs: config-gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Require W10 archival closure and W11 pending state
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          state = json.loads(Path('data/research/ltmd_u1_ftrl_wave_state.json').read_text(encoding='utf-8'))
          w10 = state['waves']['W10']
          assert w10['ftrl_status'] == 'validated', w10
          assert w10['archival_status'] == 'archival_complete', w10
          evidence = w10.get('archival_closure_evidence')
          assert evidence and Path(evidence).is_file(), w10
          w11 = state['waves']['W11']
          assert w11['ftrl_status'] == 'pending', w11
          assert w11['archival_status'] == 'not_started', w11
          PY

  book:
    name: book-${{ matrix.viewer }}
    if: github.event_name != 'pull_request'
    needs: [config-gate, precondition]
    runs-on: ubuntu-latest
    timeout-minutes: 180
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        viewer: ${{ fromJSON(needs.config-gate.outputs.viewers) }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Spanish Tesseract data
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends tesseract-ocr tesseract-ocr-spa
          tesseract --list-langs | grep -Fx spa
      - name: Validate private preservation canon
        run: python scripts/validate_private_corpus_storage_contract.py
      - name: Execute deterministic W11 book unit
        run: |
          python scripts/run_ftrl_w11_book.py \
            --viewer-key '${{ matrix.viewer }}' \
            --output-dir local/ftrl-w11
      - name: Assert public evidence is text-free
        env:
          VIEWER: ${{ matrix.viewer }}
        run: |
          python - <<'PY'
          import json, os
          from pathlib import Path
          viewer = os.environ['VIEWER']
          p = Path(f'local/ftrl-w11/{viewer}/w11_{viewer}_evidence.json')
          data = json.loads(p.read_text(encoding='utf-8'))
          assert data['schema'] == 'LTMD_FTRL_W11_BOOK_UNIT_0.1'
          assert data['status'] == 'validated'
          forbidden = {'ocr_text_raw','search_text','snippet','text','normalized_text'}
          def walk(x):
              if isinstance(x, dict):
                  assert not (forbidden & set(x)), forbidden & set(x)
                  for v in x.values(): walk(v)
              elif isinstance(x, list):
                  for v in x: walk(v)
          walk(data)
          PY
      - name: Build and encrypt restricted book archive
        env:
          VIEWER: ${{ matrix.viewer }}
        run: |
          set -euo pipefail
          DIR="local/ftrl-w11/${VIEWER}"
          HANDOFF="local/private-handoff-w11-${VIEWER}"
          mkdir -p "$HANDOFF"
          tar -C "$DIR" -czf "$HANDOFF/w11_${VIEWER}_restricted.tar.gz" \
            "w11_${VIEWER}_page_ocr.jsonl" \
            "w11_${VIEWER}_ocr_search.sqlite" \
            "w11_${VIEWER}_qc_queue.json" \
            "w11_${VIEWER}_asset_manifest.csv" \
            "w11_${VIEWER}_run_manifest.json" \
            "w11_${VIEWER}_qc_summary.json"
          openssl rand -base64 48 > "/tmp/w11-${VIEWER}.pass"
          openssl enc -aes-256-cbc -salt -pbkdf2 -iter 250000 \
            -in "$HANDOFF/w11_${VIEWER}_restricted.tar.gz" \
            -out "$HANDOFF/w11_${VIEWER}_restricted.tar.gz.enc" \
            -pass file:"/tmp/w11-${VIEWER}.pass"
          openssl pkeyutl -encrypt \
            -pubin -inkey security/ltmd_archive_public.pem \
            -in "/tmp/w11-${VIEWER}.pass" \
            -out "$HANDOFF/w11_${VIEWER}_passphrase.rsa-oaep.enc" \
            -pkeyopt rsa_padding_mode:oaep -pkeyopt rsa_oaep_md:sha256
          sha256sum "$HANDOFF/w11_${VIEWER}_restricted.tar.gz.enc" "$HANDOFF/w11_${VIEWER}_passphrase.rsa-oaep.enc" > "$HANDOFF/SHA256SUMS.txt"
          rm -f "$HANDOFF/w11_${VIEWER}_restricted.tar.gz" "/tmp/w11-${VIEWER}.pass"
      - name: Write text-free encrypted handoff manifest
        env:
          VIEWER: ${{ matrix.viewer }}
          GH_RUN_ID: ${{ github.run_id }}
          GH_SHA: ${{ github.sha }}
        run: |
          python - <<'PY'
          import hashlib, json, os
          from pathlib import Path
          viewer = os.environ['VIEWER']
          handoff = Path(f'local/private-handoff-w11-{viewer}')
          evidence = json.loads(Path(f'local/ftrl-w11/{viewer}/w11_{viewer}_evidence.json').read_text(encoding='utf-8'))
          public_key = Path('security/ltmd_archive_public.pem')
          public_key_sha256 = hashlib.sha256(public_key.read_bytes()).hexdigest()
          assert public_key_sha256 == '78852eafbaa332247f99e23508ac157b5b906c6c3bf3aeb0af1dfe8d57579c2d'
          def desc(name):
              p = handoff / name
              h = hashlib.sha256()
              with p.open('rb') as fh:
                  for chunk in iter(lambda: fh.read(1024*1024), b''): h.update(chunk)
              return {'name': name, 'bytes': p.stat().st_size, 'sha256': h.hexdigest()}
          payload = f'w11_{viewer}_restricted.tar.gz.enc'
          key = f'w11_{viewer}_passphrase.rsa-oaep.enc'
          m = {
              'schema':'LTMD_PRIVATE_FTRL_W11_BOOK_HANDOFF_0.1',
              'wave':'W11',
              'viewer_key':viewer,
              'page_records':evidence['page_records'],
              'source_commit':os.environ['GH_SHA'],
              'workflow_run_id':os.environ['GH_RUN_ID'],
              'encryption':{
                  'payload':'AES-256-CBC + PBKDF2-SHA256, 250000 iterations',
                  'key_wrap':'RSA-4096 OAEP SHA-256',
                  'public_key_sha256':public_key_sha256
              },
              'files':[desc(payload),desc(key),desc('SHA256SUMS.txt')],
              'plaintext_restricted_outputs_uploaded':False,
              'destination_policy':'private Google Drive; Actions artifact is temporary encrypted handoff only',
              'archival_complete':False,
          }
          (handoff / f'w11_{viewer}_private_handoff_manifest.json').write_text(
              json.dumps(m, indent=2, sort_keys=True)+'\n', encoding='utf-8'
          )
          PY
      - name: Prove plaintext archive is absent
        env:
          VIEWER: ${{ matrix.viewer }}
        run: |
          HANDOFF="local/private-handoff-w11-${VIEWER}"
          test ! -f "$HANDOFF/w11_${VIEWER}_restricted.tar.gz"
          test -f "$HANDOFF/w11_${VIEWER}_restricted.tar.gz.enc"
          test -f "$HANDOFF/w11_${VIEWER}_passphrase.rsa-oaep.enc"
      - name: Upload encrypted private handoff only
        uses: actions/upload-artifact@v7
        with:
          name: ltmd-u1-w11-${{ matrix.viewer }}-private-encrypted
          path: local/private-handoff-w11-${{ matrix.viewer }}/
          if-no-files-found: error
          retention-days: 3
      - name: Upload text-free computational evidence
        uses: actions/upload-artifact@v7
        with:
          name: ltmd-u1-w11-${{ matrix.viewer }}-text-free-evidence
          path: |
            local/ftrl-w11/${{ matrix.viewer }}/w11_${{ matrix.viewer }}_evidence.json
            local/ftrl-w11/${{ matrix.viewer }}/w11_${{ matrix.viewer }}_run_manifest.json
            local/ftrl-w11/${{ matrix.viewer }}/w11_${{ matrix.viewer }}_qc_summary.json
            local/ftrl-w11/${{ matrix.viewer }}/w11_${{ matrix.viewer }}_asset_manifest.csv
          if-no-files-found: error
          retention-days: 30

  aggregate:
    name: validate-global-w11-union
    if: github.event_name != 'pull_request'
    needs: book
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Download all text-free W11 evidence
        uses: actions/download-artifact@v4
        with:
          pattern: ltmd-u1-w11-*-text-free-evidence
          path: local/w11-evidence
          merge-multiple: false
      - name: Rebuild canonical W11 admitted inputs
        run: |
          mkdir -p local/w11-expected
          python scripts/build_ftrl_w11_inputs.py \
            --asset-output local/w11-expected/asset_manifest.csv \
            --processing-output local/w11-expected/processing_inventory.csv
      - name: Validate exact exhaustive admitted union
        run: |
          python scripts/validate_ftrl_w11_distributed.py \
            --evidence-root local/w11-evidence \
            --asset-manifest local/w11-expected/asset_manifest.csv \
            --processing-inventory local/w11-expected/processing_inventory.csv \
            --output local/ltmd_u1_w11_global_evidence.json
      - name: Upload global text-free evidence
        uses: actions/upload-artifact@v7
        with:
          name: ltmd-u1-w11-global-text-free-evidence
          path: local/ltmd_u1_w11_global_evidence.json
          if-no-files-found: error
          retention-days: 30
      - name: State computational result
        run: |
          echo 'W11 computational validation may be declared only after this aggregate job succeeds.'
          echo 'archival_complete remains false until private consolidation and checksum reverification.'

  report-failure:
    name: report-w11-failure
    if: failure() && github.event_name != 'pull_request'
    needs: [config-gate, precondition, book, aggregate]
    runs-on: ubuntu-latest
    steps:
      - name: Preserve epistemic status on failure
        run: |
          echo 'W11 did not complete every FTRL gate. Do not promote wave state or completion ledger.'

name: audit-semb03-sample-coverage

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/audit-semb03-sample-coverage.yml'
      - 'scripts/audit_semb03_sample_coverage.py'
      - 'data/derived/fragment_manifest.csv'
      - 'data/validation/semb03_human_reference_sample.csv'

permissions:
  contents: write

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Audit sample coverage and freeze poststratification weights
        run: python3 scripts/audit_semb03_sample_coverage.py
      - name: Publish coverage audit race-safely
        run: |
          set -euo pipefail
          rm -rf /tmp/ltmd-coverage
          mkdir -p /tmp/ltmd-coverage
          cp data/derived/semb03_sample_coverage.csv /tmp/ltmd-coverage/
          cp data/derived/semb03_sample_token_coverage.csv /tmp/ltmd-coverage/
          cp data/derived/semb03_sample_coverage.md /tmp/ltmd-coverage/
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          for attempt in 1 2 3; do
            git fetch origin main
            git reset --hard origin/main
            cp /tmp/ltmd-coverage/* data/derived/
            git add data/derived/semb03_sample_coverage.csv \
                    data/derived/semb03_sample_token_coverage.csv \
                    data/derived/semb03_sample_coverage.md
            if git diff --cached --quiet; then exit 0; fi
            git commit -m 'Publish SEMB 0.3 sample coverage audit'
            if git push origin HEAD:main; then exit 0; fi
            sleep $((attempt * 2))
          done
          exit 1

name: Encrypted private OCR transport — 1972 CER batch 2

on:
  push:
    paths:
      - '.github/workflows/cer-private-transport-1972-batch2.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  encrypt-ocr:
    runs-on: ubuntu-24.04
    env:
      OMP_THREAD_LIMIT: '1'
    steps:
      - name: Install exact OCR dependencies
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq tesseract-ocr tesseract-ocr-spa python3-pil
          tesseract --version | head -1 | grep -F 'tesseract 5.3.4'
      - name: Write transient public certificate
        shell: bash
        run: |
          cat > public-cert.pem <<'PEM'
          -----BEGIN CERTIFICATE-----
          MIIEkTCCAvmgAwIBAgIUQsjpGwb7jBEwMySYU6hkBhSI2OgwDQYJKoZIhvcNAQEL
          BQAwWDEvMC0GA1UEAwwmTFRNRCBDRVIgZnVsbC1wYWdlIHRyYW5zaWVudCB0cmFu
          c3BvcnQxJTAjBgNVBAoMHExpYnJvIFRleHRvIE1leGljYW5vIERpZ2l0YWwwHhcN
          MjYwODE1MTUzNDUxWhcNMjYwODE3MTUzNDUxWjBYMS8wLQYDVQQDDCZMVE1EIENF
          UiBmdWxsLXBhZ2UgdHJhbnNpZW50IHRyYW5zcG9ydDElMCMGA1UECgwcTGlicm8g
          VGV4dG8gTWV4aWNhbm8gRGlnaXRhbDCCAaIwDQYJKoZIhvcNAQEBBQADggGPADCC
          AYoCggGBAPRf8MDrXCjitt/HK8lxZDtwkXl8faCrIk7Hi6YeeAJlRWX+fNMdKSSJ
          PPFH9Ph2OYiExWdB8NrJNQoG8BqGgOfCpmd4g/G4QBOe1KhO/rqT598SItKig3aA
          8+ZHQZfhOqCAtQ4lFvHD8gxoo87lTEsWl6UauPKmlqhFAqdR+M1DnUdz2C2IOUIb
          BH5CV5vxz8PfeMUdmk4R5NKjVo9boHGpy2bxeR1MY4cAl3O314PqiMx2r8mnHzOh
          x3FgiIc70wsyMjmfAffgyWhFMLZSHUiyqfPpZiIOhdWKQgnuJBzFSmYVjVNlIJO0
          eTdRIhVSZHv/C3V03p9r5INuiiNVxpIMLBq7dMThRgmo5I9qfchHiCz0pX9ygiTV
          orKj8/3x1nqufymFGa2HCxuiCV/BQFnBpKGGmklb0TFcuHuDBHV1Tun6yvoD7Qme
          mQ6moRnkh4TuRQV/iRoMVGJJGegRmMFq2cFrqgibH1cM5oA301Rbb03K33E5/MbV
          QkAyQBTcPwIDAQABo1MwUTAdBgNVHQ4EFgQUzTsIVA4u3JrYnx5xzSqfNdzWCKww
          HwYDVR0jBBgwFoAUzTsIVA4u3JrYnx5xzSqfNdzWCKwwDwYDVR0TAQH/BAUwAwEB
          /zANBgkqhkiG9w0BAQsFAAOCAYEAcVs5/dc4fJJUxHotDsECfihEMoNFHTF6cm6w
          Y3XrlqaGv6VRNvVjIC1k1ifK+abBz2LfjYJYDWpXPQwrbuNYAyByDepoLzgDPulf
          igTxQF2Rc1YxHcdFOJxHwvKem+0aziWrW2jJfLR4a8N+Q7rZ5pCbrz4w0ESBLvBL
          TnuGvlUD90SGsAtYLjRoXvaCQJesBiYH1aVT4kONAl1M6M9JdnTFfIIGTgIlOAT8
          NExs/BycOvxJuycGOCH9Z/Y7/d2Plo3R/U4YVHZxfXx1dFKXpCSFu+l11twufDJk
          2KyTAq6yKZ/0ASfibiUXecnQpYAfIlaAGzDFvIo6tXT06QPXabNZyQfbTjA6u8+0
          GjpvBYsnvmNxVP/+mtCBcFAGjyR89c8Iuhsw+Jjnpm5+LGXowQs1RDsM9DeUdW61
          offMd4qOuJ+W6BX0oe+YxM3Os6+WlQMyjOFFhIcHkZ6XUew00H4mI60yxmD6ZSHQ
          C2E2I5rFrDawT46HEl9IUqgeCHmB
          -----END CERTIFICATE-----
          PEM
      - name: Download, crop and OCR in runner-local temporary storage
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p private_work
          curl -fsSL --retry 3 --connect-timeout 15 --max-time 90 'https://historico.conaliteg.gob.mx/c/H1972P5CI084/052.jpg' -o private_work/q1_2.jpg
          curl -fsSL --retry 3 --connect-timeout 15 --max-time 90 'https://historico.conaliteg.gob.mx/c/H1972P5CI084/085.jpg' -o private_work/q2_1.jpg
          curl -fsSL --retry 3 --connect-timeout 15 --max-time 90 'https://historico.conaliteg.gob.mx/c/H1972P5CI084/109.jpg' -o private_work/q2_2.jpg
          python3 - <<'PY'
          from PIL import Image
          specs={'q1_2':(50,30,630,938),'q2_1':(48,330,620,675),'q2_2':(50,775,620,940)}
          for name,box in specs.items():
              im=Image.open(f'private_work/{name}.jpg')
              assert im.size==(670,993), (name,im.size)
              im.crop(box).save(f'private_work/{name}_crop.png')
          PY
          for name in q1_2 q2_1 q2_2; do
            tesseract "private_work/${name}_crop.png" "private_work/${name}_ocr" -l spa --psm 3 >/dev/null 2>"private_work/${name}_tesseract.stderr"
          done
      - name: Build private payload and public manifest
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib,json,subprocess
          from pathlib import Path
          samples=[
            ('LTMD-CER-1972-Q1_2','q1_2','LTMD-CN5-G1972-VP052',[50,30,630,938]),
            ('LTMD-CER-1972-Q2_1','q2_1','LTMD-CN5-G1972-VP085',[48,330,620,675]),
            ('LTMD-CER-1972-Q2_2','q2_2','LTMD-CN5-G1972-VP109',[50,775,620,940]),
          ]
          version=subprocess.check_output(['tesseract','--version'],text=True).splitlines()[0]
          private=[]; public=[]
          for sample_id,name,page_id,box in samples:
              source=Path(f'private_work/{name}.jpg').read_bytes()
              text=Path(f'private_work/{name}_ocr.txt').read_text(encoding='utf-8')
              sha=hashlib.sha256(source).hexdigest()
              private.append({'sample_id':sample_id,'page_id':page_id,'crop_px':box,'psm':3,'tesseract_version':version,'source_sha256':sha,'ocr_text_private':text})
              public.append({'sample_id':sample_id,'page_id':page_id,'crop_px':box,'psm':3,'tesseract_version':version,'source_sha256':sha,'ocr_text_chars':len(text)})
          Path('private_payload.json').write_text(json.dumps(private,ensure_ascii=False,indent=2),encoding='utf-8')
          Path('public_manifest.json').write_text(json.dumps({'samples':public},ensure_ascii=False,indent=2),encoding='utf-8')
          PY
      - name: Encrypt private OCR payload and destroy readable working data
        shell: bash
        run: |
          set -euo pipefail
          openssl cms -encrypt -binary -aes256 -in private_payload.json -outform DER -out private_payload.p7m public-cert.pem
          sha256sum private_payload.p7m > ciphertext.sha256
          rm -rf private_work private_payload.json public-cert.pem
      - name: Upload ciphertext and non-text manifest only
        uses: actions/upload-artifact@v7
        with:
          name: ltmd-cer-1972-batch2-encrypted-ocr
          path: |
            private_payload.p7m
            public_manifest.json
            ciphertext.sha256
          retention-days: 1
          if-no-files-found: error

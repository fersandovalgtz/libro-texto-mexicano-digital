name: Repository quality

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  repository-quality:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Compile quality auditor
        run: python -m py_compile scripts/audit_repository_quality.py

      - name: Audit repository surface
        run: python scripts/audit_repository_quality.py --json repository-quality-report.json

      - name: Publish job summary
        if: always()
        shell: bash
        run: |
          {
            echo "## LTMD repository quality"
            echo
            echo '```json'
            if [ -f repository-quality-report.json ]; then
              cat repository-quality-report.json
            else
              echo '{"status":"audit did not produce a report"}'
            fi
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Build preservation snapshot
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p preservation
          git bundle create preservation/repository.bundle --all
          git archive --format=zip --output=preservation/repository-tree.zip HEAD
          BUNDLE_SHA=$(sha256sum preservation/repository.bundle | awk '{print $1}')
          TREE_SHA=$(sha256sum preservation/repository-tree.zip | awk '{print $1}')
          BUNDLE_SIZE=$(stat -c%s preservation/repository.bundle)
          TREE_SIZE=$(stat -c%s preservation/repository-tree.zip)
          {
            echo 'schema=LTMD_REPO_PRESERVATION_ARTIFACT_0.2'
            echo "source_sha=${GITHUB_SHA}"
            echo "source_ref=${GITHUB_REF}"
            echo "bundle_size=${BUNDLE_SIZE}"
            echo "bundle_sha256=${BUNDLE_SHA}"
            echo "tree_size=${TREE_SIZE}"
            echo "tree_sha256=${TREE_SHA}"
            echo 'bundle_verify=git bundle verify repository.bundle'
            echo 'transport=separate-artifacts-for-drive-handoff'
          } > preservation/manifest.txt
          git bundle verify preservation/repository.bundle

      - name: Upload preservation Git bundle
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v4
        with:
          name: ltmd-repo-bundle-${{ github.sha }}
          path: preservation/repository.bundle
          retention-days: 14
          compression-level: 0

      - name: Upload preservation tree
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v4
        with:
          name: ltmd-repo-tree-${{ github.sha }}
          path: preservation/repository-tree.zip
          retention-days: 14
          compression-level: 0

      - name: Upload preservation manifest
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v4
        with:
          name: ltmd-repo-manifest-${{ github.sha }}
          path: preservation/manifest.txt
          retention-days: 14
          compression-level: 0

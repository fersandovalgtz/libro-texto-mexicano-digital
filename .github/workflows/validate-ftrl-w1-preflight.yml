name: Validate FTRL W1 preflight

on:
  pull_request:
    paths:
      - 'scripts/preflight_ftrl_w1.py'
      - 'data/catalog/ciencias_naturales_family_asset_readiness.csv'
      - 'data/catalog/ciencias_naturales_pending_page_manifest_summary.csv'
      - 'data/expansion/cn46_page_manifest_summary.csv'
      - 'data/book_inventory.csv'
      - '.github/workflows/validate-ftrl-w1-preflight.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  preflight-w1:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout exact revision
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Reconcile W1 documentary layers
        run: |
          python scripts/preflight_ftrl_w1.py --output local/ftrl/ltmd_u1_w1_preflight.json

      - name: Assert text-free diagnosis and exact cardinalities
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p = Path('local/ftrl/ltmd_u1_w1_preflight.json')
          d = json.loads(p.read_text(encoding='utf-8'))
          assert d['schema'] == 'LTMD_FTRL_W1_PREFLIGHT_0.1'
          assert d['wave'] == 'W1'
          assert d['historical_identities'] == 37
          assert d['canonical_processing_objects'] == 33
          assert d['byte_identical_aliases'] == 4
          assert d['source_admitted_jpegs'] == 5926
          assert d['internal_unserved_positions'] == 3
          assert d['status'] == 'blocked_missing_versioned_pilot_sha_manifest'
          assert len(d['unanchored_pilot_objects']) == 4
          raw = p.read_text(encoding='utf-8').lower()
          for forbidden in ('ocr_text_raw', 'search_text', 'snippet'):
              assert forbidden not in raw
          print('W1 preflight diagnosis validated')
          PY

      - name: Prove fail-closed FTRL gate
        run: |
          set +e
          python scripts/preflight_ftrl_w1.py --require-cryptographic-ready > /tmp/w1_gate.log 2>&1
          code=$?
          set -e
          if [ "$code" -eq 0 ]; then
            echo 'ERROR: W1 full-FTRL gate unexpectedly passed without versioned pilot SHA manifests'
            exit 1
          fi
          grep -q 'not cryptographically ready' /tmp/w1_gate.log
          echo 'Fail-closed gate behaved as expected'

      - name: Upload text-free preflight evidence
        uses: actions/upload-artifact@v4
        with:
          name: ltmd-u1-w1-preflight-text-free
          path: local/ftrl/ltmd_u1_w1_preflight.json
          if-no-files-found: error

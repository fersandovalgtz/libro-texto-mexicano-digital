name: audit-ltmd-u1-w2-math-assets

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/audit-ltmd-u1-w2-math-assets.yml'
      - 'scripts/audit_ltmd_u1_w2_math_assets_book.py'
      - 'scripts/combine_ltmd_u1_w2_math_asset_shards.py'
      - 'data/catalog/ltmd_u1_w2_scope.csv'
      - 'data/catalog/ltmd_u1_w2_declared_inventory.csv'

permissions:
  contents: write

jobs:
  matrix:
    runs-on: ubuntu-24.04
    outputs:
      viewers: ${{ steps.make.outputs.viewers }}
    steps:
      - uses: actions/checkout@v7
      - id: make
        shell: bash
        run: |
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import csv, json
          rows=list(csv.DictReader(open('data/catalog/ltmd_u1_w2_scope.csv',encoding='utf-8')))
          keys=[r['viewer_key'] for r in rows]
          assert len(keys)==64 and len(set(keys))==64
          print('viewers='+json.dumps(keys,separators=(',',':')))
          PY

  audit:
    needs: matrix
    strategy:
      fail-fast: false
      max-parallel: 8
      matrix:
        viewer_key: ${{ fromJSON(needs.matrix.outputs.viewers) }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - name: Audit one Mathematics viewer
        run: python3 scripts/audit_ltmd_u1_w2_math_assets_book.py --viewer-key '${{ matrix.viewer_key }}'
      - uses: actions/upload-artifact@v4
        with:
          name: ltmd-u1-w2-math-assets-${{ matrix.viewer_key }}
          path: data/work/ltmd_u1_w2_math_assets/*.csv
          if-no-files-found: error
          retention-days: 1

  combine:
    needs: audit
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@v4
        with:
          pattern: ltmd-u1-w2-math-assets-*
          path: data/work/ltmd_u1_w2_math_assets
          merge-multiple: true
      - name: Combine exact 64-viewer audit
        run: python3 scripts/combine_ltmd_u1_w2_math_asset_shards.py
      - name: Publish W2 asset audit race-safely
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/ltmd-u1-w2-assets
          cp data/catalog/ltmd_u1_w2_math_asset_manifest.csv /tmp/ltmd-u1-w2-assets/
          cp data/catalog/ltmd_u1_w2_math_asset_summary.csv /tmp/ltmd-u1-w2-assets/
          cp data/catalog/ltmd_u1_w2_math_asset_audit.md /tmp/ltmd-u1-w2-assets/
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          for attempt in 1 2 3; do
            git fetch origin main
            git reset --hard origin/main
            cp /tmp/ltmd-u1-w2-assets/* data/catalog/
            git add data/catalog/ltmd_u1_w2_math_asset_manifest.csv data/catalog/ltmd_u1_w2_math_asset_summary.csv data/catalog/ltmd_u1_w2_math_asset_audit.md
            if git diff --cached --quiet; then exit 0; fi
            git commit -m 'Publish LTMD-U1 W2 mathematics source asset audit'
            if git push origin HEAD:main; then exit 0; fi
            sleep $((attempt * 2))
          done
          exit 1

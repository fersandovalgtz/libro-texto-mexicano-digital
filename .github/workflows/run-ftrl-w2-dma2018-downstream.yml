name: Run FTRL W2 DMA 2018 downstream

on:
  workflow_dispatch:
  push:
    branches: [science/w2-dma2018-downstream-167]
    paths:
      - 'scripts/build_ftrl_w2_inputs.py'
      - 'scripts/run_ftrl_w2_book.py'
      - '.github/workflows/run-ftrl-w2-dma2018-downstream.yml'
      - 'data/catalog/ltmd_u1_w2_math_reconciled_summary.csv'
      - 'data/catalog/ltmd_u1_w2_math_reconciled_manifest.csv'
  pull_request:
    branches: [main]
    paths:
      - 'scripts/build_ftrl_w2_inputs.py'
      - 'scripts/run_ftrl_w2_book.py'
      - '.github/workflows/run-ftrl-w2-dma2018-downstream.yml'
      - 'data/catalog/ltmd_u1_w2_math_reconciled_summary.csv'
      - 'data/catalog/ltmd_u1_w2_math_reconciled_manifest.csv'

permissions:
  contents: read

concurrency:
  group: ftrl-w2-dma2018-${{ github.ref }}
  cancel-in-progress: false

jobs:
  config-gate:
    name: validate-w2-dma2018-config
    runs-on: ubuntu-latest
    outputs:
      viewers: ${{ steps.matrix.outputs.viewers }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Compile W2 FTRL scripts
        run: python -m py_compile scripts/build_ftrl_w2_inputs.py scripts/run_ftrl_w2_book.py
      - name: Rebuild normalized W2 inputs without network
        run: |
          python scripts/build_ftrl_w2_inputs.py \
            --asset-output /tmp/w2_asset_manifest.csv \
            --processing-output /tmp/w2_processing_inventory.csv
      - name: Validate current W2 denominator and exact DMA matrix
        id: matrix
        run: |
          python - <<'PY'
          import csv, json, os
          from collections import Counter

          DMA = {
              'H2018P3DMA': 225,
              'H2018P4DMA': 257,
              'H2018P5DMA': 225,
              'H2018P6DMA': 185,
          }
          ALIASES = {
              'H1982P4MA388': 'H1972P4MA083',
              'H1982P5MA394': 'H1972P5MA089',
              'H1982P6MA399': 'H1972P6MA094',
          }

          def read(path):
              with open(path, encoding='utf-8', newline='') as fh:
                  return list(csv.DictReader(fh))

          assets = read('/tmp/w2_asset_manifest.csv')
          proc = read('/tmp/w2_processing_inventory.csv')
          scope = read('data/catalog/ltmd_u1_w2_scope.csv')
          summary = read('data/catalog/ltmd_u1_w2_math_reconciled_summary.csv')
          alias_rows = read('data/catalog/ltmd_u1_w2_math_reconciled_exact_aliases.csv')

          ready = {r['viewer_key'] for r in summary if r['effective_asset_ready'] == '1'}
          canonical = {r['viewer_key'] for r in proc}
          observed_aliases = {
              r['viewer_key']: r['canonical_viewer_key']
              for r in alias_rows if r['all_effective_pages_byte_identical_aligned'] == '1'
          }
          counts = Counter(r['viewer_key'] for r in assets)

          assert len(scope) == 64 and len(summary) == 64
          assert len(ready) == 64
          assert observed_aliases == ALIASES
          assert len(proc) == 61
          assert len(assets) == 12837
          assert ready == canonical | set(ALIASES)
          assert canonical.isdisjoint(set(ALIASES))
          assert set(DMA) <= canonical
          assert not (set(DMA) & set(ALIASES))
          assert all(r['is_canonical_processing_object'] == '1' for r in proc)
          assert all(r['technical_identity_covered'] == '1' for r in proc)
          assert all(r['persistent_internal_source_gaps'] == '0' for r in proc)
          for viewer, expected in DMA.items():
              assert counts[viewer] == expected, (viewer, counts[viewer], expected)

          viewers = list(DMA)
          with open(os.environ['GITHUB_OUTPUT'], 'a', encoding='utf-8') as fh:
              print('viewers=' + json.dumps(viewers, separators=(',', ':')), file=fh)
          print('W2 current denominator: 64 admitted / 61 canonical / 3 aliases / 0 retained / 12837 pages')
          print('DMA 2018 incremental target: 4 canonical / 892 pages')
          PY
      - name: Require immutable prior W2 archival closure
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          state = json.loads(Path('data/research/ltmd_u1_ftrl_wave_state.json').read_text(encoding='utf-8'))
          w2 = state['waves']['W2']
          assert w2['ftrl_status'] == 'validated', w2
          assert w2['archival_status'] == 'archival_complete', w2
          evidence = w2.get('archival_closure_evidence')
          assert evidence and Path(evidence).is_file(), w2
          closure = json.loads(Path(evidence).read_text(encoding='utf-8'))
          assert closure['archival_complete'] is True
          assert closure['source_partition']['admitted_historical_identities'] == 60
          assert closure['source_partition']['canonical_processing_objects'] == 57
          assert closure['source_partition']['source_pages'] == 11945
          print('Prior 57-book W2 archival closure preserved as immutable base evidence.')
          PY

  book:
    name: dma-${{ matrix.viewer }}
    needs: config-gate
    runs-on: ubuntu-latest
    timeout-minutes: 180
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        viewer: ${{ fromJSON(needs.config-gate.outputs.viewers) }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Spanish Tesseract data
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends tesseract-ocr tesseract-ocr-spa
          tesseract --list-langs | grep -Fx spa
      - name: Validate private preservation canon
        run: python scripts/validate_private_corpus_storage_contract.py
      - name: Execute deterministic DMA 2018 book unit
        run: |
          python scripts/run_ftrl_w2_book.py \
            --viewer-key '${{ matrix.viewer }}' \
            --output-dir local/ftrl-w2-dma2018
      - name: Assert public evidence is text-free and current
        env:
          VIEWER: ${{ matrix.viewer }}
        run: |
          python - <<'PY'
          import json, os
          from pathlib import Path
          expected_pages = {
              'H2018P3DMA': 225,
              'H2018P4DMA': 257,
              'H2018P5DMA': 225,
              'H2018P6DMA': 185,
          }
          viewer = os.environ['VIEWER']
          p = Path(f'local/ftrl-w2-dma2018/{viewer}/w2_{viewer}_evidence.json')
          data = json.loads(p.read_text(encoding='utf-8'))
          assert data['schema'] == 'LTMD_FTRL_W2_BOOK_UNIT_0.2'
          assert data['status'] == 'validated'
          assert data['viewer_key'] == viewer
          assert data['page_records'] == expected_pages[viewer]
          part = data['source_partition']
          assert part['historical_identities'] == 64
          assert part['admitted_historical_identities'] == 64
          assert part['canonical_processing_objects'] == 61
          assert part['exact_source_aliases'] == 3
          assert part['withheld_identities'] == 0
          assert part['full_admitted_canonical_source_pages'] == 12837
          forbidden = {'ocr_text_raw', 'search_text', 'snippet', 'text', 'normalized_text'}
          def walk(x):
              if isinstance(x, dict):
                  assert not (forbidden & set(x)), forbidden & set(x)
                  for v in x.values():
                      walk(v)
              elif isinstance(x, list):
                  for v in x:
                      walk(v)
          walk(data)
          PY
      - name: Build and encrypt restricted DMA archive
        env:
          VIEWER: ${{ matrix.viewer }}
        run: |
          set -euo pipefail
          DIR="local/ftrl-w2-dma2018/${VIEWER}"
          HANDOFF="local/private-handoff-w2-dma2018-${VIEWER}"
          mkdir -p "$HANDOFF"
          tar -C "$DIR" -czf "$HANDOFF/w2_${VIEWER}_restricted.tar.gz" \
            "w2_${VIEWER}_page_ocr.jsonl" \
            "w2_${VIEWER}_ocr_search.sqlite" \
            "w2_${VIEWER}_qc_queue.json" \
            "w2_${VIEWER}_asset_manifest.csv" \
            "w2_${VIEWER}_run_manifest.json" \
            "w2_${VIEWER}_qc_summary.json"
          openssl rand -base64 48 > "/tmp/w2-${VIEWER}.pass"
          openssl enc -aes-256-cbc -salt -pbkdf2 -iter 250000 \
            -in "$HANDOFF/w2_${VIEWER}_restricted.tar.gz" \
            -out "$HANDOFF/w2_${VIEWER}_restricted.tar.gz.enc" \
            -pass file:"/tmp/w2-${VIEWER}.pass"
          openssl pkeyutl -encrypt \
            -pubin -inkey security/ltmd_archive_public.pem \
            -in "/tmp/w2-${VIEWER}.pass" \
            -out "$HANDOFF/w2_${VIEWER}_passphrase.rsa-oaep.enc" \
            -pkeyopt rsa_padding_mode:oaep -pkeyopt rsa_oaep_md:sha256
          sha256sum "$HANDOFF/w2_${VIEWER}_restricted.tar.gz.enc" "$HANDOFF/w2_${VIEWER}_passphrase.rsa-oaep.enc" > "$HANDOFF/SHA256SUMS.txt"
          rm -f "$HANDOFF/w2_${VIEWER}_restricted.tar.gz" "/tmp/w2-${VIEWER}.pass"
      - name: Write encrypted handoff manifest
        env:
          VIEWER: ${{ matrix.viewer }}
          GH_RUN_ID: ${{ github.run_id }}
          GH_SHA: ${{ github.sha }}
        run: |
          python - <<'PY'
          import hashlib, json, os
          from pathlib import Path
          viewer = os.environ['VIEWER']
          handoff = Path(f'local/private-handoff-w2-dma2018-{viewer}')
          evidence = json.loads(Path(f'local/ftrl-w2-dma2018/{viewer}/w2_{viewer}_evidence.json').read_text(encoding='utf-8'))
          public_key = Path('security/ltmd_archive_public.pem')
          public_key_sha256 = hashlib.sha256(public_key.read_bytes()).hexdigest()
          assert public_key_sha256 == '78852eafbaa332247f99e23508ac157b5b906c6c3bf3aeb0af1dfe8d57579c2d'
          def desc(name):
              p = handoff / name
              return {
                  'name': name,
                  'bytes': p.stat().st_size,
                  'sha256': hashlib.sha256(p.read_bytes()).hexdigest(),
              }
          payload = f'w2_{viewer}_restricted.tar.gz.enc'
          key = f'w2_{viewer}_passphrase.rsa-oaep.enc'
          manifest = {
              'schema': 'LTMD_PRIVATE_FTRL_W2_DMA2018_HANDOFF_0.1',
              'wave': 'W2',
              'viewer_key': viewer,
              'page_records': evidence['page_records'],
              'source_commit': os.environ['GH_SHA'],
              'workflow_run_id': os.environ['GH_RUN_ID'],
              'encryption': {
                  'payload': 'AES-256-CBC + PBKDF2-SHA256, 250000 iterations',
                  'key_wrap': 'RSA-4096 OAEP SHA-256',
                  'public_key_sha256': public_key_sha256,
              },
              'files': [desc(payload), desc(key), desc('SHA256SUMS.txt')],
              'plaintext_restricted_outputs_uploaded': False,
              'destination_policy': 'private preservation; Actions artifact is temporary encrypted handoff only',
              'archival_complete': False,
              'text_verified': False,
              'semantic_ready': False,
              'human_validation_status': 'deferred',
          }
          (handoff / f'w2_{viewer}_private_handoff_manifest.json').write_text(
              json.dumps(manifest, indent=2, sort_keys=True) + '\n', encoding='utf-8'
          )
          PY
      - name: Prove plaintext restricted archive is absent
        env:
          VIEWER: ${{ matrix.viewer }}
        run: |
          HANDOFF="local/private-handoff-w2-dma2018-${VIEWER}"
          test ! -f "$HANDOFF/w2_${VIEWER}_restricted.tar.gz"
          test -f "$HANDOFF/w2_${VIEWER}_restricted.tar.gz.enc"
          test -f "$HANDOFF/w2_${VIEWER}_passphrase.rsa-oaep.enc"
      - name: Upload encrypted private handoff only
        uses: actions/upload-artifact@v4
        with:
          name: ltmd-u1-w2-dma2018-${{ matrix.viewer }}-private-encrypted
          path: local/private-handoff-w2-dma2018-${{ matrix.viewer }}/
          if-no-files-found: error
          retention-days: 3
      - name: Upload text-free computational evidence
        uses: actions/upload-artifact@v4
        with:
          name: ltmd-u1-w2-dma2018-${{ matrix.viewer }}-text-free-evidence
          path: |
            local/ftrl-w2-dma2018/${{ matrix.viewer }}/w2_${{ matrix.viewer }}_evidence.json
            local/ftrl-w2-dma2018/${{ matrix.viewer }}/w2_${{ matrix.viewer }}_run_manifest.json
            local/ftrl-w2-dma2018/${{ matrix.viewer }}/w2_${{ matrix.viewer }}_qc_summary.json
            local/ftrl-w2-dma2018/${{ matrix.viewer }}/w2_${{ matrix.viewer }}_asset_manifest.csv
          if-no-files-found: error
          retention-days: 30

  aggregate:
    name: validate-w2-dma2018-incremental-union
    needs: book
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download DMA text-free evidence
        uses: actions/download-artifact@v4
        with:
          pattern: ltmd-u1-w2-dma2018-*-text-free-evidence
          path: local/w2-dma2018-evidence
          merge-multiple: false
      - name: Validate exact four-book union and write aggregate evidence
        env:
          GH_RUN_ID: ${{ github.run_id }}
          GH_SHA: ${{ github.sha }}
        run: |
          python - <<'PY'
          import json, os
          from pathlib import Path

          expected = {
              'H2018P3DMA': 225,
              'H2018P4DMA': 257,
              'H2018P5DMA': 225,
              'H2018P6DMA': 185,
          }
          root = Path('local/w2-dma2018-evidence')
          evidence_files = sorted(root.rglob('w2_*_evidence.json'))
          assert len(evidence_files) == 4, evidence_files
          records = [json.loads(p.read_text(encoding='utf-8')) for p in evidence_files]
          by = {r['viewer_key']: r for r in records}
          assert set(by) == set(expected), set(by)
          page_hashes = []
          for viewer, pages in expected.items():
              row = by[viewer]
              assert row['schema'] == 'LTMD_FTRL_W2_BOOK_UNIT_0.2'
              assert row['status'] == 'validated'
              assert row['page_records'] == pages
              assert len(row['page_key_hashes']) == pages
              part = row['source_partition']
              assert part == {
                  'historical_identities': 64,
                  'admitted_historical_identities': 64,
                  'canonical_processing_objects': 61,
                  'exact_source_aliases': 3,
                  'withheld_identities': 0,
                  'full_admitted_canonical_source_pages': 12837,
                  'unit': 'one source-admitted canonical viewer/book',
              }
              page_hashes.extend(row['page_key_hashes'])
          assert sum(expected.values()) == 892
          assert len(page_hashes) == len(set(page_hashes)) == 892

          aggregate = {
              'schema': 'LTMD_U1_W2_DMA2018_INCREMENTAL_EVIDENCE_0.1',
              'status': 'computationally_validated',
              'wave': 'W2',
              'domain': 'Matemáticas',
              'source_commit': os.environ['GH_SHA'],
              'workflow_run_id': os.environ['GH_RUN_ID'],
              'incremental_partition': {
                  'canonical_processing_objects': 4,
                  'source_pages': 892,
                  'viewer_keys': list(expected),
                  'pages_by_viewer': expected,
              },
              'current_w2_source_partition': {
                  'historical_identities': 64,
                  'admitted_historical_identities': 64,
                  'canonical_processing_objects': 61,
                  'exact_source_aliases': 3,
                  'withheld_identities': 0,
                  'source_pages': 12837,
              },
              'page_key_hash_count': 892,
              'page_key_hashes_unique': True,
              'archival_complete': False,
              'text_verified': False,
              'semantic_ready': False,
              'human_validation_status': 'deferred',
              'epistemic_guards': [
                  'routing_resolved != downstream_processed',
                  'downstream_processed != ftrl_validated',
                  'computationally_validated != archival_complete',
                  'automated_validation != human_validation',
                  'ftrl_validated != text_verified',
                  'text_verified != semantic_ready',
              ],
          }
          out = Path('local/ltmd_u1_w2_dma2018_incremental_evidence.json')
          out.write_text(json.dumps(aggregate, indent=2, sort_keys=True) + '\n', encoding='utf-8')
          print(json.dumps({'status': 'ok', 'books': 4, 'pages': 892}, sort_keys=True))
          PY
      - name: Upload aggregate text-free evidence
        uses: actions/upload-artifact@v4
        with:
          name: ltmd-u1-w2-dma2018-global-text-free-evidence
          path: local/ltmd_u1_w2_dma2018_incremental_evidence.json
          if-no-files-found: error
          retention-days: 30
      - name: State non-promotion boundary
        run: |
          echo 'Successful CI proves computational FTRL for the four DMA 2018 identities only.'
          echo 'Do not promote completion ledger until encrypted preservation is independently verified.'
          echo 'Human validation is deferred; text_verified and semantic_ready remain false.'

  report-failure:
    name: report-w2-dma2018-failure
    if: failure()
    needs: [config-gate, book, aggregate]
    runs-on: ubuntu-latest
    steps:
      - run: echo 'DMA 2018 downstream did not pass every gate. Do not promote W2 completion state.'

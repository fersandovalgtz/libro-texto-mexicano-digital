name: build-ltmd-u1-w2-completion-report

on:
  workflow_dispatch:

permissions:
  actions: write
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Build completion report only from finalized W2 artifacts
        run: python3 scripts/build_ltmd_u1_w2_completion_report.py
      - name: Publish W2 completion report race-safely
        shell: bash
        run: |
          set -euo pipefail
          cp docs/LTMD_U1_W2_COMPLETION.md /tmp/LTMD_U1_W2_COMPLETION.md
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          for attempt in 1 2 3; do
            git fetch origin main
            git reset --hard origin/main
            cp /tmp/LTMD_U1_W2_COMPLETION.md docs/LTMD_U1_W2_COMPLETION.md
            git add docs/LTMD_U1_W2_COMPLETION.md
            if git diff --cached --quiet; then break; fi
            git commit -m 'Publish LTMD-U1 W2 Mathematics completion report'
            if git push origin HEAD:main; then break; fi
            if [ "$attempt" -eq 3 ]; then exit 1; fi
            sleep $((attempt * 2))
          done
      - name: Dispatch W2 post-release integrity checkpoint
        run: gh workflow run build-ltmd-u1-w2-integrity-checkpoint.yml --repo "$GITHUB_REPOSITORY"

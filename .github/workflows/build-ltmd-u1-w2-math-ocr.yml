name: build-ltmd-u1-w2-math-ocr

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/build-ltmd-u1-w2-math-ocr.yml'
      - 'scripts/ocr_ltmd_u1_w2_math_book.py'
      - 'scripts/combine_ltmd_u1_w2_math_ocr.py'
      - 'data/catalog/ltmd_u1_w2_math_reconciled_manifest.csv'
      - 'data/catalog/ltmd_u1_w2_math_reconciled_summary.csv'
      - 'data/catalog/ltmd_u1_w2_math_reconciled_exact_aliases.csv'

permissions:
  contents: write

jobs:
  gate:
    runs-on: ubuntu-24.04
    outputs:
      viewers: ${{ steps.make.outputs.viewers }}
    steps:
      - uses: actions/checkout@v4
      - id: make
        shell: bash
        run: |
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import csv,json
          scope=list(csv.DictReader(open('data/catalog/ltmd_u1_w2_scope.csv',encoding='utf-8')))
          summary=list(csv.DictReader(open('data/catalog/ltmd_u1_w2_math_reconciled_summary.csv',encoding='utf-8')))
          aliases=list(csv.DictReader(open('data/catalog/ltmd_u1_w2_math_reconciled_exact_aliases.csv',encoding='utf-8')))
          assert len(scope)==64 and len(summary)==64, (len(scope),len(summary))
          order=[r['viewer_key'] for r in scope]
          assert set(order)=={r['viewer_key'] for r in summary}
          ready={r['viewer_key'] for r in summary if r['effective_asset_ready']=='1'}
          alias={r['viewer_key'] for r in aliases if r['all_effective_pages_byte_identical_aligned']=='1'}
          canonical=[k for k in order if k in ready and k not in alias]
          assert len(ready)==60, len(ready)
          assert len(alias)==3 and alias<=ready, alias
          assert len(canonical)==57, len(canonical)
          print('viewers='+json.dumps(canonical,separators=(',',':')))
          PY

  ocr:
    needs: gate
    strategy:
      fail-fast: false
      max-parallel: 8
      matrix:
        viewer_key: ${{ fromJSON(needs.gate.outputs.viewers) }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install Spanish Tesseract
        run: |
          sudo apt-get update
          sudo apt-get install -y tesseract-ocr tesseract-ocr-spa
      - name: OCR one canonical Mathematics viewer
        run: python3 scripts/ocr_ltmd_u1_w2_math_book.py --viewer-key '${{ matrix.viewer_key }}'
      - uses: actions/upload-artifact@v4
        with:
          name: ltmd-u1-w2-math-ocr-${{ matrix.viewer_key }}
          path: data/work/ltmd_u1_w2_math_ocr/*.csv
          if-no-files-found: error
          retention-days: 1

  combine:
    needs: ocr
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@v8
        with:
          pattern: ltmd-u1-w2-math-ocr-*
          path: data/work/ltmd_u1_w2_math_ocr
          merge-multiple: true
      - name: Combine exact 57-canonical-viewer OCR 0.2 layer
        run: python3 scripts/combine_ltmd_u1_w2_math_ocr.py
      - name: Publish W2 OCR 0.2 metrics race-safely
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/ltmd-u1-w2-math-ocr
          cp data/catalog/ltmd_u1_w2_math_ocr_metrics.csv /tmp/ltmd-u1-w2-math-ocr/
          cp data/catalog/ltmd_u1_w2_math_ocr_summary.csv /tmp/ltmd-u1-w2-math-ocr/
          cp data/catalog/ltmd_u1_w2_math_ocr.md /tmp/ltmd-u1-w2-math-ocr/
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          for attempt in 1 2 3; do
            git fetch origin main
            git reset --hard origin/main
            cp /tmp/ltmd-u1-w2-math-ocr/* data/catalog/
            git add data/catalog/ltmd_u1_w2_math_ocr_metrics.csv data/catalog/ltmd_u1_w2_math_ocr_summary.csv data/catalog/ltmd_u1_w2_math_ocr.md
            if git diff --cached --quiet; then exit 0; fi
            git commit -m 'Publish LTMD-U1 W2 mathematics OCR 0.2 metrics'
            if git push origin HEAD:main; then exit 0; fi
            sleep $((attempt * 2))
          done
          exit 1

name: build-ltmd-u1-w2-math-ocr

on:
  workflow_dispatch:
  workflow_run:
    workflows:
      - audit-ltmd-u1-w2-math-assets
    types: [completed]

permissions:
  contents: write

jobs:
  gate:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-24.04
    outputs:
      viewers: ${{ steps.make.outputs.viewers }}
    steps:
      - uses: actions/checkout@v4
      - id: make
        shell: bash
        run: |
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import csv,json
          scope=list(csv.DictReader(open('data/catalog/ltmd_u1_w2_scope.csv',encoding='utf-8')))
          summary=list(csv.DictReader(open('data/catalog/ltmd_u1_w2_math_asset_summary.csv',encoding='utf-8')))
          assert len(scope)==64 and len(summary)==64, (len(scope),len(summary))
          assert {r['viewer_key'] for r in scope}=={r['viewer_key'] for r in summary}
          bad=[r for r in summary if r['direct_asset_ready']!='1' or int(r['internal_unserved'])!=0 or int(r['probe_errors'])!=0]
          if bad:
              raise SystemExit(f'W2 asset gate closed: {len(bad)} viewers not ready; first={[r["viewer_key"] for r in bad[:5]]}')
          keys=[r['viewer_key'] for r in scope]
          print('viewers='+json.dumps(keys,separators=(',',':')))
          PY

  ocr:
    needs: gate
    strategy:
      fail-fast: false
      max-parallel: 8
      matrix:
        viewer_key: ${{ fromJSON(needs.gate.outputs.viewers) }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install Spanish Tesseract
        run: |
          sudo apt-get update
          sudo apt-get install -y tesseract-ocr tesseract-ocr-spa
      - name: OCR one Mathematics viewer
        run: python3 scripts/ocr_ltmd_u1_w2_math_book.py --viewer-key '${{ matrix.viewer_key }}'
      - uses: actions/upload-artifact@v4
        with:
          name: ltmd-u1-w2-math-ocr-${{ matrix.viewer_key }}
          path: data/work/ltmd_u1_w2_math_ocr/*.csv
          if-no-files-found: error
          retention-days: 1

  combine:
    needs: ocr
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@v4
        with:
          pattern: ltmd-u1-w2-math-ocr-*
          path: data/work/ltmd_u1_w2_math_ocr
          merge-multiple: true
      - name: Combine exact 64-viewer OCR layer
        run: python3 scripts/combine_ltmd_u1_w2_math_ocr.py
      - name: Publish W2 OCR metrics race-safely
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/ltmd-u1-w2-math-ocr
          cp data/catalog/ltmd_u1_w2_math_ocr_metrics.csv /tmp/ltmd-u1-w2-math-ocr/
          cp data/catalog/ltmd_u1_w2_math_ocr_summary.csv /tmp/ltmd-u1-w2-math-ocr/
          cp data/catalog/ltmd_u1_w2_math_ocr.md /tmp/ltmd-u1-w2-math-ocr/
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          for attempt in 1 2 3; do
            git fetch origin main
            git reset --hard origin/main
            cp /tmp/ltmd-u1-w2-math-ocr/* data/catalog/
            git add data/catalog/ltmd_u1_w2_math_ocr_metrics.csv data/catalog/ltmd_u1_w2_math_ocr_summary.csv data/catalog/ltmd_u1_w2_math_ocr.md
            if git diff --cached --quiet; then exit 0; fi
            git commit -m 'Publish LTMD-U1 W2 mathematics OCR metrics'
            if git push origin HEAD:main; then exit 0; fi
            sleep $((attempt * 2))
          done
          exit 1

name: sync-ltmd-u1-technical-status

on:
  workflow_dispatch:
  workflow_run:
    workflows:
      - 'build-ltmd-u1-w3-completion-report'
      - 'build-ltmd-u1-w4-social-sciences-completion-report'
    types: [completed]
  push:
    paths:
      - '.github/workflows/sync-ltmd-u1-technical-status.yml'
      - 'scripts/build_ltmd_u1_technical_status.py'

permissions:
  contents: write

jobs:
  sync:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Build status from versioned artifacts
        run: python3 scripts/build_ltmd_u1_technical_status.py
      - name: Publish machine-derived status
        shell: bash
        run: |
          set -euo pipefail
          cp docs/LTMD_U1_TECHNICAL_STATUS.md /tmp/LTMD_U1_TECHNICAL_STATUS.md
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          for attempt in 1 2 3; do
            git fetch origin main
            git reset --hard origin/main
            cp /tmp/LTMD_U1_TECHNICAL_STATUS.md docs/LTMD_U1_TECHNICAL_STATUS.md
            git add docs/LTMD_U1_TECHNICAL_STATUS.md
            if git diff --cached --quiet; then exit 0; fi
            git commit -m 'Sync machine-derived LTMD-U1 technical status'
            if git push origin HEAD:main; then exit 0; fi
            sleep $((attempt * 2))
          done
          exit 1

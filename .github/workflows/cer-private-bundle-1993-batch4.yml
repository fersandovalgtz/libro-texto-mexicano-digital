name: Encrypted private bundle — 1993 CER batch 4
on:
  push:
    paths: ['.github/workflows/cer-private-bundle-1993-batch4.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  bundle:
    runs-on: ubuntu-24.04
    env:
      OMP_THREAD_LIMIT: '1'
    steps:
      - name: Install exact production OCR
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq tesseract-ocr tesseract-ocr-spa python3-pil
          tesseract --version | head -1 | tee version.txt
          grep -F 'tesseract 5.3.4' version.txt
      - name: Write one-use public certificate
        run: |
          cat > cert.pem <<'PEM'
          -----BEGIN CERTIFICATE-----
          MIIEgTCCAumgAwIBAgIUUTtpzFHO2O1Y4nt90nyJw+PZEQYwDQYJKoZIhvcNAQEL

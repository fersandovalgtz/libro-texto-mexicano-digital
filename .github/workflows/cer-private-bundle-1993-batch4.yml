          1cVRnKCPEv02vzvNE7zaY8yO3k/bhXKAnysOlVoqLcZx05FtRnfNj0KupIBDdJbT
          b84a9BUXF7yKapqnWLSr6WCiMkLPHUC30BPYI6i1XiNNs30CdIKdmTV8GHxjPoAz
          QUXZancKTXZeLe5iL6Jl3h6E8Vrm+z7u97HXs0C+IreaWxLNNB6OHUNakMqWwULL
          4Wx5y6MhV08r5+0o92m8SWgt3oKxn9/ClwI1UGskEjk74eiNCHYFEUZhADUaj3ek
          1wSz6b/O9DCR7mRZNr0CJGnzx3OFTlKMHsS5b0PoGgpkLrwgKoZUR4KufmjlNzpu
          8uwKpuARGWfX49zbhvBTHyxEaa9hrL2OQzAA1F7DQT6QXbh8dwMagLhmnTx+98T9
          Aj9bTTFbHW8hb4jQm0iah0BXmB61mbKyYIbsrsdSR5vSfLJFfj/gzEGW0rSBO8kt
          xI64rOlkleHGysZ0RnsNGw0WKiveBpkm1bkZDAXaZysY+tlp7wcbAgMBAAGjUzBR
          MB0GA1UdDgQWBBTiAGWH9pNTI0C9d6o4ksw7oy/UvTAfBgNVHSMEGDAWgBTiAGWH
          9pNTI0C9d6o4ksw7oy/UvTAPBgNVHRMBAf8EBTADAQH/MA0GCSqGSIb3DQEBCwUA
          A4IBgQB4YCj87T9DraHJZQ0tVhXT6ktvkOvEajt/m4VyCzkhx7uEYRcH9SG0Rok0
          YJ9n5RqbW6FaR1mzxJ3mtCmvyse1dEAA3275Q1E2giEa9pWMs0Fu1XINaO2cScNv
          +xnpkmVyw0yIRLjc0W1Z2udc/1w1fxG2c1nrGGxujIvnGXodaXbgasMmVBHGfRlm
          BFJRPcmBwcD09IkXRl1DUffgutVB9od7I13/gcSuKbqyMHU6iI7a09LubMWAPRZz
          qVUwaq9Asi7AIUsFQjCSC68GsmuxhGa3FpIGbm3IaWzdyg6S4wM0GC2mSNv/Gitv
          tfUXJHtFvijrzkAbs8afl1LUPTONKMt0NGSkHMzfJlC3FO6skelv9Hn4hB3dj0iq
          AkXSz4TDDCfArNRYAdTfRPLQaQYcbAr3N2cQIxZF08H8a/wFRu9WP461zP1SWZGl
          axjyTJJtX/xY6KQU7vMc5rK8MqKEndYvTAGPXTQroxNqIqlK3XbYAUK5IoTX80Ud
          cBGLCdU=
          -----END CERTIFICATE-----
          PEM
      - name: Acquire source pages and full-page production OCR
        run: |
          set -euo pipefail
          mkdir -p private_bundle
          for n in 131 149 170; do curl -fsSL --retry 3 --connect-timeout 15 --max-time 90 "https://historico.conaliteg.gob.mx/c/H1993P5CI200/${n}.jpg" -o "private_bundle/${n}.jpg"; done
          python3 - <<'PY'
          from PIL import Image
          for n in ('131','149','170'):
              with Image.open(f'private_bundle/{n}.jpg') as im: assert im.size == (797,1045), (n,im.size)
          PY
          for n in 131 149 170; do tesseract "private_bundle/${n}.jpg" "private_bundle/${n}" -l spa --psm 3 txt tsv >/dev/null 2>"private_bundle/${n}.stderr"; done
      - name: Write manifests
        run: |
          python3 - <<'PY'
          import hashlib,json
          from pathlib import Path
          pages=[('LTMD-CER-1993-Q3_3','131','LTMD-CN5-G1993-VP131'),('LTMD-CER-1993-Q4_1','149','LTMD-CN5-G1993-VP149'),('LTMD-CER-1993-Q4_2','170','LTMD-CN5-G1993-VP170')]
          ver=Path('version.txt').read_text().strip(); pub=[]
          for sid,n,pid in pages:
              b=Path(f'private_bundle/{n}.jpg').read_bytes(); pub.append({'sample_id':sid,'page_id':pid,'viewer_page':int(n),'selected_psm':3,'tesseract_version':ver,'source_sha256':hashlib.sha256(b).hexdigest(),'source_bytes':len(b)})
          Path('manifest.json').write_text(json.dumps({'transport':'encrypted private source+OCR bundle','pages':pub},indent=2),encoding='utf-8')
          PY
      - name: Encrypt and erase plaintext
        run: |
          tar -czf private_bundle.tar.gz private_bundle/
          openssl cms -encrypt -binary -aes256 -in private_bundle.tar.gz -outform DER -out payload.p7m cert.pem
          sha256sum payload.p7m > ciphertext.sha256
          rm -rf private_bundle private_bundle.tar.gz cert.pem version.txt
      - name: Upload ciphertext and manifest only
        uses: actions/upload-artifact@v4
        with:
          name: ltmd-cer-1993-batch4-private-bundle-encrypted
          path: |
            payload.p7m
            manifest.json
            ciphertext.sha256
          retention-days: 1

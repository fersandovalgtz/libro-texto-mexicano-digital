name: Classify fragments — validated SEMB 0.2

on:
  workflow_dispatch:

concurrency:
  group: fragment-classifier-B02-main
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  preflight:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Verify locked validation and frozen corpus inputs
        run: |
          python3 - <<'PY'
          import csv,json
          v=json.load(open('data/derived/semantic_B02_validation_result.json',encoding='utf-8'))
          assert v['validation_version']=='VALIDATION_B02_LOCKED_0.1'
          assert v['semantic_version']=='SEMB_0.2' and v['passed'] is True
          ps=list(csv.DictReader(open('data/derived/page_structure.csv',encoding='utf-8')))
          fm=list(csv.DictReader(open('data/derived/fragment_manifest.csv',encoding='utf-8')))
          assert len(ps)==759 and all(r['classifier_version']=='PAGESTRUCT_0.2' for r in ps)
          assert len(fm)==9594 and all(r['segmenter_version']=='FRAGSEG_0.2' for r in fm)
          print('SEMB 0.2 validation passed; frozen corpus ready')
          PY

  classify:
    needs: preflight
    strategy:
      fail-fast: false
      matrix:
        generation: ['1972','1988','1993','2014']
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    env:
      OMP_THREAD_LIMIT: '1'
      TOKENIZERS_PARALLELISM: 'false'
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned semantic runtime and OCR
        run: |
          python3 -m pip install --disable-pip-version-check 'sentence-transformers==5.6.1'
          sudo apt-get update -qq
          sudo apt-get install -y -qq tesseract-ocr tesseract-ocr-spa
          tesseract --version | head -1 | grep -F 'tesseract 5.3.4'
      - name: Reconstruct, SHA-verify and classify generation
        run: |
          python3 scripts/classify_fragments_B02.py \
            --generation '${{ matrix.generation }}' \
            --out 'data/derived/fragment_labels_B_${{ matrix.generation }}.csv'
      - name: Validate B shard
        run: |
          python3 - <<'PY'
          import csv,os,json
          gen=os.environ['GEN']
          rows=list(csv.DictReader(open(f'data/derived/fragment_labels_B_{gen}.csv',encoding='utf-8')))
          man=[r for r in csv.DictReader(open('data/derived/fragment_manifest.csv',encoding='utf-8')) if r['catalog_generation']==gen]
          v=json.load(open('data/derived/semantic_B02_validation_result.json',encoding='utf-8'))
          assert len(rows)==len(man)
          assert {r['fragment_id'] for r in rows}=={r['fragment_id'] for r in man}
          mh={r['fragment_id']:r['text_sha256'] for r in man}
          assert all(r['text_sha256']==mh[r['fragment_id']] for r in rows)
          assert all(r['semantic_rules_version']=='SEMB_0.2' for r in rows)
          assert all(r['semantic_model']=='intfloat/multilingual-e5-small' for r in rows)
          assert all(r['semantic_model_revision']=='fd1525a9fd15316a2d503bf26ab031a61d056e98' for r in rows)
          assert all(r['semantic_method']==v['selected_method'] for r in rows)
          print(gen,'rows',len(rows),'uncertain',sum(int(r['uncertain_B']) for r in rows),'truncation',sum(int(r['truncation_risk_B']) for r in rows))
          PY
        env:
          GEN: '${{ matrix.generation }}'
      - uses: actions/upload-artifact@v4
        with:
          name: labels-B02-${{ matrix.generation }}
          path: data/derived/fragment_labels_B_${{ matrix.generation }}.csv
          retention-days: 7

  combine:
    needs: classify
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v8
        with:
          pattern: labels-B02-*
          path: shards
          merge-multiple: true
      - name: Combine and summarize B labels
        run: |
          python3 - <<'PY'
          import csv
          from pathlib import Path
          gens=['1972','1988','1993','2014']
          man=list(csv.DictReader(open('data/derived/fragment_manifest.csv',encoding='utf-8')))
          rows=[]
          for g in gens: rows.extend(list(csv.DictReader(open(f'shards/fragment_labels_B_{g}.csv',encoding='utf-8'))))
          assert len(rows)==len(man)==9594
          assert {r['fragment_id'] for r in rows}=={r['fragment_id'] for r in man}
          out=Path('data/derived'); fields=list(rows[0].keys())
          with (out/'fragment_labels_B.csv').open('w',encoding='utf-8',newline='') as f:
              w=csv.DictWriter(f,fieldnames=fields);w.writeheader();w.writerows(rows)
          action_cols=[c for c in fields if c.startswith('action_') and c.endswith('_B') and c not in {'action_labels_B','action_gate_margin_B','action_gate_threshold_B','action_top_score_B','action_second_score_B','action_margin_B','action_label_count_B'}]
          pos_cols=[c for c in fields if c.startswith('position_') and c.endswith('_B') and c not in {'position_labels_B','position_top_score_B','position_second_score_B','position_margin_B','position_label_count_B'}]
          summary=[]
          for gen in gens+['ALL']:
              rs=rows if gen=='ALL' else [r for r in rows if r['catalog_generation']==gen]
              d={
                  'catalog_generation':gen,'fragment_count':len(rs),
                  'uncertain_B':sum(int(r['uncertain_B']) for r in rs),
                  'uncertain_rate_B':round(sum(int(r['uncertain_B']) for r in rs)/len(rs),6),
                  'truncation_risk_B':sum(int(r['truncation_risk_B']) for r in rs),
                  'zero_action_B':sum(int(r['action_label_count_B'])==0 for r in rs),
                  'zero_position_B':sum(int(r['position_label_count_B'])==0 for r in rs),
              }
              for c in action_cols+pos_cols:d[c]=sum(int(r[c]) for r in rs)
              summary.append(d)
          with (out/'fragment_labels_B_summary.csv').open('w',encoding='utf-8',newline='') as f:
              w=csv.DictWriter(f,fieldnames=list(summary[0].keys()));w.writeheader();w.writerows(summary)
          print((out/'fragment_labels_B_summary.csv').read_text(encoding='utf-8'))
          PY
      - name: Publish validated B labels race-safely
        run: |
          set -euo pipefail
          mkdir -p /tmp/semb02-derived
          cp data/derived/fragment_labels_B.csv /tmp/semb02-derived/
          cp data/derived/fragment_labels_B_summary.csv /tmp/semb02-derived/
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git fetch origin main
          git reset --hard origin/main
          cp /tmp/semb02-derived/* data/derived/
          git add data/derived/fragment_labels_B.csv data/derived/fragment_labels_B_summary.csv
          git commit -m 'data: publish validated semantic labels B 0.2'
          git push origin HEAD:main

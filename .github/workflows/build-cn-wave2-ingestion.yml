name: build-cn-wave2-ingestion

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/build-cn-wave2-ingestion.yml'
      - 'scripts/build_cn_wave2_ingestion.py'
      - 'data/catalog/ciencias_naturales_family_asset_readiness.csv'
      - 'data/catalog/ciencias_naturales_pending_page_manifest.csv'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Freeze Wave 2 queue and page submanifest
        run: python3 scripts/build_cn_wave2_ingestion.py
      - name: Publish Wave 2 race-safely
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/expansion/cn_wave2_ingestion_queue.csv data/expansion/cn_wave2_page_manifest.csv data/expansion/cn_wave2_ingestion_queue.md
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Freeze Ciencias Naturales technical Wave 2'
          git pull --rebase origin main
          git push origin HEAD:main

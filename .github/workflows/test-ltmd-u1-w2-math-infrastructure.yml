name: test-ltmd-u1-w2-math-infrastructure

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/test-ltmd-u1-w2-math-infrastructure.yml'
      - 'scripts/ocr_ltmd_u1_w2_math_book.py'
      - 'scripts/combine_ltmd_u1_w2_math_ocr.py'
      - 'scripts/extract_ltmd_u1_w2_math_structural_flags_book.py'
      - 'scripts/combine_ltmd_u1_w2_math_structural_flags.py'
      - 'scripts/classify_ltmd_u1_w2_math_page_structure.py'
      - 'scripts/segment_ltmd_u1_w2_math_fragments.py'
      - 'scripts/combine_ltmd_u1_w2_math_fragment_shards.py'
      - '.github/workflows/build-ltmd-u1-w2-math-ocr.yml'
      - '.github/workflows/build-ltmd-u1-w2-math-pagestruct.yml'
      - '.github/workflows/build-ltmd-u1-w2-math-fragseg.yml'

permissions:
  contents: read

jobs:
  selftest:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - name: Compile W2 Python infrastructure
        run: |
          python3 -m py_compile \
            scripts/ocr_ltmd_u1_w2_math_book.py \
            scripts/combine_ltmd_u1_w2_math_ocr.py \
            scripts/extract_ltmd_u1_w2_math_structural_flags_book.py \
            scripts/combine_ltmd_u1_w2_math_structural_flags.py \
            scripts/classify_ltmd_u1_w2_math_page_structure.py \
            scripts/segment_ltmd_u1_w2_math_fragments.py \
            scripts/combine_ltmd_u1_w2_math_fragment_shards.py
      - name: Check frozen W2 scope invariants
        run: |
          python3 - <<'PY'
          import csv
          scope=list(csv.DictReader(open('data/catalog/ltmd_u1_w2_scope.csv',encoding='utf-8')))
          declared=list(csv.DictReader(open('data/catalog/ltmd_u1_w2_declared_inventory.csv',encoding='utf-8')))
          assert len(scope)==64 and len({r['viewer_key'] for r in scope})==64
          assert len(declared)==64 and {r['viewer_key'] for r in scope}=={r['viewer_key'] for r in declared}
          assert sum(int(r['declared_positions']) for r in declared)==13656
          print('W2 static invariants OK: 64 viewers / 13,656 declared positions')
          PY
      - name: Ensure semantic boundary remains closed
        run: |
          ! grep -R -E 'classify_fragments_B02|SEMB03|semantic_ready.*1' \
            .github/workflows/build-ltmd-u1-w2-math-ocr.yml \
            .github/workflows/build-ltmd-u1-w2-math-pagestruct.yml \
            .github/workflows/build-ltmd-u1-w2-math-fragseg.yml

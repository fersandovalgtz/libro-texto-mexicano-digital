name: build-ltmd-u1-w6-geography-atlas-declared-inventory

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/build-ltmd-u1-w6-geography-atlas-declared-inventory.yml'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - run: python3 scripts/build_ltmd_u1_w6_geography_atlas_declared_inventory.py
      - name: Publish W6 declared inventory race-safely
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/w6-declared
          cp data/catalog/ltmd_u1_w6_declared_inventory.csv /tmp/w6-declared/
          cp data/catalog/ltmd_u1_w6_declared_inventory_summary.csv /tmp/w6-declared/
          cp data/catalog/ltmd_u1_w6_declared_inventory.md /tmp/w6-declared/
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          for attempt in 1 2 3; do
            git fetch origin main
            git reset --hard origin/main
            cp /tmp/w6-declared/* data/catalog/
            git add data/catalog/ltmd_u1_w6_declared_inventory.csv data/catalog/ltmd_u1_w6_declared_inventory_summary.csv data/catalog/ltmd_u1_w6_declared_inventory.md
            if git diff --cached --quiet; then exit 0; fi
            git commit -m 'Publish LTMD-U1 W6 Geography Atlas declared inventory'
            if git push origin HEAD:main; then exit 0; fi
            sleep $((attempt * 2))
          done
          exit 1

name: audit-ltmd-u1-w3-ag-clave-reuse

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/audit-ltmd-u1-w3-ag-clave-reuse.yml'
      - 'scripts/audit_ltmd_u1_w3_ag_clave_reuse.py'
      - 'data/catalog/ltmd_u1_w3_declared_inventory.csv'

permissions:
  contents: write

jobs:
  audit:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - run: python3 scripts/audit_ltmd_u1_w3_ag_clave_reuse.py
      - name: Publish W3 ag_clave reuse audit
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/w3-ag
          cp data/catalog/ltmd_u1_w3_ag_clave_reuse.csv /tmp/w3-ag/
          cp data/catalog/ltmd_u1_w3_ag_clave_reuse.md /tmp/w3-ag/
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          for attempt in 1 2 3; do
            git fetch origin main
            git reset --hard origin/main
            cp /tmp/w3-ag/* data/catalog/
            git add data/catalog/ltmd_u1_w3_ag_clave_reuse.csv data/catalog/ltmd_u1_w3_ag_clave_reuse.md
            if git diff --cached --quiet; then exit 0; fi
            git commit -m 'Publish LTMD-U1 W3 ag_clave reuse audit'
            if git push origin HEAD:main; then exit 0; fi
            sleep $((attempt * 2))
          done
          exit 1

name: build-ltmd-u1-w2-math-pagestruct

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/build-ltmd-u1-w2-math-pagestruct.yml'

permissions:
  actions: write
  contents: write

jobs:
  matrix:
    runs-on: ubuntu-24.04
    outputs:
      viewers: ${{ steps.make.outputs.viewers }}
    steps:
      - uses: actions/checkout@v7
      - id: make
        shell: bash
        run: |
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import csv,json
          rows=list(csv.DictReader(open('data/catalog/ltmd_u1_w2_math_ocr_summary.csv',encoding='utf-8')))
          assert len(rows)==57, len(rows)
          assert {r['ocr_version'] for r in rows}=={'LTMD_U1_W2_MATH_OCR_0.2'}
          assert all(int(r['unresolved'])==0 and int(r['sha_verified'])==int(r['pages']) for r in rows)
          print('viewers='+json.dumps([r['viewer_key'] for r in rows],separators=(',',':')))
          PY

  flags:
    needs: matrix
    strategy:
      fail-fast: false
      max-parallel: 8
      matrix:
        viewer_key: ${{ fromJSON(needs.matrix.outputs.viewers) }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - name: Install Spanish Tesseract
        run: |
          sudo apt-get update
          sudo apt-get install -y tesseract-ocr tesseract-ocr-spa
      - name: Extract structural flags for one canonical Mathematics viewer
        run: python3 scripts/extract_ltmd_u1_w2_math_structural_flags_book.py --viewer-key '${{ matrix.viewer_key }}'
      - uses: actions/upload-artifact@v4
        with:
          name: ltmd-u1-w2-math-structkw-${{ matrix.viewer_key }}
          path: data/work/ltmd_u1_w2_math_structkw/*.csv
          if-no-files-found: error
          retention-days: 1

  combine:
    needs: flags
    runs-on: ubuntu-24.04
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@v4
        with:
          pattern: ltmd-u1-w2-math-structkw-*
          path: data/work/ltmd_u1_w2_math_structkw
          merge-multiple: true
      - name: Combine exact 57-canonical structural flag layer
        run: python3 scripts/combine_ltmd_u1_w2_math_structural_flags_v02.py
      - name: Build PAGESTRUCT 0.2 layer with frozen rules
        run: python3 scripts/classify_ltmd_u1_w2_math_page_structure_v02.py
      - name: Publish PAGESTRUCT 0.2 race-safely
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/ltmd-u1-w2-math-pagestruct
          cp data/catalog/ltmd_u1_w2_math_structural_keyword_flags.csv /tmp/ltmd-u1-w2-math-pagestruct/
          cp data/catalog/ltmd_u1_w2_math_page_structure.csv /tmp/ltmd-u1-w2-math-pagestruct/
          cp data/catalog/ltmd_u1_w2_math_page_structure_summary.csv /tmp/ltmd-u1-w2-math-pagestruct/
          cp data/catalog/ltmd_u1_w2_math_page_structure.md /tmp/ltmd-u1-w2-math-pagestruct/
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          for attempt in 1 2 3; do
            git fetch origin main
            git reset --hard origin/main
            cp /tmp/ltmd-u1-w2-math-pagestruct/* data/catalog/
            git add data/catalog/ltmd_u1_w2_math_structural_keyword_flags.csv data/catalog/ltmd_u1_w2_math_page_structure.csv data/catalog/ltmd_u1_w2_math_page_structure_summary.csv data/catalog/ltmd_u1_w2_math_page_structure.md
            if git diff --cached --quiet; then break; fi
            git commit -m 'Publish LTMD-U1 W2 mathematics PAGESTRUCT 0.2 layer'
            if git push origin HEAD:main; then break; fi
            if [ "$attempt" -eq 3 ]; then exit 1; fi
            sleep $((attempt * 2))
          done
      - name: Dispatch W2 FRAGSEG explicitly
        run: gh workflow run build-ltmd-u1-w2-math-fragseg.yml --repo "$GITHUB_REPOSITORY"

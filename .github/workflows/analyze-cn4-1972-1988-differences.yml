name: analyze-cn4-1972-1988-differences

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/analyze-cn4-1972-1988-differences.yml'
      - 'scripts/analyze_cn4_1972_1988_differences.py'
      - 'data/expansion/cn46_page_manifest.csv'

permissions:
  contents: write

jobs:
  analyze:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Locate differing pages
        run: python3 scripts/analyze_cn4_1972_1988_differences.py
      - name: Publish difference map race-safely
        run: |
          set -euo pipefail
          cp data/expansion/cn4_1972_1988_page_differences.csv /tmp/cn4_1972_1988_page_differences.csv
          cp data/expansion/cn4_1972_1988_page_differences.md /tmp/cn4_1972_1988_page_differences.md
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          for attempt in 1 2 3; do
            git fetch origin main
            git reset --hard origin/main
            mkdir -p data/expansion
            cp /tmp/cn4_1972_1988_page_differences.csv data/expansion/
            cp /tmp/cn4_1972_1988_page_differences.md data/expansion/
            git add data/expansion/cn4_1972_1988_page_differences.csv data/expansion/cn4_1972_1988_page_differences.md
            if git diff --cached --quiet; then exit 0; fi
            git commit -m 'Publish CN4 1972-1988 page difference map'
            if git push origin HEAD:main; then exit 0; fi
            sleep $((attempt * 2))
          done
          exit 1

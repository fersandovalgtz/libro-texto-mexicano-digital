name: build-ltmd-u1-w2-declared-inventory

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/build-ltmd-u1-w2-declared-inventory.yml'
      - 'scripts/build_ltmd_u1_w2_declared_inventory.py'
      - 'data/catalog/ltmd_u1_w2_scope.csv'

permissions:
  contents: write

jobs:
  inventory:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Quantify declared W2 positions
        run: python3 scripts/build_ltmd_u1_w2_declared_inventory.py
      - name: Publish inventory race-safely
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/ltmd-u1-w2-inventory
          cp data/catalog/ltmd_u1_w2_declared_inventory.csv /tmp/ltmd-u1-w2-inventory/
          cp data/catalog/ltmd_u1_w2_declared_inventory_summary.csv /tmp/ltmd-u1-w2-inventory/
          cp data/catalog/ltmd_u1_w2_declared_inventory.md /tmp/ltmd-u1-w2-inventory/
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          for attempt in 1 2 3; do
            git fetch origin main
            git reset --hard origin/main
            cp /tmp/ltmd-u1-w2-inventory/* data/catalog/
            git add data/catalog/ltmd_u1_w2_declared_inventory.csv data/catalog/ltmd_u1_w2_declared_inventory_summary.csv data/catalog/ltmd_u1_w2_declared_inventory.md
            if git diff --cached --quiet; then exit 0; fi
            git commit -m 'Publish LTMD-U1 W2 mathematics declared inventory'
            if git push origin HEAD:main; then exit 0; fi
            sleep $((attempt * 2))
          done
          exit 1

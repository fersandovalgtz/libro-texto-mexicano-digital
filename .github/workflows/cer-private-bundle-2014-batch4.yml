name: Encrypted private bundle — 2014 CER batch 4
on:
  push:
    paths: ['.github/workflows/cer-private-bundle-2014-batch4.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  bundle:
    runs-on: ubuntu-24.04
    env:
      OMP_THREAD_LIMIT: '1'
    steps:
      - name: Install exact production OCR
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq tesseract-ocr tesseract-ocr-spa python3-pil
          tesseract --version | head -1 | tee version.txt
          grep -F 'tesseract 5.3.4' version.txt
      - name: Write one-use public certificate
        run: |
          cat > cert.pem <<'PEM'
          -----BEGIN CERTIFICATE-----
          MIIEgTCCAumgAwIBAgIUQcr2Mqdj5AyUxkCxu8ouNNwBvEAwDQYJKoZIhvcNAQEL
          BQAwUDEnMCUGA1UEAwweTFRNRCBDRVIgMjAxNCBiYXRjaDQgdHJhbnNwb3J0MSUw
          IwYDVQQKDBxMaWJybyBUZXh0byBNZXhpY2FubyBEaWdpdGFsMB4XDTI2MDgxNTE3
          MzE0MFoXDTI2MDgxNzE3MzE0MFowUDEnMCUGA1UEAwweTFRNRCBDRVIgMjAxNCBi
          YXRjaDQgdHJhbnNwb3J0MSUwIwYDVQQKDBxMaWJybyBUZXh0byBNZXhpY2FubyBE
          aWdpdGFsMIIBojANBgkqhkiG9w0BAQEFAAOCAY8AMIIBigKCAYEAufmlTfzwrkhp
          bIKA7p7UISMD18DpjwhITeAgmDl6sw/zh09/ksfEBSBQs0OM19jDItzyXJymVbw9
          w0Wz36E8cvar4nk0rA8bqeklazOqMbuQBQI6KMvs1EzRNAX/khIWmIZluw63yKKF
          Mk8RAPk3l3UcpEb6mdpUWuRduEt1ixyG1/rArzCxlsolAUTvzIDqef+JDVX/wMpj
          8x/d0bz80/jIqLFX1u38/fTbAZmtKqTzzvXrsh+1VO4fNbBULhU8tyF44cao0h69
          0SE+PiPHsi8Rzpag3zU0FTYqNrzy8zU2ztylfMcKqRWg/hijKgBqOyH0Z8CSBbpH
          jCj/3Ff1jJPS3wMibHQMvYNcJYPNW/VVruq1gk4mDie7vUXzDJ07p+yZa8CCLT1w
          +ezTdJ05htoJMoLmfuUpbBJLDZ1zCIk8e0Nd0cC/JZtFxH9vsfNf8+6dueMAJuw8
          y7nkz8+qc1j94o4NchHIgoMzOaVdYsYt/5H/ApWMSvnzh/H9bNI9AgMBAAGjUzBR
          MB0GA1UdDgQWBBQvMcOZYEPz3cS4b0tnh3uon9O9PDAfBgNVHSMEGDAWgBQvMcOZ
          YEPz3cS4b0tnh3uon9O9PDAPBgNVHRMBAf8EBTADAQH/MA0GCSqGSIb3DQEBCwUA
          A4IBgQB5V8Tuu2MMOZO7zde2cBaR2LZCre+T7SdipVRKEurtl6jN4JU5R971Zz5E
          HUJ9NXvqEoa4gh1lNfx45mSEfg+3s2Nt+/qfCbqJBAa6tPnN7AX30Q9JJzcevGhq
          986R3PpNcGfY18wKU+qpcoc/Cs6endtV1smofyi58YJYDTnSoVqV1zfIuFYnXMIg
          QBwOB6+MqY0H4FqAu0Tip3Jc0lAjnWZLKOAKIdsNrmdew1ZbEeoH8E3hLpnKL6Vc
          JTFNbIhEmovySWIMmiNxzpZXrShItRt31PCeY05IFT1y425zILb5goSPBI3YBHiO
          F73V33Fk3wL+NvznudKE7rk4d4J39LPAg+IZyrKEriSQ/6BRl4iJjP7Yqqecdn0F
          5J68cCVrTIxppW12FnWGX4n+ez9o7ghqnv/WaX+Ly6sQUt3t/Ek9+7W/tm+sjdxo
          OBSI5TrPAmwuW/cy1Mh761HNWqmi2f5uWZZi6yDVFSds/cRHjzwwqwfNST5kwq/d
          JFm+WwA=
          -----END CERTIFICATE-----
          PEM
      - name: Acquire source pages and full-page production OCR
        run: |
          set -euo pipefail
          mkdir -p private_bundle
          for n in 118 134 154; do curl -fsSL --retry 3 --connect-timeout 15 --max-time 90 "https://historico.conaliteg.gob.mx/c/H2014P5CNA/${n}.jpg" -o "private_bundle/${n}.jpg"; done
          python3 - <<'PY'
          from PIL import Image
          for n in ('118','134','154'):
              with Image.open(f'private_bundle/{n}.jpg') as im: assert im.size == (969,1276), (n,im.size)
          PY
          tesseract private_bundle/118.jpg private_bundle/118 -l spa --psm 6 txt tsv >/dev/null 2>private_bundle/118.stderr
          tesseract private_bundle/134.jpg private_bundle/134 -l spa --psm 3 txt tsv >/dev/null 2>private_bundle/134.stderr
          tesseract private_bundle/154.jpg private_bundle/154 -l spa --psm 3 txt tsv >/dev/null 2>private_bundle/154.stderr
      - name: Write manifests
        run: |
          python3 - <<'PY'
          import hashlib,json
          from pathlib import Path
          pages=[('LTMD-CER-2014-Q3_3','118','LTMD-CN5-G2014-VP118',6),('LTMD-CER-2014-Q4_1','134','LTMD-CN5-G2014-VP134',3),('LTMD-CER-2014-Q4_2','154','LTMD-CN5-G2014-VP154',3)]
          ver=Path('version.txt').read_text().strip(); pub=[]
          for sid,n,pid,psm in pages:
              b=Path(f'private_bundle/{n}.jpg').read_bytes(); pub.append({'sample_id':sid,'page_id':pid,'viewer_page':int(n),'selected_psm':psm,'tesseract_version':ver,'source_sha256':hashlib.sha256(b).hexdigest(),'source_bytes':len(b)})
          Path('manifest.json').write_text(json.dumps({'transport':'encrypted private source+OCR bundle','certificate_fingerprint_sha256':'A8:6F:51:A1:65:78:21:F1:8A:30:7F:C2:A2:F7:EF:26:9B:03:65:42:57:C7:09:D6:46:5F:3F:21:27:62:45:B1','pages':pub},indent=2),encoding='utf-8')
          PY
      - name: Encrypt and erase plaintext
        run: |
          tar -czf private_bundle.tar.gz private_bundle/
          openssl cms -encrypt -binary -aes256 -in private_bundle.tar.gz -outform DER -out payload.p7m cert.pem
          sha256sum payload.p7m > ciphertext.sha256
          rm -rf private_bundle private_bundle.tar.gz cert.pem version.txt
      - name: Upload ciphertext and manifest only
        uses: actions/upload-artifact@v4
        with:
          name: ltmd-cer-2014-batch4-private-bundle-encrypted
          path: |
            payload.p7m
            manifest.json
            ciphertext.sha256
          retention-days: 1

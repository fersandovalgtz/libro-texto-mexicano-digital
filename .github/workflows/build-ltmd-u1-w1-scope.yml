name: build-ltmd-u1-w1-scope

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/build-ltmd-u1-w1-scope.yml'
      - 'scripts/build_ltmd_u1_w1_scope.py'
      - 'data/catalog/ltmd_u1_wave_queue.csv'

permissions:
  contents: write

jobs:
  scope:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Freeze W1 scope
        run: python3 scripts/build_ltmd_u1_w1_scope.py
      - name: Publish scope race-safely
        shell: bash
        run: |
          set -euo pipefail
          cp data/catalog/ltmd_u1_w1_scope.csv /tmp/ltmd_u1_w1_scope.csv
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          for attempt in 1 2 3; do
            git fetch origin main
            git reset --hard origin/main
            cp /tmp/ltmd_u1_w1_scope.csv data/catalog/ltmd_u1_w1_scope.csv
            git add data/catalog/ltmd_u1_w1_scope.csv
            if git diff --cached --quiet; then exit 0; fi
            git commit -m 'Publish frozen LTMD-U1 W1 execution scope'
            if git push origin HEAD:main; then exit 0; fi
            sleep $((attempt * 2))
          done
          exit 1

name: LTMD U2 source-admission pilot

on:
  push:
    branches: [science/u2-source-admission-pilot]
    paths:
      - 'scripts/probe_u2_source_admission.py'
      - 'scripts/probe_u2_source_admission_batch.py'
      - '.github/workflows/u2-source-admission-pilot.yml'

permissions:
  contents: read

jobs:
  full-universe:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Stream and admit all 39 canonical U2 source bodies
        run: >-
          python scripts/probe_u2_source_admission_batch.py
          --observed-at 2026-09-02
          --timeout 120
          --delay 0.25
          --output-csv u2-source-admission-all-39.csv
          --output-json u2-source-admission-all-39.json
      - name: Publish bounded summary
        if: always()
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p = Path('u2-source-admission-all-39.json')
          if not p.exists():
              print('batch JSON not produced')
          else:
              d = json.loads(p.read_text(encoding='utf-8'))
              for key in ['total_objects','states','admitted_sources','total_source_bytes_streamed','method','source_pdf_bytes_persisted','ocr_available_state','text_verified_state']:
                  print(f'{key}={d.get(key)}')
          PY
      - name: Upload non-substitutive 39-object evidence only
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ltmd-u2-source-admission-all-39-${{ github.sha }}
          path: |
            u2-source-admission-all-39.csv
            u2-source-admission-all-39.json
          retention-days: 7

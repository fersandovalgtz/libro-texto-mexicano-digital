name: LTMD U2 source-admission pilot

on:
  push:
    branches: [science/u2-source-admission-pilot]
    paths:
      - 'scripts/probe_u2_source_admission.py'
      - '.github/workflows/u2-source-admission-pilot.yml'

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - key: P5LPM
            expected_bytes: 4869215
            expected_pages: 99
          - key: P4PEA
            expected_bytes: 33554451
            expected_pages: 363
          - key: P0CMA
            expected_bytes: 281144511
            expected_pages: 191
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install parser
        run: python -m pip install --disable-pip-version-check 'pypdf==6.16.2'
      - name: Probe full-body source admission without persistence
        run: >-
          python scripts/probe_u2_source_admission.py
          --viewer-key '${{ matrix.key }}'
          --expected-bytes '${{ matrix.expected_bytes }}'
          --expected-pages '${{ matrix.expected_pages }}'
          --observed-at 2026-09-02
          --output 'u2-source-admission-${{ matrix.key }}.json'
      - name: Upload non-substitutive evidence only
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ltmd-u2-source-admission-${{ matrix.key }}-${{ github.sha }}
          path: u2-source-admission-${{ matrix.key }}.json
          retention-days: 7

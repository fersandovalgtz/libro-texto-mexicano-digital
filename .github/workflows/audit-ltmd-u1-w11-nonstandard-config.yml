name: audit-ltmd-u1-w11-nonstandard-config

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/audit-ltmd-u1-w11-nonstandard-config.yml'
      - 'scripts/audit_ltmd_u1_w11_nonstandard_config.py'
      - 'data/catalog/ltmd_u1_w11_technical_routing.csv'
  workflow_run:
    workflows: ['build-ltmd-u1-w11-technical-routing']
    types: [completed]

permissions:
  contents: write

concurrency:
  group: audit-ltmd-u1-w11-nonstandard-config
  cancel-in-progress: false

jobs:
  audit:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Check official claves.json entries for nonstandard W11 viewers
        run: python3 scripts/audit_ltmd_u1_w11_nonstandard_config.py
      - name: Publish W11 nonstandard config audit race-safely
        shell: bash
        run: |
          set -euo pipefail
          cp data/catalog/ltmd_u1_w11_nonstandard_config.csv /tmp/ltmd_u1_w11_nonstandard_config.csv
          cp docs/LTMD_U1_W11_NONSTANDARD_CONFIG.md /tmp/LTMD_U1_W11_NONSTANDARD_CONFIG.md
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          for attempt in 1 2 3; do
            git fetch origin main
            git reset --hard origin/main
            cp /tmp/ltmd_u1_w11_nonstandard_config.csv data/catalog/
            cp /tmp/LTMD_U1_W11_NONSTANDARD_CONFIG.md docs/
            git add data/catalog/ltmd_u1_w11_nonstandard_config.csv docs/LTMD_U1_W11_NONSTANDARD_CONFIG.md
            if git diff --cached --quiet; then exit 0; fi
            git commit -m 'data(w11): publish nonstandard official-config audit'
            if git push origin HEAD:main; then exit 0; fi
            sleep $((attempt*2))
          done
          exit 1

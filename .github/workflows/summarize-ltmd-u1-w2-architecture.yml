name: summarize-ltmd-u1-w2-architecture

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/summarize-ltmd-u1-w2-architecture.yml'
      - 'scripts/summarize_ltmd_u1_w2_architecture.py'
      - 'data/catalog/ltmd_u1_w2_viewer_architecture.json'

permissions:
  contents: write

jobs:
  summarize:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Summarize all W2 viewer probes
        run: python3 scripts/summarize_ltmd_u1_w2_architecture.py
      - name: Publish summary race-safely
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/ltmd-u1-w2-arch
          cp data/catalog/ltmd_u1_w2_viewer_architecture_summary.csv /tmp/ltmd-u1-w2-arch/
          cp data/catalog/ltmd_u1_w2_viewer_architecture.md /tmp/ltmd-u1-w2-arch/
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          for attempt in 1 2 3; do
            git fetch origin main
            git reset --hard origin/main
            cp /tmp/ltmd-u1-w2-arch/* data/catalog/
            git add data/catalog/ltmd_u1_w2_viewer_architecture_summary.csv data/catalog/ltmd_u1_w2_viewer_architecture.md
            if git diff --cached --quiet; then exit 0; fi
            git commit -m 'Publish LTMD-U1 W2 mathematics architecture summary'
            if git push origin HEAD:main; then exit 0; fi
            sleep $((attempt * 2))
          done
          exit 1

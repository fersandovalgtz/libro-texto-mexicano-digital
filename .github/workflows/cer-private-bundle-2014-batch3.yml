          U61IB0W3WMjVP/PaKs3R26aB8HmyDqhYON5nguNI8iCtySyj3cMIXiD0xPdKBDgH
          hfVNy1r6oPx8Ra/xdXRUaeI6SkI7eRrgWAF8F81R9oqFDNWXI7dSWrqyyobU2h00
          mAi7Pf3hHRBf12gJEhkKxpVVMCmHmK4J2eR0UPpt7bWEUgjFOwuTs7UTcdRFLO3x
          KLXfpDs=
          -----END CERTIFICATE-----
          PEM
      - name: Acquire source pages and full-page production OCR
        run: |
          set -euo pipefail
          mkdir -p private_bundle
          for n in 078 094 109; do curl -fsSL --retry 3 --connect-timeout 15 --max-time 90 "https://historico.conaliteg.gob.mx/c/H2014P5CNA/${n}.jpg" -o "private_bundle/${n}.jpg"; done
          python3 - <<'PY'
          from PIL import Image
          for n in ('078','094','109'):
              with Image.open(f'private_bundle/{n}.jpg') as im: assert im.size == (969,1276), (n,im.size)
          PY
          tesseract private_bundle/078.jpg private_bundle/078 -l spa --psm 6 txt tsv >/dev/null 2>private_bundle/078.stderr
          tesseract private_bundle/094.jpg private_bundle/094 -l spa --psm 6 txt tsv >/dev/null 2>private_bundle/094.stderr
          tesseract private_bundle/109.jpg private_bundle/109 -l spa --psm 3 txt tsv >/dev/null 2>private_bundle/109.stderr
      - name: Write manifests
        run: |
          python3 - <<'PY'
          import hashlib,json
          from pathlib import Path
          pages=[('LTMD-CER-2014-Q2_3','078','LTMD-CN5-G2014-VP078',6),('LTMD-CER-2014-Q3_1','094','LTMD-CN5-G2014-VP094',6),('LTMD-CER-2014-Q3_2','109','LTMD-CN5-G2014-VP109',3)]
          ver=Path('version.txt').read_text().strip(); pub=[]
          for sid,n,pid,psm in pages:
              b=Path(f'private_bundle/{n}.jpg').read_bytes(); pub.append({'sample_id':sid,'page_id':pid,'viewer_page':int(n),'selected_psm':psm,'tesseract_version':ver,'source_sha256':hashlib.sha256(b).hexdigest(),'source_bytes':len(b)})
          Path('manifest.json').write_text(json.dumps({'transport':'encrypted private source+OCR bundle','certificate_fingerprint_sha256':'6E:BC:60:6A:23:3A:7D:29:72:92:4E:8B:77:A8:C9:4E:90:A6:0C:E7:F8:1A:A0:C9:1A:03:40:08:1D:2B:AA:F6','pages':pub},indent=2),encoding='utf-8')
          PY
      - name: Encrypt and erase plaintext
        run: |
          tar -czf private_bundle.tar.gz private_bundle/
          openssl cms -encrypt -binary -aes256 -in private_bundle.tar.gz -outform DER -out payload.p7m cert.pem
          sha256sum payload.p7m > ciphertext.sha256
          rm -rf private_bundle private_bundle.tar.gz cert.pem version.txt
      - name: Upload ciphertext and manifest only
        uses: actions/upload-artifact@v4
        with:
          name: ltmd-cer-2014-batch3-private-bundle-encrypted
          path: |
            payload.p7m
            manifest.json
            ciphertext.sha256
          retention-days: 1

name: Encrypted private bundle — 2014 CER batch 3
on:
  push:
    paths: ['.github/workflows/cer-private-bundle-2014-batch3.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  bundle:
    runs-on: ubuntu-24.04
    env:
      OMP_THREAD_LIMIT: '1'
    steps:
      - name: Install exact production OCR
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq tesseract-ocr tesseract-ocr-spa python3-pil
          tesseract --version | head -1 | tee version.txt
          grep -F 'tesseract 5.3.4' version.txt
      - name: Write one-use public certificate
        run: |
          cat > cert.pem <<'PEM'
          -----BEGIN CERTIFICATE-----
          MIIEgTCCAumgAwIBAgIUFISenTQJuIzqYeltB8ZkXiuwvVMwDQYJKoZIhvcNAQEL
          BQAwUDEnMCUGA1UEAwweTFRNRCBDRVIgMjAxNCBiYXRjaDMgdHJhbnNwb3J0MSUw
          IwYDVQQKDBxMaWJybyBUZXh0byBNZXhpY2FubyBEaWdpdGFsMB4XDTI2MDgxNTE3
          MjcyN1oXDTI2MDgxNzE3MjcyN1owUDEnMCUGA1UEAwweTFRNRCBDRVIgMjAxNCBi
          YXRjaDMgdHJhbnNwb3J0MSUwIwYDVQQKDBxMaWJybyBUZXh0byBNZXhpY2FubyBE
          aWdpdGFsMIIBojANBgkqhkiG9w0BAQEFAAOCAY8AMIIBigKCAYEAwgmeUVN9PbdQ
          5I1RnHeb/NaGp8nRPG5Ycvm/yNUXsokzwI1JfI/KSXvcaldqp/IIoVnG59Pr2oIU
          lx7QTn90jVDcq9p7BVu+eSxHotu44iq4UKrEQBI5vHBKS8eDLzKo3jBB/8YqBXRf
          fs6PT+2C7kMZZsUkBLV6RIjproG3/0Oi03RiOWzCLJcrc+t+WcrevajjTViQS+Hh
          4UsHwdeFOvoJrK7iHLOvdYRIXz0YGmAG58QNMiVq2njRAeqwCbEYrXxuagGHEUef
          RvadTxzrbQAw38PVHmumsJCT99XC3V/emlkgLwvs2W2fdJZ9K4TEShvrRNt62xEV
          ezmHJ/BuDKt8QNrFCNMvnfCGFigGzuc3GwLEIvZKMYzjJaBiZ66X9kH0vaEuhmRD
          xaHpL4tm/UwsNmux+K07nPGw54vIhvvkWbWrs/jWA/tI8p/BUMOUpzOamr5Xl4Bq
          MwJlAhO+zAC4Iva1ltU08T4EiXQtGyJMcRuwlTitE+4jX1sLJCTjAgMBAAGjUzBR
          MB0GA1UdDgQWBBRtt6wKJBOxvGXEvMviNMZ7qj/vqDAfBgNVHSMEGDAWgBRtt6wK
          JBOxvGXEvMviNMZ7qj/vqDAPBgNVHRMBAf8EBTADAQH/MA0GCSqGSIb3DQEBCwUA
          A4IBgQBt/0Kc0DbyPqMuNXmn/ohkxNOl7eNCPMGoYIo0pW5Eonz2EyiWl5E5em2q
          4FV49AiocsKLksNw/8GRjiWA6aOtDACnnAtek4lkH7FzKg8gZv9zmwM8uqjUU3eS

name: Full-page TSV — 1972 CER batch 3

on:
  push:
    paths:
      - '.github/workflows/cer-fullpage-tsv-1972-batch3.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  extract:
    runs-on: ubuntu-24.04
    env:
      OMP_THREAD_LIMIT: '1'
    steps:
      - name: Install exact production OCR
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq tesseract-ocr tesseract-ocr-spa python3-pil
          tesseract --version | head -1 | tee tesseract-version.txt
          grep -F 'tesseract 5.3.4' tesseract-version.txt

      - name: Write transient public transport certificate
        shell: bash
        run: |
          cat > cert.pem <<'PEM'

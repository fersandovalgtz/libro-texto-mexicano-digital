          hI9tQU1bWA==
          -----END CERTIFICATE-----
          PEM

      - name: Full-page OCR and TSV
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p private_work
          curl -fsSL --retry 3 --connect-timeout 15 --max-time 90 'https://historico.conaliteg.gob.mx/c/H1972P5CI084/124.jpg' -o private_work/q2_3.jpg
          curl -fsSL --retry 3 --connect-timeout 15 --max-time 90 'https://historico.conaliteg.gob.mx/c/H1972P5CI084/150.jpg' -o private_work/q3_1.jpg
          curl -fsSL --retry 3 --connect-timeout 15 --max-time 90 'https://historico.conaliteg.gob.mx/c/H1972P5CI084/174.jpg' -o private_work/q3_2.jpg
          python3 - <<'PY'
          from PIL import Image
          for n in ('q2_3','q3_1','q3_2'):
              with Image.open(f'private_work/{n}.jpg') as im:
                  assert im.size==(670,993), (n, im.size)
          PY
          for n in q2_3 q3_1 q3_2; do
            tesseract "private_work/${n}.jpg" "private_work/${n}" -l spa --psm 3 txt tsv >/dev/null 2>"private_work/${n}.stderr"
          done

      - name: Package, encrypt and destroy private OCR
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib,json
          from pathlib import Path
          specs=[
            ('LTMD-CER-1972-Q2_3','q2_3','LTMD-CN5-G1972-VP124',[48,34,628,470]),
            ('LTMD-CER-1972-Q3_1','q3_1','LTMD-CN5-G1972-VP150',[55,700,625,965]),
            ('LTMD-CER-1972-Q3_2','q3_2','LTMD-CN5-G1972-VP174',[50,365,630,650]),
          ]
          ver=Path('tesseract-version.txt').read_text().strip()
          private=[]; public=[]
          for sid,n,pid,crop in specs:
              src=Path(f'private_work/{n}.jpg').read_bytes()
              sha=hashlib.sha256(src).hexdigest()
              txt=Path(f'private_work/{n}.txt').read_text(encoding='utf-8')
              tsv=Path(f'private_work/{n}.tsv').read_text(encoding='utf-8')
              private.append({'sample_id':sid,'page_id':pid,'crop_px':crop,'selected_psm':3,'tesseract_version':ver,'source_sha256':sha,'full_page_text_private':txt,'full_page_tsv_private':tsv})
              public.append({'sample_id':sid,'page_id':pid,'crop_px':crop,'selected_psm':3,'tesseract_version':ver,'source_sha256':sha,'full_page_text_chars':len(txt),'tsv_chars':len(tsv)})
          Path('private.json').write_text(json.dumps(private,ensure_ascii=False),encoding='utf-8')
          Path('manifest.json').write_text(json.dumps({'alignment_rule':'full-page OCR + TSV word-center selection in preregistered rectangle','samples':public},ensure_ascii=False,indent=2),encoding='utf-8')
          PY
          openssl cms -encrypt -binary -aes256 -in private.json -outform DER -out payload.p7m cert.pem
          sha256sum payload.p7m > ciphertext.sha256
          rm -rf private_work private.json cert.pem tesseract-version.txt

      - name: Upload ciphertext and non-text manifest only
        uses: actions/upload-artifact@v7
        with:
          name: ltmd-cer-1972-batch3-fullpage-tsv-encrypted
          path: |
            payload.p7m
            manifest.json
            ciphertext.sha256
          retention-days: 1
          if-no-files-found: error

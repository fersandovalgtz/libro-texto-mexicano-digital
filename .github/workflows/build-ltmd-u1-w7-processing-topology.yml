name: build-ltmd-u1-w7-processing-topology

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/build-ltmd-u1-w7-processing-topology.yml'
      - 'scripts/build_ltmd_u1_w7_processing_topology.py'
      - 'data/catalog/ltmd_u1_w7_source_admissibility.csv'
      - 'data/catalog/ltmd_u1_w7_exact_asset_relationships.csv'
      - 'data/catalog/ltmd_u1_w7_civics_ethics_asset_manifest.csv'

permissions:
  contents: write

concurrency:
  group: build-ltmd-u1-w7-processing-topology
  cancel-in-progress: false

jobs:
  topology:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Build W7 reconciled processing topology
        run: python3 scripts/build_ltmd_u1_w7_processing_topology.py
      - name: Publish W7 processing topology race-safely
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/ltmd-u1-w7-topology
          mkdir -p /tmp/ltmd-u1-w7-topology
          cp data/catalog/ltmd_u1_w7_processing_inventory.csv /tmp/ltmd-u1-w7-topology/
          cp data/catalog/ltmd_u1_w7_canonical_page_manifest.csv /tmp/ltmd-u1-w7-topology/
          cp data/catalog/ltmd_u1_w7_processing_topology.md /tmp/ltmd-u1-w7-topology/
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          for attempt in 1 2 3; do
            git fetch origin main
            git reset --hard origin/main
            cp /tmp/ltmd-u1-w7-topology/* data/catalog/
            git add data/catalog/ltmd_u1_w7_processing_inventory.csv data/catalog/ltmd_u1_w7_canonical_page_manifest.csv data/catalog/ltmd_u1_w7_processing_topology.md
            if git diff --cached --quiet; then exit 0; fi
            git commit -m 'Publish LTMD-U1 W7 processing topology'
            if git push origin HEAD:main; then exit 0; fi
            sleep $((attempt * 2))
          done
          exit 1

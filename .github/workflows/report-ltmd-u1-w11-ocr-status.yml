name: report-ltmd-u1-w11-ocr-status

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/report-ltmd-u1-w11-ocr-status.yml'
      - 'scripts/report_ltmd_u1_w11_ocr_action_status.py'
  workflow_run:
    workflows: ['build-ltmd-u1-w11-ocr']
    types: [completed]

permissions:
  actions: read
  contents: write

concurrency:
  group: report-ltmd-u1-w11-ocr-status
  cancel-in-progress: true

jobs:
  report:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Refresh authoritative main
        run: |
          git fetch origin main
          git reset --hard origin/main
      - name: Observe W11 OCR workflow metadata
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 scripts/report_ltmd_u1_w11_ocr_action_status.py
      - name: Publish operational report race-safely
        shell: bash
        run: |
          set -euo pipefail
          cp docs/LTMD_U1_W11_OCR_RUN_STATUS.md /tmp/LTMD_U1_W11_OCR_RUN_STATUS.md
          cp data/catalog/ltmd_u1_w11_ocr_run_status.json /tmp/ltmd_u1_w11_ocr_run_status.json
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          for attempt in 1 2 3; do
            git fetch origin main
            git reset --hard origin/main
            cp /tmp/LTMD_U1_W11_OCR_RUN_STATUS.md docs/
            cp /tmp/ltmd_u1_w11_ocr_run_status.json data/catalog/
            git add docs/LTMD_U1_W11_OCR_RUN_STATUS.md data/catalog/ltmd_u1_w11_ocr_run_status.json
            if git diff --cached --quiet; then exit 0; fi
            git commit -m 'ops(w11): publish OCR Actions status'
            if git push origin HEAD:main; then exit 0; fi
            sleep $((attempt*2))
          done
          exit 1

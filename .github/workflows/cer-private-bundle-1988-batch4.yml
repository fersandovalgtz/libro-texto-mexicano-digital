name: Encrypted private bundle — 1988 CER batch 4

on:
  push:
    paths: ['.github/workflows/cer-private-bundle-1988-batch4.yml']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  bundle:
    runs-on: ubuntu-24.04
    env:
      OMP_THREAD_LIMIT: '1'
    steps:
      - name: Install exact production OCR
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq tesseract-ocr tesseract-ocr-spa python3-pil
          tesseract --version | head -1 | tee version.txt
          grep -F 'tesseract 5.3.4' version.txt

      - name: Write one-use public certificate
        run: |
          cat > cert.pem <<'PEM'
          -----BEGIN CERTIFICATE-----
          MIIEgTCCAumgAwIBAgIUSf97TabQmxbgLclNu25A2kiy4wkwDQYJKoZIhvcNAQEL
          BQAwUDEnMCUGA1UEAwweTFRNRCBDRVIgMTk4OCBiYXRjaDQgdHJhbnNwb3J0MSUw
          IwYDVQQKDBxMaWJybyBUZXh0byBNZXhpY2FubyBEaWdpdGFsMB4XDTI2MDgxNTE2
          MjczNFoXDTI2MDgxNzE2MjczNFowUDEnMCUGA1UEAwweTFRNRCBDRVIgMTk4OCBi
          YXRjaDQgdHJhbnNwb3J0MSUwIwYDVQQKDBxMaWJybyBUZXh0byBNZXhpY2FubyBE
          aWdpdGFsMIIBojANBgkqhkiG9w0BAQEFAAOCAY8AMIIBigKCAYEAuQGOA3tm884B
          ROb25eGSrcZV99baqjBf9a7mrim0DN2xPAn6F7P4WUOFqVJs6OFEM9btm4bTyTKC
          MVpe9qluF/W0cnd3C/aJ7ZOF5h4vFPtn3XOChcA+NfpBNPw4AhXCmloAlR5Ogt7b
          AY1mTtip3sKnMt/1dmVCzgmqOWyt4uuq+ce8gIvTSaodUEaMVenTYED7bkB7hvgf
          2gD6dWpKaQDPB8Il7gRO+GUgTVu5hKRHKXW5Mwzk7uYB2oD5nZ0t0EHAgI3ZpjFU
          tLtX4HOPO8mmJI+drBcFAYuBJC1MXPVJyNQea9BaLqT8EAraPsq8ivNOEst5Fe/v
          pQadDAQ0cz28SaV/1rOspAQGAarufo77140iX4eS5m5iAwqzd2beGGgzRSdJyKQ9
          mORPsfeySQxiAIpvZzpht3AjDvsiwlpiWVmyK0cu+IYkqewpJ07RbyG+pPP1rgy2
          FpWAVUvA4MW8U6vMPv3lJ/NRvYQUzyKNsQnrkLAUBJCgtw7t3PhtAgMBAAGjUzBR
          MB0GA1UdDgQWBBRbxubh5l/wVKU19WLp/gs9x96CVjAfBgNVHSMEGDAWgBRbxubh
          5l/wVKU19WLp/gs9x96CVjAPBgNVHRMBAf8EBTADAQH/MA0GCSqGSIb3DQEBCwUA
          A4IBgQCXGXSh+nRJJ979JvSm/ro04zR0wTmXYyWQOtkFkg1jBO+gaks9MGyTqxHD
          BvNlw22uD/Cum6xvTzCnqBFom0807tCX6Elk4/p5h6JdUl1ANnFeFstaWoGC2dl1
          OKv0ezFWUuJPp1MXuW5scwwwYtUQNeX+YV3O9c+rvHfwjSapbvXjf6RCTwZx+eA6
          9gfRwNVIWdtHzUHXPHgHA3whx3BtiK1VUNSW0/MUbp4lI/z825dQ1zJR2P4e6vZK
          sD6sR0xzylY1LnruT0iIpjw+Pu+IDoC3CEcjJJFBCH9zXhOjkMwJMlKCQiAthDct
          P7Xj9BgcL0ir7FqOM1HgduR9BS2cvyaGvEM5MpSb92jie3eysDQS3jVrA11EVbir
          U3K0Ay4DZ/14tVeVHN+UskLooVimkv9ztX8jLfnsHq3ipOIh3BjAys7L4ABs93ie
          gcamnVoECYcH02WV9wxW/a/yde3jgurbqZCDodX2/+jL4acS22lhpJO3/ect16Wg
          zRwml28=
          -----END CERTIFICATE-----
          PEM
          openssl x509 -in cert.pem -noout -fingerprint -sha256

      - name: Acquire source pages and full-page production OCR
        run: |
          set -euo pipefail
          mkdir -p private_bundle
          for n in 119 135 155; do
            curl -fsSL --retry 3 --connect-timeout 15 --max-time 90 "https://historico.conaliteg.gob.mx/c/H1988P5CI123/${n}.jpg" -o "private_bundle/${n}.jpg"
          done
          python3 - <<'PY'
          from PIL import Image
          for n in ('119','135','155'):
              with Image.open(f'private_bundle/{n}.jpg') as im:
                  assert im.size == (670,993), (n, im.size)
          PY
          for n in 119 135 155; do
            tesseract "private_bundle/${n}.jpg" "private_bundle/${n}" -l spa --psm 3 txt tsv >/dev/null 2>"private_bundle/${n}.stderr"
          done

      - name: Write manifests
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib,json
          from pathlib import Path
          pages=[('LTMD-CER-1988-Q3_3','119','LTMD-CN5-G1988-VP119'),('LTMD-CER-1988-Q4_1','135','LTMD-CN5-G1988-VP135'),('LTMD-CER-1988-Q4_2','155','LTMD-CN5-G1988-VP155')]
          ver=Path('version.txt').read_text().strip(); pub=[]
          for sid,n,pid in pages:
              b=Path(f'private_bundle/{n}.jpg').read_bytes()
              pub.append({'sample_id':sid,'page_id':pid,'viewer_page':int(n),'selected_psm':3,'tesseract_version':ver,'source_sha256':hashlib.sha256(b).hexdigest(),'source_bytes':len(b),'full_page_text_chars':len(Path(f'private_bundle/{n}.txt').read_text(encoding='utf-8')),'tsv_chars':len(Path(f'private_bundle/{n}.tsv').read_text(encoding='utf-8'))})
          Path('private_bundle/private_manifest.json').write_text(json.dumps({'pages':pub},ensure_ascii=False,indent=2),encoding='utf-8')
          Path('manifest.json').write_text(json.dumps({'transport':'encrypted tar bundle containing private source JPEG + production full-page TXT/TSV','certificate_fingerprint_sha256':'C4:40:03:97:DB:48:B3:C0:FF:6A:6B:8D:30:DD:2B:CE:81:9E:F5:69:E7:3B:6D:C5:2E:89:B6:80:29:38:8A:B5','pages':pub},ensure_ascii=False,indent=2),encoding='utf-8')
          PY

      - name: Encrypt and erase plaintext
        run: |
          set -euo pipefail
          tar -czf private_bundle.tar.gz private_bundle/
          openssl cms -encrypt -binary -aes256 -in private_bundle.tar.gz -outform DER -out payload.p7m cert.pem
          sha256sum payload.p7m > ciphertext.sha256
          rm -rf private_bundle private_bundle.tar.gz cert.pem version.txt
          test ! -d private_bundle

      - name: Upload ciphertext and manifest only
        uses: actions/upload-artifact@v4
        with:
          name: ltmd-cer-1988-batch4-private-bundle-encrypted
          path: |
            payload.p7m
            manifest.json
            ciphertext.sha256
          retention-days: 1
          if-no-files-found: error

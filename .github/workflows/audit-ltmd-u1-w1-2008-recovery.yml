name: audit-ltmd-u1-w1-2008-recovery

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/audit-ltmd-u1-w1-2008-recovery.yml'
      - 'scripts/audit_ltmd_u1_w1_2008_recovery_candidates.py'
      - 'data/catalog/ciencias_naturales_pending_page_manifest.csv'
      - 'data/catalog/ltmd_u1_coverage.csv'

permissions:
  contents: write

jobs:
  audit:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Audit recovery candidates under strict SHA alignment
        run: python3 scripts/audit_ltmd_u1_w1_2008_recovery_candidates.py
      - name: Publish audit race-safely
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/ltmd-u1-w1-2008-recovery
          cp data/catalog/ltmd_u1_w1_2008_recovery_audit.csv /tmp/ltmd-u1-w1-2008-recovery/
          cp data/catalog/ltmd_u1_w1_2008_recovered_positions.csv /tmp/ltmd-u1-w1-2008-recovery/
          cp data/catalog/ltmd_u1_w1_2008_recovery_audit.md /tmp/ltmd-u1-w1-2008-recovery/
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          for attempt in 1 2 3; do
            git fetch origin main
            git reset --hard origin/main
            cp /tmp/ltmd-u1-w1-2008-recovery/* data/catalog/
            git add data/catalog/ltmd_u1_w1_2008_recovery_audit.csv data/catalog/ltmd_u1_w1_2008_recovered_positions.csv data/catalog/ltmd_u1_w1_2008_recovery_audit.md
            if git diff --cached --quiet; then exit 0; fi
            git commit -m 'Publish LTMD-U1 W1 2008 recovery audit'
            if git push origin HEAD:main; then exit 0; fi
            sleep $((attempt * 2))
          done
          exit 1

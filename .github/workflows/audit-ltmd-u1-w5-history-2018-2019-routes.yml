name: audit-ltmd-u1-w5-history-2018-2019-routes

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/audit-ltmd-u1-w5-history-2018-2019-routes.yml'
      - 'scripts/audit_ltmd_u1_w5_history_2018_2019_routes.py'
      - 'data/catalog/ltmd_u1_w5_history_asset_manifest.csv'
      - 'data/catalog/ltmd_u1_w5_history_source_readiness.csv'

permissions:
  contents: write

jobs:
  audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Verify W5 source evidence exists
        run: |
          test -f data/catalog/ltmd_u1_w5_history_asset_manifest.csv
          test -f data/catalog/ltmd_u1_w5_history_source_readiness.csv
      - name: Audit W5 History 2018 routes against paired 2019 sources
        run: python3 scripts/audit_ltmd_u1_w5_history_2018_2019_routes.py
      - name: Publish W5 route identity evidence race-safely
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/ltmd-u1-w5-route
          cp data/catalog/ltmd_u1_w5_history_2018_2019_route_identity.csv /tmp/ltmd-u1-w5-route/
          cp data/catalog/ltmd_u1_w5_history_2018_2019_route_relationships.csv /tmp/ltmd-u1-w5-route/
          cp data/catalog/ltmd_u1_w5_history_2018_2019_route_identity.md /tmp/ltmd-u1-w5-route/
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          for attempt in 1 2 3; do
            git fetch origin main
            git reset --hard origin/main
            cp /tmp/ltmd-u1-w5-route/* data/catalog/
            git add data/catalog/ltmd_u1_w5_history_2018_2019_route_identity.csv data/catalog/ltmd_u1_w5_history_2018_2019_route_relationships.csv data/catalog/ltmd_u1_w5_history_2018_2019_route_identity.md
            if git diff --cached --quiet; then exit 0; fi
            git commit -m 'Publish LTMD-U1 W5 History 2018-2019 route identity'
            if git push origin HEAD:main; then exit 0; fi
            sleep $((attempt * 2))
          done
          exit 1

name: build-ltmd-u1-w4-social-sciences-ocr

on:
  workflow_dispatch:

permissions:
  actions: write
  contents: write

env:
  OMP_THREAD_LIMIT: '1'

jobs:
  matrix:
    runs-on: ubuntu-24.04
    outputs:
      viewers: ${{ steps.make.outputs.viewers }}
    steps:
      - uses: actions/checkout@v7
      - id: make
        shell: bash
        run: |
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import csv,json
          proc=list(csv.DictReader(open('data/catalog/ltmd_u1_w4_social_sciences_processing_inventory.csv',encoding='utf-8')))
          man=list(csv.DictReader(open('data/catalog/ltmd_u1_w4_social_sciences_canonical_page_manifest.csv',encoding='utf-8')))
          assert len(proc)==14 and len({r['viewer_key'] for r in proc})==14
          keys=[r['viewer_key'] for r in proc if r['is_canonical_processing_object']=='1' and r['ocr_identity_eligible']=='1']
          assert len(keys)==14 and len(set(keys))==14
          assert all(r['processing_mode']=='direct_canonical' for r in proc)
          assert len(man)==2414 and {r['viewer_key'] for r in man}==set(keys)
          assert all(r['asset_status']=='source_jpeg' for r in man)
          print('viewers='+json.dumps(keys,separators=(',',':')))
          PY

  ocr:
    needs: matrix
    strategy:
      fail-fast: false
      max-parallel: 8
      matrix:
        viewer_key: ${{ fromJSON(needs.matrix.outputs.viewers) }}
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v7
      - name: Install Spanish Tesseract
        run: |
          sudo apt-get update
          sudo apt-get install -y tesseract-ocr tesseract-ocr-spa
      - name: OCR one canonical W4 viewer
        run: python3 scripts/ocr_ltmd_u1_w4_social_sciences_book.py --viewer-key '${{ matrix.viewer_key }}'
      - uses: actions/upload-artifact@v4
        with:
          name: ltmd-u1-w4-social-sciences-ocr-${{ matrix.viewer_key }}
          path: data/work/ltmd_u1_w4_social_sciences_ocr/*.csv
          if-no-files-found: error
          retention-days: 1

  combine:
    needs: ocr
    runs-on: ubuntu-24.04
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@v4
        with:
          pattern: ltmd-u1-w4-social-sciences-ocr-*
          path: data/work/ltmd_u1_w4_social_sciences_ocr
          merge-multiple: true
      - name: Combine exact 14-canonical-viewer OCR layer
        run: python3 scripts/combine_ltmd_u1_w4_social_sciences_ocr.py
      - name: Publish W4 OCR 0.1 race-safely
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/ltmd-u1-w4-ocr
          cp data/catalog/ltmd_u1_w4_social_sciences_ocr_metrics.csv /tmp/ltmd-u1-w4-ocr/
          cp data/catalog/ltmd_u1_w4_social_sciences_ocr_summary.csv /tmp/ltmd-u1-w4-ocr/
          cp data/catalog/ltmd_u1_w4_social_sciences_ocr.md /tmp/ltmd-u1-w4-ocr/
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          for attempt in 1 2 3; do
            git fetch origin main
            git reset --hard origin/main
            cp /tmp/ltmd-u1-w4-ocr/* data/catalog/
            git add data/catalog/ltmd_u1_w4_social_sciences_ocr_metrics.csv data/catalog/ltmd_u1_w4_social_sciences_ocr_summary.csv data/catalog/ltmd_u1_w4_social_sciences_ocr.md
            if git diff --cached --quiet; then break; fi
            git commit -m 'Publish LTMD-U1 W4 Social Sciences OCR 0.1 metrics'
            if git push origin HEAD:main; then break; fi
            if [ "$attempt" -eq 3 ]; then exit 1; fi
            sleep $((attempt * 2))
          done
      - name: Dispatch W4 PAGESTRUCT
        run: gh workflow run build-ltmd-u1-w4-social-sciences-pagestruct.yml --repo "$GITHUB_REPOSITORY" --ref main

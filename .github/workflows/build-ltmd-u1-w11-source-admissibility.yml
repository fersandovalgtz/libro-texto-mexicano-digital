name: build-ltmd-u1-w11-source-admissibility

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/build-ltmd-u1-w11-source-admissibility.yml'
      - 'scripts/build_ltmd_u1_w11_source_admissibility.py'
      - 'data/catalog/ltmd_u1_w11_standard_asset_summary.csv'
      - 'data/catalog/ltmd_u1_w11_nonstandard_asset_summary.csv'
  workflow_run:
    workflows:
      - 'build-ltmd-u1-w11-standard-assets'
      - 'build-ltmd-u1-w11-nonstandard-assets'
    types: [completed]

permissions:
  contents: write

concurrency:
  group: build-ltmd-u1-w11-source-admissibility
  cancel-in-progress: false

jobs:
  build:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - id: ready
        shell: bash
        run: |
          if [[ -f data/catalog/ltmd_u1_w11_standard_asset_summary.csv && -f data/catalog/ltmd_u1_w11_nonstandard_asset_summary.csv ]]; then
            echo 'ready=true' >> "$GITHUB_OUTPUT"
          else
            echo 'ready=false' >> "$GITHUB_OUTPUT"
            echo 'Both W11 asset summaries are required; leaving gate pending.'
          fi
      - name: Build consolidated W11 source gate
        if: steps.ready.outputs.ready == 'true'
        run: python3 scripts/build_ltmd_u1_w11_source_admissibility.py
      - name: Publish W11 source gate race-safely
        if: steps.ready.outputs.ready == 'true'
        shell: bash
        run: |
          set -euo pipefail
          cp data/catalog/ltmd_u1_w11_source_admissibility.csv /tmp/ltmd_u1_w11_source_admissibility.csv
          cp docs/LTMD_U1_W11_SOURCE_ADMISSIBILITY.md /tmp/LTMD_U1_W11_SOURCE_ADMISSIBILITY.md
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          for attempt in 1 2 3; do
            git fetch origin main
            git reset --hard origin/main
            cp /tmp/ltmd_u1_w11_source_admissibility.csv data/catalog/
            cp /tmp/LTMD_U1_W11_SOURCE_ADMISSIBILITY.md docs/
            git add data/catalog/ltmd_u1_w11_source_admissibility.csv docs/LTMD_U1_W11_SOURCE_ADMISSIBILITY.md
            if git diff --cached --quiet; then exit 0; fi
            git commit -m 'data(w11): publish consolidated source-admissibility gate'
            if git push origin HEAD:main; then exit 0; fi
            sleep $((attempt*2))
          done
          exit 1

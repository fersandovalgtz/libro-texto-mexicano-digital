name: Governance migration — export read-only workflow patch

on:
  push:
    branches:
      - maintenance/ci-no-direct-main-writes-2026-08-31

permissions:
  contents: read

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: maintenance/ci-no-direct-main-writes-2026-08-31
          fetch-depth: 0

      - name: Rewrite legacy workflow permissions and pushes
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          root = Path('.github/workflows')
          changed = []
          permission_re = re.compile(r'(?m)^(\s*)contents:\s*write\s*(#.*)?$')
          push_re = re.compile(r'(?m)^(\s*)git\s+push(?:\s.*)?$')

          for path in sorted(root.glob('*.y*ml')):
              original = path.read_text(encoding='utf-8')
              text = permission_re.sub(lambda m: f"{m.group(1)}contents: read" + (f" {m.group(2)}" if m.group(2) else ""), original)
              text = push_re.sub(lambda m: f'{m.group(1)}echo "Direct git push disabled by LTMD governance; publish artifacts and promote through reviewed PR."', text)
              if text != original:
                  path.write_text(text, encoding='utf-8')
                  changed.append(str(path))

          Path('governance_changed_files.txt').write_text('\n'.join(changed) + '\n', encoding='utf-8')
          print(f'Migrated {len(changed)} workflow files')
          PY

      - name: Export transformed workflows
        uses: actions/upload-artifact@v4
        with:
          name: governance-transformed-workflows
          path: |
            .github/workflows
            governance_changed_files.txt
          if-no-files-found: error

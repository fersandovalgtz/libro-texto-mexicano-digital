name: build-ltmd-u1-w3-spanish-pagestruct

on:
  workflow_dispatch:
  workflow_run:
    workflows: ['build-ltmd-u1-w3-spanish-ocr']
    types: [completed]
  push:
    paths:
      - 'data/catalog/ltmd_u1_w3_spanish_ocr_metrics.csv'
      - 'data/catalog/ltmd_u1_w3_spanish_ocr_summary.csv'

permissions:
  actions: write
  contents: write

env:
  OMP_THREAD_LIMIT: '1'

jobs:
  matrix:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-24.04
    outputs:
      viewers: ${{ steps.make.outputs.viewers }}
    steps:
      - uses: actions/checkout@v4
      - id: make
        shell: bash
        run: |
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import csv,json
          rows=list(csv.DictReader(open('data/catalog/ltmd_u1_w3_spanish_ocr_summary.csv',encoding='utf-8')))
          metrics=list(csv.DictReader(open('data/catalog/ltmd_u1_w3_spanish_ocr_metrics.csv',encoding='utf-8')))
          assert len(rows)==114, len(rows)
          assert {r['ocr_version'] for r in rows}=={'LTMD_U1_W3_SPANISH_OCR_0.1'}
          assert all(int(r['unresolved'])==0 and int(r['sha_verified'])==int(r['pages']) for r in rows)
          assert len(metrics)==20765, len(metrics)
          assert all(r['source_sha256_verified']=='1' and r['ocr_status']=='ok' for r in metrics)
          print('viewers='+json.dumps([r['viewer_key'] for r in rows],separators=(',',':')))
          PY

  flags:
    needs: matrix
    strategy:
      fail-fast: false
      max-parallel: 8
      matrix:
        viewer_key: ${{ fromJSON(needs.matrix.outputs.viewers) }}
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - name: Install Spanish Tesseract
        run: |
          sudo apt-get update
          sudo apt-get install -y tesseract-ocr tesseract-ocr-spa
      - name: Extract structural flags for one canonical Español/Lengua viewer
        run: python3 scripts/extract_ltmd_u1_w3_spanish_structural_flags_book.py --viewer-key '${{ matrix.viewer_key }}'
      - uses: actions/upload-artifact@v7
        with:
          name: ltmd-u1-w3-spanish-structkw-${{ matrix.viewer_key }}
          path: data/work/ltmd_u1_w3_spanish_structkw/*.csv
          if-no-files-found: error
          retention-days: 1

  combine:
    needs: flags
    runs-on: ubuntu-24.04
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@v4
        with:
          pattern: ltmd-u1-w3-spanish-structkw-*
          path: data/work/ltmd_u1_w3_spanish_structkw
          merge-multiple: true
      - name: Combine exact 114-canonical structural flag layer
        run: python3 scripts/combine_ltmd_u1_w3_spanish_structural_flags.py
      - name: Build PAGESTRUCT layer with frozen conservative rules
        run: python3 scripts/classify_ltmd_u1_w3_spanish_page_structure.py
      - name: Publish W3 PAGESTRUCT 0.1 race-safely
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/ltmd-u1-w3-spanish-pagestruct
          cp data/catalog/ltmd_u1_w3_spanish_structural_keyword_flags.csv /tmp/ltmd-u1-w3-spanish-pagestruct/
          cp data/catalog/ltmd_u1_w3_spanish_page_structure.csv /tmp/ltmd-u1-w3-spanish-pagestruct/
          cp data/catalog/ltmd_u1_w3_spanish_page_structure_summary.csv /tmp/ltmd-u1-w3-spanish-pagestruct/
          cp data/catalog/ltmd_u1_w3_spanish_page_structure.md /tmp/ltmd-u1-w3-spanish-pagestruct/
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          for attempt in 1 2 3; do
            git fetch origin main
            git reset --hard origin/main
            cp /tmp/ltmd-u1-w3-spanish-pagestruct/* data/catalog/
            git add data/catalog/ltmd_u1_w3_spanish_structural_keyword_flags.csv data/catalog/ltmd_u1_w3_spanish_page_structure.csv data/catalog/ltmd_u1_w3_spanish_page_structure_summary.csv data/catalog/ltmd_u1_w3_spanish_page_structure.md
            if git diff --cached --quiet; then exit 0; fi
            git commit -m 'Publish LTMD-U1 W3 Spanish PAGESTRUCT 0.1 layer'
            if git push origin HEAD:main; then exit 0; fi
            sleep $((attempt * 2))
          done
          exit 1
      - name: Dispatch W3 FRAGSEG
        run: gh workflow run build-ltmd-u1-w3-spanish-fragseg.yml --repo "$GITHUB_REPOSITORY" --ref main

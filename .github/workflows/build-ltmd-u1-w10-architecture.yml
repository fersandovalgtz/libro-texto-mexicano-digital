name: build-ltmd-u1-w10-architecture

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/build-ltmd-u1-w10-architecture.yml'
      - 'scripts/audit_ltmd_u1_w10_integrados_architecture.py'
      - 'data/catalog/ltmd_u1_w10_scope.csv'

permissions:
  contents: write

concurrency:
  group: build-ltmd-u1-w10-architecture
  cancel-in-progress: false

jobs:
  audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Audit 69 frozen W10 viewers
        run: python3 scripts/audit_ltmd_u1_w10_integrados_architecture.py
      - name: Verify architecture output contract
        run: |
          python3 - <<'PY'
          import csv
          rows=list(csv.DictReader(open('data/catalog/ltmd_u1_w10_viewer_architecture.csv',encoding='utf-8')))
          assert len(rows)==69 and len({r['viewer_key'] for r in rows})==69
          assert {r['architecture_version'] for r in rows}=={'LTMD_U1_W10_ARCHITECTURE_0.1'}
          print('W10 architecture audit PASS: 69 identities observed')
          PY
      - name: Publish W10 architecture audit race-safely
        shell: bash
        run: |
          set -euo pipefail
          cp data/catalog/ltmd_u1_w10_viewer_architecture.csv /tmp/ltmd_u1_w10_viewer_architecture.csv
          cp docs/LTMD_U1_W10_ARCHITECTURE.md /tmp/LTMD_U1_W10_ARCHITECTURE.md
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          for attempt in 1 2 3; do
            git fetch origin main
            git reset --hard origin/main
            cp /tmp/ltmd_u1_w10_viewer_architecture.csv data/catalog/ltmd_u1_w10_viewer_architecture.csv
            cp /tmp/LTMD_U1_W10_ARCHITECTURE.md docs/LTMD_U1_W10_ARCHITECTURE.md
            git add data/catalog/ltmd_u1_w10_viewer_architecture.csv docs/LTMD_U1_W10_ARCHITECTURE.md
            if git diff --cached --quiet; then exit 0; fi
            git commit -m 'data(w10): publish viewer-architecture audit'
            if git push origin HEAD:main; then exit 0; fi
            sleep $((attempt*2))
          done
          exit 1

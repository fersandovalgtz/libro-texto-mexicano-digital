name: build-ltmd-u1-w10-source-admissibility

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/build-ltmd-u1-w10-source-admissibility.yml'
      - 'scripts/build_ltmd_u1_w10_source_admissibility.py'
      - 'data/catalog/ltmd_u1_w10_asset_summary.csv'
      - 'data/catalog/ltmd_u1_w10_asset_manifest.csv'

permissions:
  contents: write

concurrency:
  group: build-ltmd-u1-w10-source-admissibility
  cancel-in-progress: false

jobs:
  gate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Apply strict W10 source gate
        run: python3 scripts/build_ltmd_u1_w10_source_admissibility.py
      - name: Publish W10 source-admissibility matrix
        shell: bash
        run: |
          set -euo pipefail
          cp data/catalog/ltmd_u1_w10_source_admissibility.csv /tmp/ltmd_u1_w10_source_admissibility.csv
          cp docs/LTMD_U1_W10_SOURCE_ADMISSIBILITY.md /tmp/LTMD_U1_W10_SOURCE_ADMISSIBILITY.md
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          for attempt in 1 2 3; do
            git fetch origin main
            git reset --hard origin/main
            cp /tmp/ltmd_u1_w10_source_admissibility.csv data/catalog/ltmd_u1_w10_source_admissibility.csv
            cp /tmp/LTMD_U1_W10_SOURCE_ADMISSIBILITY.md docs/LTMD_U1_W10_SOURCE_ADMISSIBILITY.md
            git add data/catalog/ltmd_u1_w10_source_admissibility.csv docs/LTMD_U1_W10_SOURCE_ADMISSIBILITY.md
            if git diff --cached --quiet; then exit 0; fi
            git commit -m 'data(w10): publish source-admissibility matrix'
            if git push origin HEAD:main; then exit 0; fi
            sleep $((attempt*2))
          done
          exit 1

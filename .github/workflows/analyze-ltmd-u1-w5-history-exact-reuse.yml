name: analyze-ltmd-u1-w5-history-exact-reuse

on:
  workflow_dispatch:
  workflow_run:
    workflows: ['build-ltmd-u1-w5-history-fragseg']
    types: [completed]

permissions:
  contents: write

jobs:
  analyze:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Verify W5 FRAGSEG evidence exists
        run: |
          test -f data/catalog/ltmd_u1_w5_history_fragment_manifest.csv
          test -f data/catalog/ltmd_u1_w5_history_fragment_manifest_summary.csv
          test -f data/catalog/ltmd_u1_w5_history_processing_inventory.csv
      - name: Analyze exact textual reuse
        run: python3 scripts/analyze_ltmd_u1_w5_history_exact_reuse.py
      - name: Publish W5 exact-reuse analysis race-safely
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/w5-exact-reuse
          cp data/catalog/ltmd_u1_w5_history_exact_content_units.csv /tmp/w5-exact-reuse/
          cp data/catalog/ltmd_u1_w5_history_exact_viewer_overlap.csv /tmp/w5-exact-reuse/
          cp data/catalog/ltmd_u1_w5_history_exact_reuse.md /tmp/w5-exact-reuse/
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          for attempt in 1 2 3; do
            git fetch origin main
            git reset --hard origin/main
            cp /tmp/w5-exact-reuse/* data/catalog/
            git add data/catalog/ltmd_u1_w5_history_exact_content_units.csv data/catalog/ltmd_u1_w5_history_exact_viewer_overlap.csv data/catalog/ltmd_u1_w5_history_exact_reuse.md
            if git diff --cached --quiet; then exit 0; fi
            git commit -m 'Publish LTMD-U1 W5 History exact-reuse analysis'
            if git push origin HEAD:main; then exit 0; fi
            sleep $((attempt * 2))
          done
          exit 1

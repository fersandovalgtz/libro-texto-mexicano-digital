name: build-ltmd-u1-w9-declared-inventory

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/build-ltmd-u1-w9-declared-inventory.yml'
      - 'scripts/build_ltmd_u1_w9_educacion_fisica_declared_inventory.py'
      - 'data/catalog/ltmd_u1_w9_scope.csv'
      - 'data/catalog/ltmd_u1_w9_viewer_architecture.csv'

permissions:
  contents: write

concurrency:
  group: build-ltmd-u1-w9-declared-inventory
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Build W9 declared inventory
        run: python3 scripts/build_ltmd_u1_w9_educacion_fisica_declared_inventory.py
      - name: Verify declared inventory
        run: |
          python3 - <<'PY'
          import csv
          rows=list(csv.DictReader(open('data/catalog/ltmd_u1_w9_declared_inventory.csv',encoding='utf-8')))
          assert len(rows)==4 and len({r['viewer_key'] for r in rows})==4
          assert {r['inventory_version'] for r in rows}=={'LTMD_U1_W9_DECLARED_INVENTORY_0.1'}
          assert all(int(r['declared_positions'])>0 for r in rows)
          print('W9 declared inventory PASS: total=',sum(int(r['declared_positions']) for r in rows))
          PY
      - name: Publish inventory products
        shell: bash
        run: |
          set -euo pipefail
          for f in ltmd_u1_w9_declared_inventory.csv ltmd_u1_w9_declared_inventory_summary.csv ltmd_u1_w9_declared_inventory.md; do cp data/catalog/$f /tmp/$f; done
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          for attempt in 1 2 3; do
            git fetch origin main
            git reset --hard origin/main
            for f in ltmd_u1_w9_declared_inventory.csv ltmd_u1_w9_declared_inventory_summary.csv ltmd_u1_w9_declared_inventory.md; do cp /tmp/$f data/catalog/$f; done
            git add data/catalog/ltmd_u1_w9_declared_inventory.csv data/catalog/ltmd_u1_w9_declared_inventory_summary.csv data/catalog/ltmd_u1_w9_declared_inventory.md
            if git diff --cached --quiet; then exit 0; fi
            git commit -m 'data(w9): publish physical-education declared inventory'
            if git push origin HEAD:main; then exit 0; fi
            sleep $((attempt*2))
          done
          exit 1

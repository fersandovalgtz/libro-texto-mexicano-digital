name: build-ltmd-u1-w10-completion

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/build-ltmd-u1-w10-completion.yml'
      - 'data/catalog/ltmd_u1_w10_integrados_exact_content_units.csv'
      - 'data/catalog/ltmd_u1_w10_integrados_exact_viewer_overlap.csv'
  workflow_run:
    workflows: ['build-ltmd-u1-w10-integrados-exact-reuse']
    types: [completed]

permissions:
  contents: write

concurrency:
  group: build-ltmd-u1-w10-completion
  cancel-in-progress: false

jobs:
  validate:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Validate complete W10 evidence chain
        run: python3 scripts/build_ltmd_u1_w10_completion_report.py
      - name: Publish W10 completion report race-safely
        shell: bash
        run: |
          set -euo pipefail
          cp docs/LTMD_U1_W10_COMPLETION.md /tmp/LTMD_U1_W10_COMPLETION.md
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          for attempt in 1 2 3; do
            git fetch origin main
            git reset --hard origin/main
            cp /tmp/LTMD_U1_W10_COMPLETION.md docs/LTMD_U1_W10_COMPLETION.md
            git add docs/LTMD_U1_W10_COMPLETION.md
            if git diff --cached --quiet; then exit 0; fi
            git commit -m 'data(w10): publish technical completion report'
            if git push origin HEAD:main; then exit 0; fi
            sleep $((attempt*2))
          done
          exit 1

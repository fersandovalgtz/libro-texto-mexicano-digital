          C2E2I5rFrDawT46HEl9IUqgeCHmB
          -----END CERTIFICATE-----
          PEM
      - name: Download three preregistered pages and encrypt working copy
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p work
          curl -fsSL --retry 3 --connect-timeout 15 --max-time 90 'https://historico.conaliteg.gob.mx/c/H1972P5CI084/052.jpg' -o work/LTMD-CER-1972-Q1_2.jpg
          curl -fsSL --retry 3 --connect-timeout 15 --max-time 90 'https://historico.conaliteg.gob.mx/c/H1972P5CI084/085.jpg' -o work/LTMD-CER-1972-Q2_1.jpg
          curl -fsSL --retry 3 --connect-timeout 15 --max-time 90 'https://historico.conaliteg.gob.mx/c/H1972P5CI084/109.jpg' -o work/LTMD-CER-1972-Q2_2.jpg
          sha256sum work/*.jpg > working-copy.sha256
          tar -cf working-copy.tar -C work .
          openssl cms -encrypt -binary -aes256 -in working-copy.tar -outform DER -out working-copy.p7m public-cert.pem
          rm -rf work working-copy.tar public-cert.pem
      - name: Upload ciphertext only
        uses: actions/upload-artifact@v7
        with:
          name: ltmd-cer-1972-batch2-encrypted-working-copy
          path: |
            working-copy.p7m
            working-copy.sha256
          retention-days: 1
          if-no-files-found: error

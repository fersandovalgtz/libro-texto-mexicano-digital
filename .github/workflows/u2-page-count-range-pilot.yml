name: LTMD U2 page-count range pilot

on:
  push:
    branches: [science/u2-page-count-probe]
    paths:
      - 'scripts/probe_u2_page_count_range.py'
      - '.github/workflows/u2-page-count-range-pilot.yml'

permissions:
  contents: read

jobs:
  pilot:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install pinned-range pilot parser
        run: python -m pip install --disable-pip-version-check 'pypdf>=5,<7'
      - name: Observe one large U2 page count within range budget
        run: >-
          python scripts/probe_u2_page_count_range.py
          --viewer-key P0CMA
          --cycle 2026
          --level primaria
          --chunk-size 32768
          --max-bytes 8388608
          --observed-at 2026-09-02
          --output u2-page-count-pilot.json
      - name: Upload pilot metadata only
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ltmd-u2-page-count-range-pilot-${{ github.sha }}
          path: u2-page-count-pilot.json
          retention-days: 7

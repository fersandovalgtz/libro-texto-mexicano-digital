name: LTMD U2 page-count range pilot

on:
  push:
    branches: [science/u2-page-count-probe]
    paths:
      - 'scripts/probe_u2_page_count_range.py'
      - 'scripts/probe_u2_linearized_page_count.py'
      - '.github/workflows/u2-page-count-range-pilot.yml'

permissions:
  contents: read

jobs:
  pilot:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Observe one large U2 page count from bounded PDF prefix
        run: >-
          python scripts/probe_u2_linearized_page_count.py
          --viewer-key P0CMA
          --cycle 2026
          --level primaria
          --prefix-bytes 65536
          --observed-at 2026-09-02
          --output u2-linearized-page-count-pilot.json
      - name: Upload pilot metadata only
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ltmd-u2-linearized-page-count-pilot-${{ github.sha }}
          path: u2-linearized-page-count-pilot.json
          retention-days: 7

name: LTMD U2 page-count range pilot

on:
  push:
    branches: [science/u2-page-count-probe]
    paths:
      - 'scripts/probe_u2_page_count_range.py'
      - 'scripts/probe_u2_linearized_page_count.py'
      - 'scripts/probe_u2_classic_xref_page_count.py'
      - '.github/workflows/u2-page-count-range-pilot.yml'

permissions:
  contents: read

jobs:
  cross-validation:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        include:
          - viewer_key: P5LPM
            size_class: small
          - viewer_key: P4PEA
            size_class: medium
          - viewer_key: P3MLA
            size_class: large
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Observe structural U2 page count
        run: >-
          python scripts/probe_u2_classic_xref_page_count.py
          --viewer-key ${{ matrix.viewer_key }}
          --cycle 2026
          --level primaria
          --tail-bytes 65536
          --xref-window 3145728
          --object-window 65536
          --max-bytes 4194304
          --observed-at 2026-09-02
          --output u2-classic-xref-page-count-${{ matrix.viewer_key }}.json
      - name: Upload metadata only
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ltmd-u2-page-count-${{ matrix.size_class }}-${{ matrix.viewer_key }}-${{ github.sha }}
          path: u2-classic-xref-page-count-${{ matrix.viewer_key }}.json
          retention-days: 7

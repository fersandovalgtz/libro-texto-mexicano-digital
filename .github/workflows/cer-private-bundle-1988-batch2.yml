name: Encrypted private bundle — 1988 CER batch 2

on:
  push:
    paths: ['.github/workflows/cer-private-bundle-1988-batch2.yml']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  bundle:
    runs-on: ubuntu-24.04
    env:
      OMP_THREAD_LIMIT: '1'
    steps:
      - name: Install exact production OCR
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq tesseract-ocr tesseract-ocr-spa python3-pil
          tesseract --version | head -1 | tee version.txt
          grep -F 'tesseract 5.3.4' version.txt

      - name: Write one-use public certificate
        run: |
          cat > cert.pem <<'PEM'
          -----BEGIN CERTIFICATE-----
          MIIEgTCCAumgAwIBAgIUQGOujpdaeOr+rs9FqVQ7TpXv5OcwDQYJKoZIhvcNAQEL
          BQAwUDEnMCUGA1UEAwweTFRNRCBDRVIgMTk4OCBiYXRjaDIgdHJhbnNwb3J0MSUw
          IwYDVQQKDBxMaWJybyBUZXh0byBNZXhpY2FubyBEaWdpdGFsMB4XDTI2MDgxNTE2
          MTM1M1oXDTI2MDgxNzE2MTM1M1owUDEnMCUGA1UEAwweTFRNRCBDRVIgMTk4OCBi
          YXRjaDIgdHJhbnNwb3J0MSUwIwYDVQQKDBxMaWJybyBUZXh0byBNZXhpY2FubyBE
          aWdpdGFsMIIBojANBgkqhkiG9w0BAQEFAAOCAY8AMIIBigKCAYEAtplnHEKIcZRM
          UIEg9KuZb2xw+dv1rjNXVwFGvY603U/FykGuhMbbkGJTRNWEFnjd06TjLopm8TFU
          nkB8bRULaDi+XM3RlqdN2Uspc7nVi7h6ENNmLmfrOEhJSygXC4mQiDiKOh/3jhsD
          Al9PgyT8M26PURmhDchPzC0HSihqhQJOE8Alu2LwX54qg8s9BhZGaVCKmPfVNmd6
          8eNUt3hIz0jUr0lLZ1unHeSGN/o2XfxzextYcNKREHnYE68658dITYbiuSipdrbf
          MypkG9Xr7gb4HqMcWMgJXGT7x07AYiosNe9DbPIQh9jdox0jW5evTXBhwYtUxbgP
          2yGm2PeHH8fQ58NcH7RPSj9ODjKHD5bkvi2e0SwPZZuAK6CGfG4i0V6LYjX11vjV
          zKhXRlfrpqEhh9vhYi1pEvwKfasxk/LOXWwFkG0/QgXJByVQ0dC4q6T3ZPno8A4O
          GREdWTmAeMAALedVHbwiaBNimXEC9nxnDqACQYCiKM0TreSDuskZAgMBAAGjUzBR
          MB0GA1UdDgQWBBRe1DV3Ff9c02sQi13iBdzS58d8djAfBgNVHSMEGDAWgBRe1DV3
          Ff9c02sQi13iBdzS58d8djAPBgNVHRMBAf8EBTADAQH/MA0GCSqGSIb3DQEBCwUA
          A4IBgQBLLhaD9fc6klgTaTu9fgL39tO1XKcSEpScqvcUMCSD3p60/WlUMd+J69mH
          t7gk+r7D7NPduU/3Sac6y1V5Og0YymF096fneYs5x4ri9Gc0AGvlwAq5dIRA5WTi
          sTUnnx4HJx6KRXufhGrRdiZH0llXCMr88t01/lBAGi8xBGS+CtrkquMqap651wgl
          YLDlJiau/2BEBRMkhbUHkCbu++kuxlcQ8Tc2SB7NOu6gxr6nALhYLyydJNS6aKva
          VrNtQT9vRIyVsZdxoXe0Q02TsdDEvlp3wh4S/+2nZBcg9DSBsqblhZo5xoY2ct9j
          drDBrd8maFyKY3+M+pv5UlXe6OpHYu8lHyFfKVigOXcLikGKFxax0nUbpv+J1QeB
          Y91ydX8rhVV8YqIHd7F3qKWHVajqKuG4DmbZ3HxLRdsaczfeDUx1uUid3xoZSBjG
          yikvVr28jwnxR5hBXG2b/CeQfDClgF2uguVXjzuZ+aXQ70lXINBcR76qJoGIKYi6
          lGXeT+Y=
          -----END CERTIFICATE-----
          PEM
          openssl x509 -in cert.pem -noout -fingerprint -sha256

      - name: Acquire source pages and full-page production OCR
        run: |
          set -euo pipefail
          mkdir -p private_bundle
          for n in 033 054 068; do
            curl -fsSL --retry 3 --connect-timeout 15 --max-time 90 "https://historico.conaliteg.gob.mx/c/H1988P5CI123/${n}.jpg" -o "private_bundle/${n}.jpg"
          done
          python3 - <<'PY'
          from PIL import Image
          for n in ('033','054','068'):
              with Image.open(f'private_bundle/{n}.jpg') as im:
                  assert im.size == (670,993), (n, im.size)
          PY
          for n in 033 054 068; do
            tesseract "private_bundle/${n}.jpg" "private_bundle/${n}" -l spa --psm 3 txt tsv >/dev/null 2>"private_bundle/${n}.stderr"
          done

      - name: Write manifests
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib,json
          from pathlib import Path
          pages=[('LTMD-CER-1988-Q1_2','033','LTMD-CN5-G1988-VP033'),('LTMD-CER-1988-Q2_1','054','LTMD-CN5-G1988-VP054'),('LTMD-CER-1988-Q2_2','068','LTMD-CN5-G1988-VP068')]
          ver=Path('version.txt').read_text().strip(); pub=[]
          for sid,n,pid in pages:
              b=Path(f'private_bundle/{n}.jpg').read_bytes()
              pub.append({'sample_id':sid,'page_id':pid,'viewer_page':int(n),'selected_psm':3,'tesseract_version':ver,'source_sha256':hashlib.sha256(b).hexdigest(),'source_bytes':len(b),'full_page_text_chars':len(Path(f'private_bundle/{n}.txt').read_text(encoding='utf-8')),'tsv_chars':len(Path(f'private_bundle/{n}.tsv').read_text(encoding='utf-8'))})
          Path('private_bundle/private_manifest.json').write_text(json.dumps({'pages':pub},ensure_ascii=False,indent=2),encoding='utf-8')
          Path('manifest.json').write_text(json.dumps({'transport':'encrypted tar bundle containing private source JPEG + production full-page TXT/TSV','certificate_fingerprint_sha256':'15:8D:6B:2A:25:8B:AA:08:1D:65:11:16:0C:C6:B2:A3:D8:6E:0B:3F:3D:D2:E0:DA:6A:51:C6:96:58:22:66:B5','pages':pub},ensure_ascii=False,indent=2),encoding='utf-8')
          PY

      - name: Encrypt and erase plaintext
        run: |
          set -euo pipefail
          tar -czf private_bundle.tar.gz private_bundle/
          openssl cms -encrypt -binary -aes256 -in private_bundle.tar.gz -outform DER -out payload.p7m cert.pem
          sha256sum payload.p7m > ciphertext.sha256
          rm -rf private_bundle private_bundle.tar.gz cert.pem version.txt
          test ! -d private_bundle

      - name: Upload ciphertext and manifest only
        uses: actions/upload-artifact@v4
        with:
          name: ltmd-cer-1988-batch2-private-bundle-encrypted
          path: |
            payload.p7m
            manifest.json
            ciphertext.sha256
          retention-days: 1
          if-no-files-found: error

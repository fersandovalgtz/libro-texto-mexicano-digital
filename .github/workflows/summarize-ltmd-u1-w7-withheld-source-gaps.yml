name: summarize-ltmd-u1-w7-withheld-source-gaps

on:
  workflow_dispatch:
  push:
    paths:
      - 'scripts/summarize_ltmd_u1_w7_withheld_source_gaps.py'
      - 'data/catalog/ltmd_u1_w7_civics_ethics_asset_manifest.csv'
      - 'data/catalog/ltmd_u1_w7_source_admissibility.csv'

concurrency:
  group: ltmd-u1-w7-withheld-source-gaps
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  summarize:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Build compact withheld-source diagnostics
        run: python3 scripts/summarize_ltmd_u1_w7_withheld_source_gaps.py
      - name: Publish diagnostics race-safely
        run: |
          set -euo pipefail
          rm -rf /tmp/ltmd-w7-withheld
          mkdir -p /tmp/ltmd-w7-withheld
          cp data/catalog/ltmd_u1_w7_withheld_source_gaps.csv /tmp/ltmd-w7-withheld/
          cp data/catalog/ltmd_u1_w7_withheld_source_gaps.md /tmp/ltmd-w7-withheld/
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          for attempt in 1 2 3; do
            git fetch origin main
            git reset --hard origin/main
            cp /tmp/ltmd-w7-withheld/* data/catalog/
            git add data/catalog/ltmd_u1_w7_withheld_source_gaps.csv data/catalog/ltmd_u1_w7_withheld_source_gaps.md
            if git diff --cached --quiet; then exit 0; fi
            git commit -m 'Publish LTMD U1 W7 withheld-source gap diagnostics'
            if git push origin HEAD:main; then exit 0; fi
            sleep $((attempt * 2))
          done
          exit 1

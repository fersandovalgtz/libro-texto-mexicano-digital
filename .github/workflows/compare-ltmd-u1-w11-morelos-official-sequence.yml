name: compare-ltmd-u1-w11-morelos-official-sequence

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/compare-ltmd-u1-w11-morelos-official-sequence.yml'
      - 'scripts/compare_ltmd_u1_w11_morelos_official_sequence.py'
      - 'data/catalog/ltmd_u1_w11_standard_asset_manifest.csv'
      - 'data/catalog/ltmd_u1_conaliteg_output_config.csv'

permissions:
  contents: write

concurrency:
  group: compare-ltmd-u1-w11-morelos-official-sequence
  cancel-in-progress: false

jobs:
  compare:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Compare official Morelos sequence by SHA-256
        run: python3 scripts/compare_ltmd_u1_w11_morelos_official_sequence.py
      - name: Publish comparison metadata race-safely
        shell: bash
        run: |
          set -euo pipefail
          cp data/catalog/ltmd_u1_w11_morelos_official_sequence_comparison.csv /tmp/ltmd_u1_w11_morelos_official_sequence_comparison.csv
          cp docs/LTMD_U1_W11_MORELOS_OFFICIAL_SEQUENCE_COMPARISON.md /tmp/LTMD_U1_W11_MORELOS_OFFICIAL_SEQUENCE_COMPARISON.md
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          for attempt in 1 2 3; do
            git fetch origin main
            git reset --hard origin/main
            cp /tmp/ltmd_u1_w11_morelos_official_sequence_comparison.csv data/catalog/
            cp /tmp/LTMD_U1_W11_MORELOS_OFFICIAL_SEQUENCE_COMPARISON.md docs/
            git add data/catalog/ltmd_u1_w11_morelos_official_sequence_comparison.csv docs/LTMD_U1_W11_MORELOS_OFFICIAL_SEQUENCE_COMPARISON.md
            if git diff --cached --quiet; then exit 0; fi
            git commit -m 'data(w11): publish Morelos exact-sequence comparison'
            if git push origin HEAD:main; then exit 0; fi
            sleep $((attempt*2))
          done
          exit 1

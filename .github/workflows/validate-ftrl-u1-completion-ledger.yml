name: Validate exhaustive FTRL-U1 completion ledger

on:
  push:
    branches:
      - 'ftrl/**'
      - 'preservation/**'
    paths:
      - 'scripts/build_ltmd_u1_ftrl_completion_ledger.py'
      - 'scripts/build_ltmd_u1_ftrl_completion_ledger_v2.py'
      - 'scripts/build_ltmd_u1_ftrl_completion_ledger_v3.py'
      - 'scripts/build_ltmd_u1_ftrl_completion_ledger_v4.py'
      - 'scripts/build_ltmd_u1_ftrl_completion_ledger_v5.py'
      - 'scripts/build_ltmd_u1_ftrl_completion_ledger_v6.py'
      - 'scripts/build_ltmd_u1_ftrl_completion_ledger_v7.py'
      - 'scripts/build_ltmd_u1_ftrl_completion_ledger_v8.py'
      - 'data/catalog/ltmd_u1_w3_spanish_processing_inventory.csv'
      - 'data/catalog/ltmd_u1_w4_social_sciences_processing_inventory.csv'
      - 'data/catalog/ltmd_u1_w6_geography_atlas_processing_inventory.csv'
      - 'data/catalog/ltmd_u1_w7_source_admissibility.csv'
      - 'data/catalog/ltmd_u1_w8_artes_source_admissibility.csv'
      - 'data/catalog/ltmd_u1_w9_processing_inventory.csv'
      - 'data/research/ltmd_u1_ftrl_wave_state.json'
      - 'data/research/ltmd_u1_w1_archival_closure.json'
      - 'data/research/ltmd_u1_w3_archival_closure.json'
      - 'data/research/ltmd_u1_w4_archival_closure.json'
      - 'data/research/ltmd_u1_w5_archival_closure.json'
      - 'data/research/ltmd_u1_w6_archival_closure.json'
      - 'data/research/ltmd_u1_w7_global_evidence.json'
      - 'data/research/ltmd_u1_w7_archival_closure.json'
      - 'data/research/ltmd_u1_w8_global_evidence.json'
      - 'data/research/ltmd_u1_w8_archival_closure.json'
      - 'data/research/ltmd_u1_w9_global_evidence.json'
      - 'data/research/ltmd_u1_w9_archival_closure.json'
      - 'docs/LTMD_U1_FTRL_COMPLETION_LEDGER_0_1.md'
      - 'docs/LTMD_U1_FTRL_COMPLETION_LEDGER_0_2.md'
      - 'docs/LTMD_U1_FTRL_COMPLETION_LEDGER_0_3.md'
      - 'docs/LTMD_U1_FTRL_COMPLETION_LEDGER_0_4.md'
      - 'docs/LTMD_U1_FTRL_COMPLETION_LEDGER_0_5.md'
      - 'docs/LTMD_U1_FTRL_COMPLETION_LEDGER_0_6.md'
      - 'docs/LTMD_U1_FTRL_COMPLETION_LEDGER_0_7.md'
      - 'docs/LTMD_U1_FTRL_COMPLETION_LEDGER_0_8.md'
      - '.github/workflows/validate-ftrl-u1-completion-ledger.yml'
  pull_request:
    branches: [main]
    paths:
      - 'data/catalog/ltmd_u1_coverage.csv'
      - 'data/catalog/ltmd_u1_retained_source_register.csv'
      - 'data/catalog/ltmd_u1_w3_spanish_processing_inventory.csv'
      - 'data/catalog/ltmd_u1_w4_social_sciences_processing_inventory.csv'
      - 'data/catalog/ltmd_u1_w5_history_processing_inventory.csv'
      - 'data/catalog/ltmd_u1_w6_geography_atlas_processing_inventory.csv'
      - 'data/catalog/ltmd_u1_w7_source_admissibility.csv'
      - 'data/catalog/ltmd_u1_w8_artes_source_admissibility.csv'
      - 'data/catalog/ltmd_u1_w9_processing_inventory.csv'
      - 'data/research/ltmd_u1_ftrl_wave_state.json'
      - 'data/research/ltmd_u1_w1_archival_closure.json'
      - 'data/research/ltmd_u1_w3_archival_closure.json'
      - 'data/research/ltmd_u1_w4_archival_closure.json'
      - 'data/research/ltmd_u1_w5_archival_closure.json'
      - 'data/research/ltmd_u1_w6_archival_closure.json'
      - 'data/research/ltmd_u1_w7_global_evidence.json'
      - 'data/research/ltmd_u1_w7_archival_closure.json'
      - 'data/research/ltmd_u1_w8_global_evidence.json'
      - 'data/research/ltmd_u1_w8_archival_closure.json'
      - 'data/research/ltmd_u1_w9_global_evidence.json'
      - 'data/research/ltmd_u1_w9_archival_closure.json'
      - 'data/research/ltmd_u1_ftrl_completion_ledger.csv'
      - 'data/research/ltmd_u1_ftrl_completion_summary.json'
      - 'scripts/build_ftrl_w1_inputs.py'
      - 'scripts/build_ltmd_u1_ftrl_completion_ledger.py'
      - 'scripts/build_ltmd_u1_ftrl_completion_ledger_v2.py'
      - 'scripts/build_ltmd_u1_ftrl_completion_ledger_v3.py'
      - 'scripts/build_ltmd_u1_ftrl_completion_ledger_v4.py'
      - 'scripts/build_ltmd_u1_ftrl_completion_ledger_v5.py'
      - 'scripts/build_ltmd_u1_ftrl_completion_ledger_v6.py'
      - 'scripts/build_ltmd_u1_ftrl_completion_ledger_v7.py'
      - 'scripts/build_ltmd_u1_ftrl_completion_ledger_v8.py'
      - 'docs/LTMD_U1_FTRL_COMPLETION_LEDGER_0_1.md'
      - 'docs/LTMD_U1_FTRL_COMPLETION_LEDGER_0_2.md'
      - 'docs/LTMD_U1_FTRL_COMPLETION_LEDGER_0_3.md'
      - 'docs/LTMD_U1_FTRL_COMPLETION_LEDGER_0_4.md'
      - 'docs/LTMD_U1_FTRL_COMPLETION_LEDGER_0_5.md'
      - 'docs/LTMD_U1_FTRL_COMPLETION_LEDGER_0_6.md'
      - 'docs/LTMD_U1_FTRL_COMPLETION_LEDGER_0_7.md'
      - 'docs/LTMD_U1_FTRL_COMPLETION_LEDGER_0_8.md'
      - '.github/workflows/validate-ftrl-u1-completion-ledger.yml'
  workflow_dispatch:

concurrency:
  group: ftrl-u1-ledger-${{ github.ref }}
  cancel-in-progress: false

permissions:
  actions: read
  contents: write

jobs:
  validate-ledger:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout exact revision
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'push' && github.ref_name || github.sha }}
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Materialize exact W8 global evidence from validated run artifact
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ ! -f data/research/ltmd_u1_w8_global_evidence.json ]; then
            mkdir -p data/research
            curl -fsSL -H "Authorization: Bearer ${GH_TOKEN}" \
              -H "Accept: application/vnd.github+json" \
              "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/artifacts/9705327893/zip" \
              -o /tmp/ltmd-u1-w8-global-text-free-evidence.zip
            echo "1541d032ee2cc8842f401104a200e8a2b8cb6ebd91eef026d866d825c2b90418  /tmp/ltmd-u1-w8-global-text-free-evidence.zip" | sha256sum -c -
            test "$(unzip -Z1 /tmp/ltmd-u1-w8-global-text-free-evidence.zip | wc -l)" -eq 1
            unzip -p /tmp/ltmd-u1-w8-global-text-free-evidence.zip > data/research/ltmd_u1_w8_global_evidence.json
          fi
      - name: Build exhaustive ledger 0.8
        run: |
          if [ "${GITHUB_EVENT_NAME}" = "push" ]; then
            python scripts/build_ltmd_u1_ftrl_completion_ledger_v8.py
          else
            python scripts/build_ltmd_u1_ftrl_completion_ledger_v8.py --output /tmp/ltmd_u1_ftrl_completion_ledger.csv --summary-output /tmp/ltmd_u1_ftrl_completion_summary.json
          fi
      - name: Require generated outputs to be current on PR
        if: github.event_name == 'pull_request'
        run: |
          diff -u data/research/ltmd_u1_ftrl_completion_ledger.csv /tmp/ltmd_u1_ftrl_completion_ledger.csv
          diff -u data/research/ltmd_u1_ftrl_completion_summary.json /tmp/ltmd_u1_ftrl_completion_summary.json
      - name: Assert exhaustive scientific invariants and W8 retained-source boundary
        run: |
          python - <<'PY'
          import csv, json
          from collections import Counter
          from pathlib import Path
          ledger=Path('data/research/ltmd_u1_ftrl_completion_ledger.csv') if Path('data/research/ltmd_u1_ftrl_completion_ledger.csv').exists() else Path('/tmp/ltmd_u1_ftrl_completion_ledger.csv')
          summary_path=Path('data/research/ltmd_u1_ftrl_completion_summary.json') if Path('data/research/ltmd_u1_ftrl_completion_summary.json').exists() else Path('/tmp/ltmd_u1_ftrl_completion_summary.json')
          rows=list(csv.DictReader(ledger.open(encoding='utf-8',newline=''))); summary=json.loads(summary_path.read_text(encoding='utf-8'))
          g7=list(csv.DictReader(open('data/catalog/ltmd_u1_w7_source_admissibility.csv',encoding='utf-8',newline='')))
          a7={r['viewer_key'] for r in g7 if r['decision']=='ocr_source_admitted'}; r7={r['viewer_key'] for r in g7 if r['decision']!='ocr_source_admitted'}
          g8=list(csv.DictReader(open('data/catalog/ltmd_u1_w8_artes_source_admissibility.csv',encoding='utf-8',newline='')))
          a8={r['viewer_key'] for r in g8 if int(r['source_admissible'])==1}; r8={r['viewer_key'] for r in g8 if int(r['source_admissible'])==0}
          assert len(rows)==542 and len({r['viewer_key'] for r in rows})==542
          assert {r['ledger_version'] for r in rows}=={'LTMD_U1_FTRL_COMPLETION_LEDGER_0.8'}
          assert Counter(r['documentary_disposition'] for r in rows)==Counter({'required_ftrl_processing':524,'active_retention':13,'final_exception':5})
          assert Counter(r['wave'] for r in rows)==Counter({'W1':40,'W2':64,'W3':130,'W4':14,'W5':18,'W6':42,'W7':30,'W8':20,'W9':4,'W10':69,'W11':111})
          w7=[r for r in rows if r['wave']=='W7']; aw7=[r for r in w7 if r['viewer_key'] in a7]; rw7=[r for r in w7 if r['viewer_key'] in r7]
          assert len(aw7)==25 and len(rw7)==5 and sum(int(r['canonical_source_pages']) for r in aw7)==3261
          assert all(r['ftrl_status']=='validated' and r['archival_status']=='archival_complete' for r in aw7)
          assert all(r['ftrl_status']=='blocked_active_retention' and r['archival_status']=='not_started' for r in rw7)
          w8=[r for r in rows if r['wave']=='W8']; aw8=[r for r in w8 if r['viewer_key'] in a8]; rw8=[r for r in w8 if r['viewer_key'] in r8]
          assert len(aw8)==16 and len(rw8)==4
          assert all(r['documentary_disposition']=='required_ftrl_processing' and r['source_ready']=='full' and r['relation_type']=='direct_canonical' for r in aw8)
          assert all(r['is_canonical_processing_object']=='1' and r['ftrl_status']=='validated' and r['archival_status']=='archival_complete' for r in aw8)
          assert sum(int(r['canonical_source_pages']) for r in aw8)==1490
          assert all(r['documentary_disposition']=='active_retention' and r['ftrl_status']=='blocked_active_retention' and r['archival_status']=='not_started' for r in rw8)
          assert all(r['is_canonical_processing_object']=='0' and r['corpus_ready']=='0' and r['ocr_available']=='0' for r in rw8)
          assert summary['schema']=='LTMD_U1_FTRL_COMPLETION_SUMMARY_0.8' and summary['ledger_version']=='LTMD_U1_FTRL_COMPLETION_LEDGER_0.8'
          assert summary['documentary_identities']==542
          assert summary['canonical_processing_objects_by_ftrl_status']=={'validated':261}
          assert summary['canonical_source_pages_by_ftrl_status']=={'validated':42805}
          assert summary['archival_status']=={'archival_complete':289,'not_applicable_final_exception':5,'not_started':248}
          assert summary['ftrl_identity_status']=={'blocked_active_retention':13,'final_exception':5,'pending':235,'validated':289}
          assert summary['corpus_ready_identities']==289 and summary['ocr_available_identities']==289
          assert summary['text_verified_identities']==0 and summary['semantic_ready_identities']==0
          assert summary['strict_identity_progress']['terminal_identities']==294
          assert summary['strict_identity_progress']['remaining_identities']==248
          assert summary['strict_identity_progress']['processable_pending']==235
          assert summary['global_closure']['eligible'] is False and summary['global_closure']['active_retentions']==13
          state=json.load(open('data/research/ltmd_u1_ftrl_wave_state.json',encoding='utf-8'))['waves']['W8']
          assert state['ftrl_status']=='validated' and state['archival_status']=='archival_complete'
          assert state['ftrl_run_id']=='33220988830' and state['ftrl_commit']=='cae2bed8ff79b45675ae194a855abfed9b86aca4'
          assert state['archival_closure_evidence']=='data/research/ltmd_u1_w8_archival_closure.json'
          print(summary['ftrl_identity_status']); print(summary['archival_status'])
          PY
      - name: Commit generated ledger on branch push
        if: github.event_name == 'push'
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/research/ltmd_u1_w8_global_evidence.json data/research/ltmd_u1_ftrl_completion_ledger.csv data/research/ltmd_u1_ftrl_completion_summary.json
          if git diff --cached --quiet; then
            echo 'Generated ledger already current.'
          else
            git commit -m 'FTRL: generate exhaustive U1 completion ledger 0.8'
            git push origin HEAD:${GITHUB_REF_NAME}
          fi

name: Validate exhaustive FTRL-U1 completion ledger

on:
  push:
    branches:
      - 'ftrl/**'
      - 'preservation/**'
    paths:
      - 'scripts/validate_ltmd_u1_ftrl_completion_ledger.py'
      - 'data/research/ltmd_u1_ftrl_completion_ledger.csv'
      - 'data/research/ltmd_u1_ftrl_completion_summary.json'
      - 'data/research/ltmd_u1_ftrl_wave_state.json'
      - 'data/research/ltmd_u1_w11_archival_closure.json'
      - '.github/workflows/validate-ftrl-u1-completion-ledger.yml'
  pull_request:
    branches: [main]
    paths:
      - 'scripts/validate_ltmd_u1_ftrl_completion_ledger.py'
      - 'data/research/ltmd_u1_ftrl_completion_ledger.csv'
      - 'data/research/ltmd_u1_ftrl_completion_summary.json'
      - 'data/research/ltmd_u1_ftrl_wave_state.json'
      - 'data/research/ltmd_u1_w11_archival_closure.json'
      - '.github/workflows/validate-ftrl-u1-completion-ledger.yml'
  workflow_dispatch:

concurrency:
  group: ftrl-u1-ledger-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  validate-ledger:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout exact revision
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event_name == 'push' && github.ref_name || github.sha }}
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Compile canonical ledger validator
        run: python -m py_compile scripts/validate_ltmd_u1_ftrl_completion_ledger.py
      - name: Validate committed canonical FTRL-U1 state
        run: python scripts/validate_ltmd_u1_ftrl_completion_ledger.py

name: Validate exhaustive FTRL-U1 completion ledger

on:
  push:
    branches:
      - 'ftrl/**'
      - 'preservation/**'
      - 'closure/**'
    paths:
      - 'scripts/build_ltmd_u1_ftrl_completion_ledger.py'
      - 'scripts/build_ltmd_u1_ftrl_completion_ledger_v2.py'
      - 'data/catalog/ltmd_u1_w3_spanish_processing_inventory.csv'
      - 'data/research/ltmd_u1_ftrl_wave_state.json'
      - 'data/research/ltmd_u1_w1_archival_closure.json'
      - 'data/research/ltmd_u1_w3_archival_closure.json'
      - 'data/research/ltmd_u1_w5_archival_closure.json'
      - '.github/workflows/validate-ftrl-u1-completion-ledger.yml'
  pull_request:
    branches: [main]
    paths:
      - 'data/catalog/**'
      - 'data/expansion/**'
      - 'data/research/ltmd_u1_ftrl_wave_state.json'
      - 'data/research/ltmd_u1_w1_archival_closure.json'
      - 'data/research/ltmd_u1_w3_archival_closure.json'
      - 'data/research/ltmd_u1_w5_archival_closure.json'
      - 'data/research/ltmd_u1_ftrl_completion_ledger.csv'
      - 'data/research/ltmd_u1_ftrl_completion_summary.json'
      - 'scripts/build_ftrl_w1_inputs.py'
      - 'scripts/build_ltmd_u1_ftrl_completion_ledger.py'
      - 'scripts/build_ltmd_u1_ftrl_completion_ledger_v2.py'
      - '.github/workflows/validate-ftrl-u1-completion-ledger.yml'
  workflow_dispatch:

concurrency:
  group: ftrl-u1-ledger-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  validate-ledger:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout exact revision
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'push' && github.ref_name || github.sha }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Rebuild exhaustive ledger 0.2
        run: |
          python scripts/build_ltmd_u1_ftrl_completion_ledger_v2.py \
            --output /tmp/ledger.csv \
            --summary-output /tmp/summary.json
          diff -u data/research/ltmd_u1_ftrl_completion_ledger.csv /tmp/ledger.csv
          diff -u data/research/ltmd_u1_ftrl_completion_summary.json /tmp/summary.json

      - name: Assert exhaustive scientific invariants and W1/W3/W5 archival closure
        run: |
          python - <<'PY'
          import csv, json
          from collections import Counter
          from pathlib import Path
          rows=list(csv.DictReader(Path('data/research/ltmd_u1_ftrl_completion_ledger.csv').open(encoding='utf-8',newline='')))
          summary=json.loads(Path('data/research/ltmd_u1_ftrl_completion_summary.json').read_text())
          assert len(rows)==542 and len({r['viewer_key'] for r in rows})==542
          assert {r['ledger_version'] for r in rows}=={'LTMD_U1_FTRL_COMPLETION_LEDGER_0.2'}
          assert Counter(r['documentary_disposition'] for r in rows)==Counter({'required_ftrl_processing':524,'active_retention':13,'final_exception':5})
          assert Counter(r['wave'] for r in rows)==Counter({'W1':40,'W2':64,'W3':130,'W4':14,'W5':18,'W6':42,'W7':30,'W8':20,'W9':4,'W10':69,'W11':111})

          for wave,count in [('W1',40),('W3',130),('W5',18)]:
              subset=[r for r in rows if r['wave']==wave]
              assert len(subset)==count
              assert Counter(r['ftrl_status'] for r in subset)==Counter({'validated':count})
              assert Counter(r['archival_status'] for r in subset)==Counter({'archival_complete':count})
              assert sum(int(r['corpus_ready']) for r in subset)==count
              assert sum(int(r['ocr_available']) for r in subset)==count
              assert sum(int(r['text_verified']) for r in subset)==0
              assert sum(int(r['semantic_ready']) for r in subset)==0

          w3=[r for r in rows if r['wave']=='W3']
          assert Counter(r['source_ready'] for r in w3)==Counter({'full':123,'partial':7})
          assert Counter(r['relation_type'] for r in w3)==Counter({'direct_canonical':107,'partial_canonical_explicit_gap':7,'exact_byte_alias':8,'paired_route_alias_2018_to_2019':8})
          assert sum(r['is_canonical_processing_object']=='1' for r in w3)==114
          assert sum(int(r['canonical_source_pages'] or 0) for r in w3 if r['is_canonical_processing_object']=='1')==20765
          assert sum(int(r['persistent_unresolved_source_gaps'] or 0) for r in w3 if r['is_canonical_processing_object']=='1')==8
          assert {r['ftrl_run_id'] for r in w3}=={'32853375619'}
          assert {r['ftrl_commit'] for r in w3}=={'2a55ec09124054729e9c45a2285686cf4abf8776'}

          closure=json.loads(Path('data/research/ltmd_u1_w3_archival_closure.json').read_text())
          assert closure['state']['archival_complete'] is True
          assert closure['state']['text_verified'] is False
          assert closure['state']['semantic_ready'] is False

          assert summary['schema']=='LTMD_U1_FTRL_COMPLETION_SUMMARY_0.2'
          assert summary['documentary_identities']==542
          assert summary['canonical_processing_objects_by_ftrl_status']=={'validated':165}
          assert summary['canonical_source_pages_by_ftrl_status']=={'validated':29934}
          assert summary['ftrl_identity_status']=={'blocked_active_retention':13,'final_exception':5,'pending':336,'validated':188}
          assert summary['archival_status']=={'archival_complete':188,'not_applicable_final_exception':5,'not_started':349}
          assert summary['corpus_ready_identities']==188
          assert summary['ocr_available_identities']==188
          assert summary['text_verified_identities']==0
          assert summary['semantic_ready_identities']==0
          assert summary['global_closure']['eligible'] is False
          assert summary['global_closure']['active_retentions']==13
          PY

name: Validate exhaustive FTRL-U1 completion ledger

on:
  push:
    branches:
      - 'ftrl/**'
      - 'preservation/**'
    paths:
      - 'scripts/build_ltmd_u1_ftrl_completion_ledger.py'
      - 'scripts/build_ltmd_u1_ftrl_completion_ledger_v2.py'
      - 'scripts/build_ltmd_u1_ftrl_completion_ledger_v3.py'
      - 'scripts/build_ltmd_u1_ftrl_completion_ledger_v4.py'
      - 'data/catalog/ltmd_u1_w3_spanish_processing_inventory.csv'
      - 'data/catalog/ltmd_u1_w6_geography_atlas_processing_inventory.csv'
      - 'data/research/ltmd_u1_ftrl_wave_state.json'
      - 'data/research/ltmd_u1_w1_archival_closure.json'
      - 'data/research/ltmd_u1_w3_archival_closure.json'
      - 'data/research/ltmd_u1_w5_archival_closure.json'
      - 'data/research/ltmd_u1_w6_archival_closure.json'
      - 'docs/LTMD_U1_FTRL_COMPLETION_LEDGER_0_1.md'
      - 'docs/LTMD_U1_FTRL_COMPLETION_LEDGER_0_2.md'
      - 'docs/LTMD_U1_FTRL_COMPLETION_LEDGER_0_3.md'
      - 'docs/LTMD_U1_FTRL_COMPLETION_LEDGER_0_4.md'
      - '.github/workflows/validate-ftrl-u1-completion-ledger.yml'
  pull_request:
    branches: [main]
    paths:
      - 'data/catalog/ltmd_u1_coverage.csv'
      - 'data/catalog/ltmd_u1_retained_source_register.csv'
      - 'data/catalog/ltmd_u1_w3_spanish_processing_inventory.csv'
      - 'data/catalog/ltmd_u1_w5_history_processing_inventory.csv'
      - 'data/catalog/ltmd_u1_w6_geography_atlas_processing_inventory.csv'
      - 'data/catalog/ciencias_naturales_family_asset_readiness.csv'
      - 'data/catalog/ciencias_naturales_pending_page_manifest.csv'
      - 'data/catalog/ltmd_u1_w1_1966_page_manifest.csv'
      - 'data/catalog/ltmd_u1_w1_1966_page_manifest_summary.csv'
      - 'data/catalog/cn5_pilot_sha/**'
      - 'data/expansion/cn46_page_manifest.csv'
      - 'data/expansion/cn46_page_manifest_summary.csv'
      - 'data/research/ltmd_u1_ftrl_wave_state.json'
      - 'data/research/ltmd_u1_w1_archival_closure.json'
      - 'data/research/ltmd_u1_w3_archival_closure.json'
      - 'data/research/ltmd_u1_w5_archival_closure.json'
      - 'data/research/ltmd_u1_w6_archival_closure.json'
      - 'data/research/ltmd_u1_ftrl_completion_ledger.csv'
      - 'data/research/ltmd_u1_ftrl_completion_summary.json'
      - 'scripts/build_ftrl_w1_inputs.py'
      - 'scripts/build_ltmd_u1_ftrl_completion_ledger.py'
      - 'scripts/build_ltmd_u1_ftrl_completion_ledger_v2.py'
      - 'scripts/build_ltmd_u1_ftrl_completion_ledger_v3.py'
      - 'scripts/build_ltmd_u1_ftrl_completion_ledger_v4.py'
      - 'docs/LTMD_U1_FTRL_COMPLETION_LEDGER_0_1.md'
      - 'docs/LTMD_U1_FTRL_COMPLETION_LEDGER_0_2.md'
      - 'docs/LTMD_U1_FTRL_COMPLETION_LEDGER_0_3.md'
      - 'docs/LTMD_U1_FTRL_COMPLETION_LEDGER_0_4.md'
      - '.github/workflows/validate-ftrl-u1-completion-ledger.yml'
  workflow_dispatch:

concurrency:
  group: ftrl-u1-ledger-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  validate-ledger:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout exact revision
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'push' && github.ref_name || github.sha }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Build exhaustive ledger 0.4
        run: |
          if [ "${GITHUB_EVENT_NAME}" = "push" ]; then
            python scripts/build_ltmd_u1_ftrl_completion_ledger_v4.py
          else
            python scripts/build_ltmd_u1_ftrl_completion_ledger_v4.py --output /tmp/ltmd_u1_ftrl_completion_ledger.csv --summary-output /tmp/ltmd_u1_ftrl_completion_summary.json
          fi

      - name: Require generated outputs to be current on PR
        if: github.event_name == 'pull_request'
        run: |
          diff -u data/research/ltmd_u1_ftrl_completion_ledger.csv /tmp/ltmd_u1_ftrl_completion_ledger.csv
          diff -u data/research/ltmd_u1_ftrl_completion_summary.json /tmp/ltmd_u1_ftrl_completion_summary.json

      - name: Assert exhaustive scientific invariants and W1/W3/W5/W6 archive closure
        run: |
          python - <<'PY'
          import csv, json
          from collections import Counter
          from pathlib import Path

          ledger = Path('data/research/ltmd_u1_ftrl_completion_ledger.csv') if Path('data/research/ltmd_u1_ftrl_completion_ledger.csv').exists() else Path('/tmp/ltmd_u1_ftrl_completion_ledger.csv')
          summary_path = Path('data/research/ltmd_u1_ftrl_completion_summary.json') if Path('data/research/ltmd_u1_ftrl_completion_summary.json').exists() else Path('/tmp/ltmd_u1_ftrl_completion_summary.json')
          rows = list(csv.DictReader(ledger.open(encoding='utf-8', newline='')))
          summary = json.loads(summary_path.read_text(encoding='utf-8'))

          assert len(rows) == 542
          assert len({r['viewer_key'] for r in rows}) == 542
          assert {r['ledger_version'] for r in rows} == {'LTMD_U1_FTRL_COMPLETION_LEDGER_0.4'}
          assert Counter(r['documentary_disposition'] for r in rows) == Counter({'required_ftrl_processing': 524, 'active_retention': 13, 'final_exception': 5})
          assert Counter(r['wave'] for r in rows) == Counter({'W1': 40, 'W2': 64, 'W3': 130, 'W4': 14, 'W5': 18, 'W6': 42, 'W7': 30, 'W8': 20, 'W9': 4, 'W10': 69, 'W11': 111})

          for wave, count in (('W1', 40), ('W3', 130), ('W5', 18), ('W6', 42)):
              wr = [r for r in rows if r['wave'] == wave]
              assert len(wr) == count
              assert Counter(r['ftrl_status'] for r in wr) == Counter({'validated': count})
              assert Counter(r['archival_status'] for r in wr) == Counter({'archival_complete': count})
              assert sum(int(r['corpus_ready']) for r in wr) == count
              assert sum(int(r['ocr_available']) for r in wr) == count
              assert sum(int(r['text_verified']) for r in wr) == 0
              assert sum(int(r['semantic_ready']) for r in wr) == 0

          # Preserve all W3 topology assertions from ledger 0.3.
          w3 = [r for r in rows if r['wave'] == 'W3']
          assert Counter(r['source_ready'] for r in w3) == Counter({'full': 123, 'partial': 7})
          assert Counter(r['relation_type'] for r in w3) == Counter({'direct_canonical': 107, 'partial_canonical_explicit_gap': 7, 'exact_byte_alias': 8, 'paired_route_alias_2018_to_2019': 8})
          assert sum(r['is_canonical_processing_object'] == '1' for r in w3) == 114
          assert sum(int(r['canonical_source_pages'] or 0) for r in w3 if r['is_canonical_processing_object'] == '1') == 20765
          assert sum(int(r['persistent_unresolved_source_gaps'] or 0) for r in w3 if r['is_canonical_processing_object'] == '1') == 8

          w6 = [r for r in rows if r['wave'] == 'W6']
          assert Counter(r['source_ready'] for r in w6) == Counter({'full': 42})
          assert Counter(r['relation_type'] for r in w6) == Counter({'direct_canonical': 36, 'direct_canonical_reconciled_gap': 1, 'route_alias_to_2019': 5})
          assert sum(r['is_canonical_processing_object'] == '1' for r in w6) == 37
          assert sum(int(r['canonical_source_pages'] or 0) for r in w6 if r['is_canonical_processing_object'] == '1') == 5258
          assert sum(int(r['persistent_unresolved_source_gaps'] or 0) for r in w6) == 0

          assert summary['schema'] == 'LTMD_U1_FTRL_COMPLETION_SUMMARY_0.4'
          assert summary['ledger_version'] == 'LTMD_U1_FTRL_COMPLETION_LEDGER_0.4'
          assert summary['documentary_identities'] == 542
          assert summary['canonical_processing_objects_by_ftrl_status'] == {'validated': 202}
          assert summary['canonical_source_pages_by_ftrl_status'] == {'validated': 35192}
          assert summary['archival_status'] == {'archival_complete': 230, 'not_applicable_final_exception': 5, 'not_started': 307}
          assert summary['ftrl_identity_status'] == {'blocked_active_retention': 13, 'final_exception': 5, 'pending': 294, 'validated': 230}
          assert summary['corpus_ready_identities'] == 230
          assert summary['ocr_available_identities'] == 230
          assert summary['text_verified_identities'] == 0
          assert summary['semantic_ready_identities'] == 0
          assert summary['global_closure']['eligible'] is False
          assert summary['global_closure']['active_retentions'] == 13
          assert summary['strict_identity_progress']['terminal_identities'] == 235
          assert summary['strict_identity_progress']['remaining_identities'] == 307
          assert summary['strict_identity_progress']['processable_pending'] == 294
          print(summary['ftrl_identity_status'])
          print(summary['archival_status'])
          PY

      - name: Commit generated ledger on branch push
        if: github.event_name == 'push'
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/research/ltmd_u1_ftrl_completion_ledger.csv data/research/ltmd_u1_ftrl_completion_summary.json
          if git diff --cached --quiet; then
            echo 'Generated ledger already current.'
          else
            git commit -m 'FTRL: generate exhaustive U1 completion ledger 0.4'
            git push origin HEAD:${GITHUB_REF_NAME}
          fi

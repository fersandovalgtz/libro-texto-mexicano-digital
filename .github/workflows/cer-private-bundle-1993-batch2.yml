name: Encrypted private bundle — 1993 CER batch 2

on:
  push:
    paths: ['.github/workflows/cer-private-bundle-1993-batch2.yml']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  bundle:
    runs-on: ubuntu-24.04
    env:
      OMP_THREAD_LIMIT: '1'
    steps:
      - name: Install exact production OCR
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq tesseract-ocr tesseract-ocr-spa python3-pil
          tesseract --version | head -1 | tee version.txt
          grep -F 'tesseract 5.3.4' version.txt

      - name: Write one-use public certificate
        run: |
          cat > cert.pem <<'PEM'
          -----BEGIN CERTIFICATE-----
          MIIEgTCCAumgAwIBAgIUIoASQyQhot6+eTYdereDqdQl1wQwDQYJKoZIhvcNAQEL
          BQAwUDEnMCUGA1UEAwweTFRNRCBDRVIgMTk5MyBiYXRjaDIgdHJhbnNwb3J0MSUw
          IwYDVQQKDBxMaWJybyBUZXh0byBNZXhpY2FubyBEaWdpdGFsMB4XDTI2MDgxNTE2
          NDUzMVoXDTI2MDgxNzE2NDUzMVowUDEnMCUGA1UEAwweTFRNRCBDRVIgMTk5MyBi
          YXRjaDIgdHJhbnNwb3J0MSUwIwYDVQQKDBxMaWJybyBUZXh0byBNZXhpY2FubyBE
          aWdpdGFsMIIBojANBgkqhkiG9w0BAQEFAAOCAY8AMIIBigKCAYEAutQV3+NMRauk
          bdJGhY/vDMEhBLWe5SMK4qWEHH8jpZHcrW7rHAD2aC9E5EUBLPbf36m9wI/6aDrj
          uduWp74pPRwMk2GH67VRctpgqQbZwn2uKBFp433vcJDPj5NkouVAcLL/xF80BeYA
          bty3sGP5ttZOODQCwqidz5PlJMIBuysqs6z6VLwXwsqvcgSnLdu8Knn9sWq/3xnz
          6jhOqukjax7C+BP55iKT8EI6qsw/I8/IYMTeHEqW4qqtUYI71RpbH8+OHFq0Esio
          F403GfU3kocS1DUmAhtKh2arqoZ8ZmaKakDgFaJPp0/jpisryszIE5CwPDhemAf6
          Q4xGmL7aqaEviXCWVjZzgB4wwchZxN3Cu+UnRVKTxvH3Vtx4Wh5HbgBbLcdGdhWz
          0G3p5zKo1/IWD0K8pyWqiNwFnBmYrcQx62BgXzDBrZwMfp6zoalMUft27DReHs+Y
          tYDH+uCbH+mg2SFewwtFC6N8qY8k8Xs9sqJYQQyyRGi4LF/aeaZ7AgMBAAGjUzBR
          MB0GA1UdDgQWBBRbkvH/7MqcmwzRgvJSGxgokUB9bTAfBgNVHSMEGDAWgBRbkvH/
          7MqcmwzRgvJSGxgokUB9bTAPBgNVHRMBAf8EBTADAQH/MA0GCSqGSIb3DQEBCwUA
          A4IBgQBk9Oocd1yAqPNrR330mK3hbaZ2z+d07/mzxSQKqOcUgPOGbEOGwP17ZdA2
          L0WKZ1scvmLCqWgZqDPB4tJyChFecJ+Oq18f4zgiv+tp1SMWh7/rpY6znNh8vRCh
          SP32I5t9j+ZtL1+vmOK7NRqYvIo5RW2JfsTkPIQA2pAeSTsGtkREtG/vE8+e/O8z
          u5dRfIrtVnfIVH5zu0HkpF7x0M1HoVYycbhXGEqvPjk5p2kli/ugPdscTXfXaVyw
          qM5BH7eWGQIJJ7aeUC5x7A+X4rkGW/xxKM0/LED7RH6D6PbeQ12ZeXkIp0Mhj0mh
          dj25GcZuHTC8znEZTEVv/yuf6ruH/G1g5QWtVGb2s5L6+AzBHoPWMNqg5ZFS4Dwp
          rxj6bzpI4LMFUEZFNmA5j7XLQXUrt7lFiTc47PKms8rhbZtTqi9YBGyHonOECttr
          AJjag44X075Wd8lMyvk7m1BTIWmiE9AIAQ3Ha+Xt6IibJL+f/Z6jNp1w8pzr8zGU
          MuzvwJk=
          -----END CERTIFICATE-----
          PEM
          openssl x509 -in cert.pem -noout -fingerprint -sha256

      - name: Acquire source pages and full-page production OCR
        run: |
          set -euo pipefail
          mkdir -p private_bundle
          for n in 036 059 075; do
            curl -fsSL --retry 3 --connect-timeout 15 --max-time 90 "https://historico.conaliteg.gob.mx/c/H1993P5CI200/${n}.jpg" -o "private_bundle/${n}.jpg"
          done
          python3 - <<'PY'
          from PIL import Image
          for n in ('036','059','075'):
              with Image.open(f'private_bundle/{n}.jpg') as im:
                  assert im.size == (797,1045), (n, im.size)
          PY
          for n in 036 059 075; do
            tesseract "private_bundle/${n}.jpg" "private_bundle/${n}" -l spa --psm 3 txt tsv >/dev/null 2>"private_bundle/${n}.stderr"
          done

      - name: Write manifests
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib,json
          from pathlib import Path
          pages=[('LTMD-CER-1993-Q1_2','036','LTMD-CN5-G1993-VP036'),('LTMD-CER-1993-Q2_1','059','LTMD-CN5-G1993-VP059'),('LTMD-CER-1993-Q2_2','075','LTMD-CN5-G1993-VP075')]
          ver=Path('version.txt').read_text().strip(); pub=[]
          for sid,n,pid in pages:
              b=Path(f'private_bundle/{n}.jpg').read_bytes()
              pub.append({'sample_id':sid,'page_id':pid,'viewer_page':int(n),'selected_psm':3,'tesseract_version':ver,'source_sha256':hashlib.sha256(b).hexdigest(),'source_bytes':len(b),'full_page_text_chars':len(Path(f'private_bundle/{n}.txt').read_text(encoding='utf-8')),'tsv_chars':len(Path(f'private_bundle/{n}.tsv').read_text(encoding='utf-8'))})
          Path('private_bundle/private_manifest.json').write_text(json.dumps({'pages':pub},ensure_ascii=False,indent=2),encoding='utf-8')
          Path('manifest.json').write_text(json.dumps({'transport':'encrypted tar bundle containing private source JPEG + production full-page TXT/TSV','certificate_fingerprint_sha256':'3F:72:D5:8A:F2:B9:AD:08:42:25:1F:C8:89:71:4E:59:FC:09:53:E7:04:36:F6:D6:BF:96:71:8D:72:65:5A:F7','pages':pub},ensure_ascii=False,indent=2),encoding='utf-8')
          PY

      - name: Encrypt and erase plaintext
        run: |
          set -euo pipefail
          tar -czf private_bundle.tar.gz private_bundle/
          openssl cms -encrypt -binary -aes256 -in private_bundle.tar.gz -outform DER -out payload.p7m cert.pem
          sha256sum payload.p7m > ciphertext.sha256
          rm -rf private_bundle private_bundle.tar.gz cert.pem version.txt

      - name: Upload ciphertext and manifest only
        uses: actions/upload-artifact@v4
        with:
          name: ltmd-cer-1993-batch2-private-bundle-encrypted
          path: |
            payload.p7m
            manifest.json
            ciphertext.sha256
          retention-days: 1
          if-no-files-found: error

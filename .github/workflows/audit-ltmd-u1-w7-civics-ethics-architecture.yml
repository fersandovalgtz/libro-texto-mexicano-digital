name: audit-ltmd-u1-w7-civics-ethics-architecture

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/audit-ltmd-u1-w7-civics-ethics-architecture.yml'

permissions:
  contents: write

jobs:
  audit:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Freeze W7 scope
        run: python3 scripts/build_ltmd_u1_w7_civics_ethics_scope.py
      - name: Audit W7 viewer architecture
        run: python3 scripts/audit_ltmd_u1_w7_civics_ethics_architecture.py
      - name: Publish W7 source-first scope and architecture race-safely
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/w7-architecture
          cp data/catalog/ltmd_u1_w7_scope.csv /tmp/w7-architecture/
          cp data/catalog/ltmd_u1_w7_scope.md /tmp/w7-architecture/
          cp data/catalog/ltmd_u1_w7_viewer_architecture.csv /tmp/w7-architecture/
          cp data/catalog/ltmd_u1_w7_viewer_architecture.md /tmp/w7-architecture/
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          for attempt in 1 2 3; do
            git fetch origin main
            git reset --hard origin/main
            cp /tmp/w7-architecture/* data/catalog/
            git add data/catalog/ltmd_u1_w7_scope.csv data/catalog/ltmd_u1_w7_scope.md data/catalog/ltmd_u1_w7_viewer_architecture.csv data/catalog/ltmd_u1_w7_viewer_architecture.md
            if git diff --cached --quiet; then exit 0; fi
            git commit -m 'Publish LTMD-U1 W7 Civics Ethics scope and architecture'
            if git push origin HEAD:main; then exit 0; fi
            sleep $((attempt * 2))
          done
          exit 1

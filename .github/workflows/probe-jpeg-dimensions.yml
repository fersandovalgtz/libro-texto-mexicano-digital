name: Probe pilot JPEG dimensions

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/probe-jpeg-dimensions.yml'
      - 'scripts/build_page_manifest.py'
      - 'scripts/probe_jpeg_dimensions.py'
      - 'data/book_inventory.csv'

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build page manifest
        run: python scripts/build_page_manifest.py
      - name: Probe ranged JPEG headers
        run: python scripts/probe_jpeg_dimensions.py
      - name: Show result
        run: cat data/derived/qc_jpeg_dimensions.csv
      - name: Upload result
        uses: actions/upload-artifact@v7
        with:
          name: qc-jpeg-dimensions
          path: data/derived/qc_jpeg_dimensions.csv
          if-no-files-found: error
          retention-days: 30

name: Locate early TOC candidates

on:
  workflow_dispatch:
  push:
    paths:
      - 'scripts/locate_toc_candidates.py'
      - '.github/workflows/locate-toc.yml'

permissions:
  contents: read

jobs:
  locate:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      OMP_THREAD_LIMIT: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Install Spanish Tesseract model
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq tesseract-ocr tesseract-ocr-spa
      - name: Build page manifest
        run: python scripts/build_page_manifest.py
      - name: Locate TOC candidates
        run: python scripts/locate_toc_candidates.py --pages 20 --workers 2
      - name: Upload derived candidates only
        uses: actions/upload-artifact@v4
        with:
          name: toc-candidates
          path: data/derived/toc_candidates.csv
          retention-days: 30

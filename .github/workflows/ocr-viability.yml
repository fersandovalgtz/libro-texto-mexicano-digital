name: OCR viability benchmark

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/ocr-viability.yml'
      - 'scripts/build_page_manifest.py'
      - 'scripts/ocr_sample_metrics.py'
      - 'data/book_inventory.csv'

permissions:
  contents: read

jobs:
  benchmark:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Spanish Tesseract model
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq tesseract-ocr tesseract-ocr-spa
          tesseract --version | head -1
      - name: Build page manifest
        run: python scripts/build_page_manifest.py
      - name: Run OCR viability benchmark
        run: python scripts/ocr_sample_metrics.py --lang spa --psm 3 --workers 4
      - name: Show metrics
        run: cat data/derived/ocr_sample_metrics.csv
      - name: Upload metrics only
        uses: actions/upload-artifact@v4
        with:
          name: ocr-sample-metrics
          path: data/derived/ocr_sample_metrics.csv
          if-no-files-found: error
          retention-days: 30

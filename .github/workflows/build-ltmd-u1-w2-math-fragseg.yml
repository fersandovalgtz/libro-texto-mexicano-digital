name: build-ltmd-u1-w2-math-fragseg

on:
  workflow_dispatch:
  workflow_run:
    workflows:
      - build-ltmd-u1-w2-math-pagestruct
    types: [completed]

permissions:
  contents: write

jobs:
  matrix:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-24.04
    outputs:
      viewers: ${{ steps.make.outputs.viewers }}
    steps:
      - uses: actions/checkout@v4
      - id: make
        shell: bash
        run: |
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import csv,json
          rows=list(csv.DictReader(open('data/catalog/ltmd_u1_w2_math_page_structure.csv',encoding='utf-8')))
          keys=sorted({r['viewer_key'] for r in rows})
          assert len(keys)==57, len(keys)
          assert {r['classifier_version'] for r in rows}=={'PAGESTRUCT_LTMD_U1_W2_MATH_0.2'}
          eligible={k:0 for k in keys}
          for r in rows:
              if r['primary_structure'] in {'textual','mixed_text_image'}:
                  eligible[r['viewer_key']]+=1
          bad=[k for k,n in eligible.items() if n==0]
          if bad: raise SystemExit(f'W2 FRAGSEG gate closed: canonical viewers without eligible pages={bad}')
          print('viewers='+json.dumps(keys,separators=(',',':')))
          PY

  fragment:
    needs: matrix
    strategy:
      fail-fast: false
      max-parallel: 8
      matrix:
        viewer_key: ${{ fromJSON(needs.matrix.outputs.viewers) }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install Spanish Tesseract
        run: |
          sudo apt-get update
          sudo apt-get install -y tesseract-ocr tesseract-ocr-spa
      - name: Segment one canonical Mathematics viewer
        run: python3 scripts/segment_ltmd_u1_w2_math_fragments_v02.py --viewer-key '${{ matrix.viewer_key }}'
      - uses: actions/upload-artifact@v4
        with:
          name: ltmd-u1-w2-math-fragments-${{ matrix.viewer_key }}
          path: data/work/ltmd_u1_w2_math_fragments/*.csv
          if-no-files-found: error
          retention-days: 1

  combine:
    needs: fragment
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@v4
        with:
          pattern: ltmd-u1-w2-math-fragments-*
          path: data/work/ltmd_u1_w2_math_fragments
          merge-multiple: true
      - name: Combine exact 57-canonical-viewer FRAGSEG 0.2 layer
        run: python3 scripts/combine_ltmd_u1_w2_math_fragment_shards_v02.py
      - name: Publish W2 FRAGSEG 0.2 race-safely
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/ltmd-u1-w2-math-fragseg
          cp data/catalog/ltmd_u1_w2_math_fragment_manifest.csv /tmp/ltmd-u1-w2-math-fragseg/
          cp data/catalog/ltmd_u1_w2_math_fragment_manifest_summary.csv /tmp/ltmd-u1-w2-math-fragseg/
          cp data/catalog/ltmd_u1_w2_math_fragment_sequence_gaps.csv /tmp/ltmd-u1-w2-math-fragseg/
          cp data/catalog/ltmd_u1_w2_math_fragment_manifest.md /tmp/ltmd-u1-w2-math-fragseg/
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          for attempt in 1 2 3; do
            git fetch origin main
            git reset --hard origin/main
            cp /tmp/ltmd-u1-w2-math-fragseg/* data/catalog/
            git add data/catalog/ltmd_u1_w2_math_fragment_manifest.csv data/catalog/ltmd_u1_w2_math_fragment_manifest_summary.csv data/catalog/ltmd_u1_w2_math_fragment_sequence_gaps.csv data/catalog/ltmd_u1_w2_math_fragment_manifest.md
            if git diff --cached --quiet; then exit 0; fi
            git commit -m 'Publish LTMD-U1 W2 mathematics FRAGSEG 0.2 layer'
            if git push origin HEAD:main; then exit 0; fi
            sleep $((attempt * 2))
          done
          exit 1

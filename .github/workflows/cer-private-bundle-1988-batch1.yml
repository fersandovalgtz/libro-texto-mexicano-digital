name: Encrypted private bundle — 1988 CER batch 1

on:
  push:
    paths: ['.github/workflows/cer-private-bundle-1988-batch1.yml']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  bundle:
    runs-on: ubuntu-24.04
    env:
      OMP_THREAD_LIMIT: '1'
    steps:
      - name: Install exact production OCR
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq tesseract-ocr tesseract-ocr-spa python3-pil
          tesseract --version | head -1 | tee version.txt
          grep -F 'tesseract 5.3.4' version.txt

      - name: Write one-use public certificate
        run: |
          cat > cert.pem <<'PEM'
          -----BEGIN CERTIFICATE-----
          MIIEgTCCAumgAwIBAgIUDdPDPrlYrDl7W9E1zJ5q7NoYqZkwDQYJKoZIhvcNAQEL
          BQAwUDEnMCUGA1UEAwweTFRNRCBDRVIgMTk4OCBiYXRjaDEgdHJhbnNwb3J0MSUw
          IwYDVQQKDBxMaWJybyBUZXh0byBNZXhpY2FubyBEaWdpdGFsMB4XDTI2MDgxNTE2
          MDY1N1oXDTI2MDgxNzE2MDY1N1owUDEnMCUGA1UEAwweTFRNRCBDRVIgMTk4OCBi
          YXRjaDEgdHJhbnNwb3J0MSUwIwYDVQQKDBxMaWJybyBUZXh0byBNZXhpY2FubyBE
          aWdpdGFsMIIBojANBgkqhkiG9w0BAQEFAAOCAY8AMIIBigKCAYEAmGuEUgZzhSBM
          lGSOaWvr/Quwk0W8sYUbRYT0Fl8VqD/zMcy1Vjpc5NWmTV6FBzSnAeL/PVXOHZQl
          zXOftE8aKirDtXeyYLCcgYn9sZZM96Rn9h3mx9zTKUci0WNr6rMTwT5JKcuRvBAn
          AlshAq+EGixsQHETEU6g+Z03JArdz6+SJU4QaTjKXVPvx1JwEccwJeQjr7M+2JXg
          Sq1HTe8xxB1JmfY0qLZfk3yHQWfy7oB2h1g6UIUwnwQHYEM9UjE9Y4O/PgvFvw6n
          W/eRRVjtk3VA2nbz2EzKKHI0p9ZYr/+eOGxxdwXdY4qM28T17aF8JLfukIs39g3v
          6lPTVJR/7SYU3hb0drzr27796QQSMLna9kf+GTOWCRTZ/NwEgUxfzICdUDCqQe3T
          BJih6DD549MEEH91faTeVgNo5vYSvqD0ksskN100K2APe0W9LTtyX+xQ+37SswkD
          6v2O0iVCNn/9Vf0v1KCcRpTG6ukqBIr7ucAtKrbc87u6TB0vly7LAgMBAAGjUzBR
          MB0GA1UdDgQWBBQAZg7xJgGG6MLwPyZuRyBMPiU16jAfBgNVHSMEGDAWgBQAZg7x
          JgGG6MLwPyZuRyBMPiU16jAPBgNVHRMBAf8EBTADAQH/MA0GCSqGSIb3DQEBCwUA
          A4IBgQBVrdbEinxEnd0Y1pYuw/1viLMLcbauVdBpb7XEoB+KF1euHllJLcF4QyLw
          Z2Rt+rp7a7MHWeEhmVYvZBXwlln3b+H1JlPYKIYvfsAWnyaZySKtBw6YVuusuy+H
          HiJ3jZUPB7UoOzHgB6ONhasVB8JOdtFZIPMaynfvrCXJFHmnERFmFlfNq/iJOPy0
          xvLoLuoCJ1G/urExJbTkITzQ2q1PfYJLbjK6MlubruemcNS0kXs6g9B9X9bpQCTW
          bjcqdxEk99f1kKaT2ow8iRI056wNEqzNbNPBTwTcMgo9R2yXAFCB85SSizJgXORV
          aUHK5vQLjvOq/r8ia5IOeNHUgQQEhwVFV5yg9M1WdYBDhMOdo3nr7FDrLCH10brP
          mJR3Mfs2cgCkQUtgNu8etkwzalrN0CapCInpc9Igmi6fzrVZoA92OZQTxWi67j76
          +o3wT1glCgLtyggNYzP06f81b6sUWAoY3b24kh+b2L5cIGVZAxzf/pom+Bcsu0tA
          /rGdhto=
          -----END CERTIFICATE-----
          PEM
          openssl x509 -in cert.pem -noout -fingerprint -sha256

      - name: Acquire source pages and full-page production OCR
        run: |
          set -euo pipefail
          mkdir -p private_bundle
          for n in 002 003 016; do
            curl -fsSL --retry 3 --connect-timeout 15 --max-time 90 "https://historico.conaliteg.gob.mx/c/H1988P5CI123/${n}.jpg" -o "private_bundle/${n}.jpg"
          done
          python3 - <<'PY'
          from PIL import Image
          for n in ('002','003','016'):
              with Image.open(f'private_bundle/{n}.jpg') as im:
                  assert im.size == (670,993), (n, im.size)
          PY
          for n in 002 003 016; do
            tesseract "private_bundle/${n}.jpg" "private_bundle/${n}" -l spa --psm 3 txt tsv >/dev/null 2>"private_bundle/${n}.stderr"
          done

      - name: Write manifests
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib,json
          from pathlib import Path
          pages=[
            ('LTMD-CER-1988-LEGAL','002','LTMD-CN5-G1988-VP002','legal'),
            ('LTMD-CER-1988-TOC','003','LTMD-CN5-G1988-VP003','toc'),
            ('LTMD-CER-1988-Q1_1','016','LTMD-CN5-G1988-VP016','q1_1'),
          ]
          ver=Path('version.txt').read_text().strip(); pub=[]
          for sid,n,pid,role in pages:
              b=Path(f'private_bundle/{n}.jpg').read_bytes()
              pub.append({'sample_id':sid,'page_id':pid,'role':role,'viewer_page':int(n),'selected_psm':3,'tesseract_version':ver,'source_sha256':hashlib.sha256(b).hexdigest(),'source_bytes':len(b),'full_page_text_chars':len(Path(f'private_bundle/{n}.txt').read_text(encoding='utf-8')),'tsv_chars':len(Path(f'private_bundle/{n}.tsv').read_text(encoding='utf-8'))})
          Path('private_bundle/private_manifest.json').write_text(json.dumps({'pages':pub},ensure_ascii=False,indent=2),encoding='utf-8')
          Path('manifest.json').write_text(json.dumps({'transport':'encrypted tar bundle containing private source JPEG + production full-page TXT/TSV','certificate_fingerprint_sha256':'89:A8:3D:42:24:FB:65:81:C9:80:72:60:A7:35:F2:3D:03:49:65:BC:B0:E0:F9:67:00:B0:BE:0A:23:62:57:BC','pages':pub},ensure_ascii=False,indent=2),encoding='utf-8')
          PY

      - name: Encrypt and erase plaintext
        run: |
          set -euo pipefail
          tar -czf private_bundle.tar.gz private_bundle/
          openssl cms -encrypt -binary -aes256 -in private_bundle.tar.gz -outform DER -out payload.p7m cert.pem
          sha256sum payload.p7m > ciphertext.sha256
          rm -rf private_bundle private_bundle.tar.gz cert.pem version.txt
          test ! -d private_bundle

      - name: Upload ciphertext and manifest only
        uses: actions/upload-artifact@v4
        with:
          name: ltmd-cer-1988-batch1-private-bundle-encrypted
          path: |
            payload.p7m
            manifest.json
            ciphertext.sha256
          retention-days: 1
          if-no-files-found: error

name: audit-ltmd-u1-w2-math-internal-recovery

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/audit-ltmd-u1-w2-math-internal-recovery.yml'
      - 'scripts/audit_ltmd_u1_w2_math_internal_recovery.py'
      - 'data/catalog/ltmd_u1_w2_math_asset_manifest.csv'
      - 'data/catalog/ltmd_u1_w2_scope.csv'

permissions:
  contents: write

jobs:
  recover:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Require completed W2 asset manifest
        run: test -f data/catalog/ltmd_u1_w2_math_asset_manifest.csv
      - name: Audit manifest-only cryptographic recovery candidates
        run: python3 scripts/audit_ltmd_u1_w2_math_internal_recovery.py
      - name: Publish recovery audit race-safely
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/ltmd-u1-w2-recovery
          cp data/catalog/ltmd_u1_w2_math_internal_recovery_audit.csv /tmp/ltmd-u1-w2-recovery/
          cp data/catalog/ltmd_u1_w2_math_internal_recoveries.csv /tmp/ltmd-u1-w2-recovery/
          cp data/catalog/ltmd_u1_w2_math_internal_recovery_audit.md /tmp/ltmd-u1-w2-recovery/
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          for attempt in 1 2 3; do
            git fetch origin main
            git reset --hard origin/main
            cp /tmp/ltmd-u1-w2-recovery/* data/catalog/
            git add data/catalog/ltmd_u1_w2_math_internal_recovery_audit.csv data/catalog/ltmd_u1_w2_math_internal_recoveries.csv data/catalog/ltmd_u1_w2_math_internal_recovery_audit.md
            if git diff --cached --quiet; then exit 0; fi
            git commit -m 'Publish LTMD-U1 W2 mathematics internal recovery audit'
            if git push origin HEAD:main; then exit 0; fi
            sleep $((attempt * 2))
          done
          exit 1

# retrigger: consolidated 64-viewer asset manifest available

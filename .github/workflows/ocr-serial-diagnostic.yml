name: Serial OCR diagnostic

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/ocr-serial-diagnostic.yml'

permissions:
  contents: read

jobs:
  diagnostic:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      OMP_THREAD_LIMIT: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Spanish Tesseract model
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq tesseract-ocr tesseract-ocr-spa
      - name: Build page manifest
        run: python scripts/build_page_manifest.py
      - name: Run one page per generation serially
        run: python scripts/ocr_adaptive_metrics.py --slots q1_1 --modes 3,6,11 --timeout 45 --workers 1 --output data/derived/ocr_serial_diagnostic.csv
      - name: Show metrics
        run: cat data/derived/ocr_serial_diagnostic.csv
      - name: Upload metrics only
        uses: actions/upload-artifact@v4
        with:
          name: ocr-serial-diagnostic
          path: data/derived/ocr_serial_diagnostic.csv
          retention-days: 30

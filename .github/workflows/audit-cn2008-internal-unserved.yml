name: audit-cn2008-internal-unserved

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/audit-cn2008-internal-unserved.yml'
      - 'scripts/audit_cn2008_internal_unserved.py'
      - 'data/catalog/ciencias_naturales_pending_page_manifest.csv'

permissions:
  contents: write

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Audit three internal unserved positions and verify neighbours by SHA
        run: python3 scripts/audit_cn2008_internal_unserved.py
      - name: Publish focused audit race-safely
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/catalog/cn2008_internal_unserved_audit.csv data/catalog/cn2008_internal_unserved_audit.md
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Publish CN 2008 internal-unserved audit'
          git pull --rebase origin main
          git push origin HEAD:main

name: Encrypted private bundle — 1972 CER batch 4

on:
  push:
    paths: ['.github/workflows/cer-private-bundle-1972-batch4.yml']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  bundle:
    runs-on: ubuntu-24.04
    env:
      OMP_THREAD_LIMIT: '1'
    steps:
      - name: Install exact production OCR
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq tesseract-ocr tesseract-ocr-spa python3-pil
          tesseract --version | head -1 | tee version.txt
          grep -F 'tesseract 5.3.4' version.txt

      - name: Write one-use public certificate
        run: |
          cat > cert.pem <<'PEM'
          -----BEGIN CERTIFICATE-----
          MIIEgTCCAumgAwIBAgIUarZnFLCG0AN2m2R387vV0V6tRLkwDQYJKoZIhvcNAQEL
          BQAwUDEnMCUGA1UEAwweTFRNRCBDRVIgMTk3MiBiYXRjaDQgdHJhbnNwb3J0MSUw
          IwYDVQQKDBxMaWJybyBUZXh0byBNZXhpY2FubyBEaWdpdGFsMB4XDTI2MDgxNTE1
          NTUwNVoXDTI2MDgxNzE1NTUwNVowUDEnMCUGA1UEAwweTFRNRCBDRVIgMTk3MiBi
          YXRjaDQgdHJhbnNwb3J0MSUwIwYDVQQKDBxMaWJybyBUZXh0byBNZXhpY2FubyBE
          aWdpdGFsMIIBojANBgkqhkiG9w0BAQEFAAOCAY8AMIIBigKCAYEA3cRMGianQJ6Z
          QbGOZ67bc9Pqgjn4K8xe7CJ5qxcszy41RX2raEkw5gTh7e/qbV+eYHH19y/1kkwz
          a5tb2y1LRgRc7WmPKH2WV2K0PC1S1K5SnyPuFMi10VfNVLa4/8mDe7Y+PuRz6Wcx
          a3c9M5UnznZI6VHuiNhePraQc80hRB3JZsnEi6PztxzS3rvT/I200cKGDxwWQPV2
          P0JX4HUMb+nYL1hFg6IXoKrAylqqo++DmGseGirAIkOtWiGGjTHF+TPsqzG3bwqh
          X4OL937qcCcnfZ4T3yMJpSmnb+Bmm5hsNoN+JaOoMV79TdUWdD1F3mDl8NlEIIpu
          tm5IZdK3608kDr5bh/8gxZELRhFIQdaYgWOlcbiYafgVuaxcI6Ah5XL85zqnL9Z3
          gZzU6oq+5g9aXfRHKZdFZUmrfZVr8wIAtn9Tp3A0L4mnw885ZoceDEj7J49aRX1g
          rDwRsvPQY8QWcpauIeotDv3ZQYT5Bzrt3NgtJ81EuZsuX0D9fHlrAgMBAAGjUzBR
          MB0GA1UdDgQWBBTnvWNlp8OpgxAuIK+P2BJVAOu8wzAfBgNVHSMEGDAWgBTnvWNl
          p8OpgxAuIK+P2BJVAOu8wzAPBgNVHRMBAf8EBTADAQH/MA0GCSqGSIb3DQEBCwUA
          A4IBgQAXuA6h/eRZV5Tz6adPzU7CJ9MtknOtMpA/hywOXptkrhKUHMFeCM5xlqRi
          pb4op5hTG/Bh+N/rwkvEe5dHrnwcJSOM0KqKxBo4R9YeyLrloOQxD7ZZKhvpZGAh
          m9Fd4UyhNajKjUKKtgk5NQTLFaih/+M2TVKKs6bUcxbwq8ds8keXx8ykZRDdU80u
          iquIRopYeutX4xshcSFTSRwZ2WPpHqpm07xu8xq9W8q11iCsHBXvxDiXHqH09j5e
          ckXiA6ccLsGI5VvhCibw8TbSddRIJXOQFYQOYB/e3B0njTFV+EsH5Pm+eo9I2Yny
          eXKUMOoTC9wpbO3pCLKAf6z36AeG3YKQ/mN0kcXcIwBUxjU+TXfNrIa3gTJv2RUp
          yHpTU4FiGzKWkRzVrwPeZBLt8qhGo9KhR5VGasq4cw8z0m/OU619xLxEZi5o/CK4
          6EdvHF0t8Tb5Gf6GlP5vIR7nr0ORyOLOnWTpTWa4NxmbjJlYTPX4GbrWiQtlvQWp
          L7Bh9uo=
          -----END CERTIFICATE-----
          PEM
          openssl x509 -in cert.pem -noout -fingerprint -sha256

      - name: Acquire source pages and production OCR with selected PSM
        run: |
          set -euo pipefail
          mkdir -p private_bundle
          for n in 189 215 246; do
            curl -fsSL --retry 3 --connect-timeout 15 --max-time 90 "https://historico.conaliteg.gob.mx/c/H1972P5CI084/${n}.jpg" -o "private_bundle/${n}.jpg"
          done
          python3 - <<'PY'
          from PIL import Image
          for n in ('189','215','246'):
              with Image.open(f'private_bundle/{n}.jpg') as im:
                  assert im.size == (670,993), (n,im.size)
          PY
          tesseract private_bundle/189.jpg private_bundle/189 -l spa --psm 3 txt tsv >/dev/null 2>private_bundle/189.stderr
          tesseract private_bundle/215.jpg private_bundle/215 -l spa --psm 3 txt tsv >/dev/null 2>private_bundle/215.stderr
          tesseract private_bundle/246.jpg private_bundle/246 -l spa --psm 6 txt tsv >/dev/null 2>private_bundle/246.stderr

      - name: Write private/public manifests
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib,json
          from pathlib import Path
          pages=[
            ('LTMD-CER-1972-Q3_3','189','LTMD-CN5-G1972-VP189',3),
            ('LTMD-CER-1972-Q4_1','215','LTMD-CN5-G1972-VP215',3),
            ('LTMD-CER-1972-Q4_2','246','LTMD-CN5-G1972-VP246',6),
          ]
          ver=Path('version.txt').read_text().strip(); pub=[]
          for sid,n,pid,psm in pages:
              b=Path(f'private_bundle/{n}.jpg').read_bytes()
              pub.append({'sample_id':sid,'page_id':pid,'viewer_page':int(n),'selected_psm':psm,'tesseract_version':ver,'source_sha256':hashlib.sha256(b).hexdigest(),'source_bytes':len(b),'full_page_text_chars':len(Path(f'private_bundle/{n}.txt').read_text(encoding='utf-8')),'tsv_chars':len(Path(f'private_bundle/{n}.tsv').read_text(encoding='utf-8'))})
          Path('private_bundle/private_manifest.json').write_text(json.dumps({'pages':pub},ensure_ascii=False,indent=2),encoding='utf-8')
          Path('manifest.json').write_text(json.dumps({'transport':'encrypted tar bundle containing private source JPEG + production full-page TXT/TSV','certificate_fingerprint_sha256':'C0:28:75:2E:7D:F9:38:C3:36:D4:23:E1:F3:3C:DE:9E:63:49:E5:F7:83:C3:17:63:A3:7B:40:1D:FF:BD:D0:EA','pages':pub},ensure_ascii=False,indent=2),encoding='utf-8')
          PY

      - name: Encrypt private bundle and erase plaintext
        run: |
          set -euo pipefail
          tar -czf private_bundle.tar.gz private_bundle/
          openssl cms -encrypt -binary -aes256 -in private_bundle.tar.gz -outform DER -out payload.p7m cert.pem
          sha256sum payload.p7m > ciphertext.sha256
          rm -rf private_bundle private_bundle.tar.gz cert.pem version.txt
          test ! -d private_bundle

      - name: Upload ciphertext and non-text manifest only
        uses: actions/upload-artifact@v4
        with:
          name: ltmd-cer-1972-batch4-private-bundle-encrypted
          path: |
            payload.p7m
            manifest.json
            ciphertext.sha256
          retention-days: 1
          if-no-files-found: error

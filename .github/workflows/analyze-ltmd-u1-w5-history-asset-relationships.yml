name: analyze-ltmd-u1-w5-history-asset-relationships

on:
  workflow_dispatch:
  workflow_run:
    workflows:
      - audit-ltmd-u1-w5-history-assets
    types:
      - completed
  push:
    paths:
      - 'data/catalog/ltmd_u1_w5_history_asset_manifest.csv'
      - 'data/catalog/ltmd_u1_w5_history_asset_summary.csv'

permissions:
  contents: write

jobs:
  analyze:
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Verify asset evidence exists
        shell: bash
        run: |
          test -s data/catalog/ltmd_u1_w5_history_asset_manifest.csv
          test -s data/catalog/ltmd_u1_w5_history_asset_summary.csv
      - name: Analyze exact asset relationships and source readiness
        run: python3 scripts/analyze_ltmd_u1_w5_history_asset_relationships.py
      - name: Publish W5 source relationships race-safely
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/ltmd-u1-w5-rel
          cp data/catalog/ltmd_u1_w5_history_exact_asset_relationships.csv /tmp/ltmd-u1-w5-rel/
          cp data/catalog/ltmd_u1_w5_history_source_readiness.csv /tmp/ltmd-u1-w5-rel/
          cp data/catalog/ltmd_u1_w5_history_asset_relationships.md /tmp/ltmd-u1-w5-rel/
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          for attempt in 1 2 3; do
            git fetch origin main
            git reset --hard origin/main
            cp /tmp/ltmd-u1-w5-rel/* data/catalog/
            git add data/catalog/ltmd_u1_w5_history_exact_asset_relationships.csv data/catalog/ltmd_u1_w5_history_source_readiness.csv data/catalog/ltmd_u1_w5_history_asset_relationships.md
            if git diff --cached --quiet; then exit 0; fi
            git commit -m 'Publish LTMD-U1 W5 History asset relationships'
            if git push origin HEAD:main; then exit 0; fi
            sleep $((attempt * 2))
          done
          exit 1

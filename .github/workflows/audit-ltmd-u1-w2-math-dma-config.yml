name: audit-ltmd-u1-w2-math-dma-config

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/audit-ltmd-u1-w2-math-dma-config.yml'
      - 'scripts/audit_ltmd_u1_w2_math_dma_config.py'

permissions:
  contents: write

jobs:
  audit:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - run: python3 scripts/audit_ltmd_u1_w2_math_dma_config.py
      - name: Publish DMA config audit race-safely
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/dma-config
          cp data/catalog/ltmd_u1_w2_math_dma_config.csv /tmp/dma-config/
          cp data/catalog/ltmd_u1_w2_math_dma_config.md /tmp/dma-config/
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          for attempt in 1 2 3; do
            git fetch origin main
            git reset --hard origin/main
            cp /tmp/dma-config/* data/catalog/
            git add data/catalog/ltmd_u1_w2_math_dma_config.csv data/catalog/ltmd_u1_w2_math_dma_config.md
            if git diff --cached --quiet; then exit 0; fi
            git commit -m 'Publish LTMD-U1 W2 mathematics DMA configuration audit'
            if git push origin HEAD:main; then exit 0; fi
            sleep $((attempt * 2))
          done
          exit 1

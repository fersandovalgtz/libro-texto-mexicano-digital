name: build-ltmd-u1-w11-standard-assets

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/build-ltmd-u1-w11-standard-assets.yml'
      - 'scripts/audit_ltmd_u1_w11_standard_assets_book.py'
      - 'scripts/combine_ltmd_u1_w11_standard_asset_shards.py'
      - 'data/catalog/ltmd_u1_w11_standard_declared_inventory.csv'
  workflow_run:
    workflows: ['build-ltmd-u1-w11-standard-declared-inventory']
    types: [completed]

permissions:
  contents: write

concurrency:
  group: build-ltmd-u1-w11-standard-assets
  cancel-in-progress: false

jobs:
  matrix:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-24.04
    outputs:
      viewers: ${{ steps.make.outputs.viewers }}
    steps:
      - uses: actions/checkout@v7
      - id: make
        shell: bash
        run: |
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import csv,json
          rows=list(csv.DictReader(open('data/catalog/ltmd_u1_w11_standard_declared_inventory.csv',encoding='utf-8')))
          assert len(rows)==100 and len({r['viewer_key'] for r in rows})==100
          assert sum(int(r['declared_positions']) for r in rows)==19576
          print('viewers='+json.dumps([r['viewer_key'] for r in rows],separators=(',',':')))
          PY

  audit:
    needs: matrix
    strategy:
      fail-fast: false
      max-parallel: 8
      matrix:
        viewer_key: ${{ fromJSON(needs.matrix.outputs.viewers) }}
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v7
      - name: Audit one standard W11 viewer without persisting images
        run: python3 scripts/audit_ltmd_u1_w11_standard_assets_book.py --viewer-key '${{ matrix.viewer_key }}'
      - uses: actions/upload-artifact@v4
        with:
          name: ltmd-u1-w11-standard-assets-${{ matrix.viewer_key }}
          path: data/work/ltmd_u1_w11_standard_assets/*.csv
          if-no-files-found: error
          retention-days: 1

  combine:
    needs: audit
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@v4
        with:
          pattern: ltmd-u1-w11-standard-assets-*
          path: data/work/ltmd_u1_w11_standard_assets
          merge-multiple: true
      - name: Combine exact 100-viewer standard-route audit
        run: python3 scripts/combine_ltmd_u1_w11_standard_asset_shards.py
      - name: Publish W11 standard asset audit race-safely
        shell: bash
        run: |
          set -euo pipefail
          cp data/catalog/ltmd_u1_w11_standard_asset_manifest.csv /tmp/ltmd_u1_w11_standard_asset_manifest.csv
          cp data/catalog/ltmd_u1_w11_standard_asset_summary.csv /tmp/ltmd_u1_w11_standard_asset_summary.csv
          cp docs/LTMD_U1_W11_STANDARD_ASSET_AUDIT.md /tmp/LTMD_U1_W11_STANDARD_ASSET_AUDIT.md
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          for attempt in 1 2 3; do
            git fetch origin main
            git reset --hard origin/main
            cp /tmp/ltmd_u1_w11_standard_asset_manifest.csv data/catalog/
            cp /tmp/ltmd_u1_w11_standard_asset_summary.csv data/catalog/
            cp /tmp/LTMD_U1_W11_STANDARD_ASSET_AUDIT.md docs/
            git add data/catalog/ltmd_u1_w11_standard_asset_manifest.csv data/catalog/ltmd_u1_w11_standard_asset_summary.csv docs/LTMD_U1_W11_STANDARD_ASSET_AUDIT.md
            if git diff --cached --quiet; then exit 0; fi
            git commit -m 'data(w11): publish strict standard-route asset audit'
            if git push origin HEAD:main; then exit 0; fi
            sleep $((attempt*2))
          done
          exit 1

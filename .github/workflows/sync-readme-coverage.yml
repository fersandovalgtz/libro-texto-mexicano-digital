name: sync-readme-coverage

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/sync-readme-coverage.yml'
      - 'scripts/sync_readme_coverage.py'
      - 'data/catalog/ltmd_u1_coverage_summary.csv'
  workflow_run:
    workflows: ['build-ltmd-u1-coverage-dashboard']
    types: [completed]

permissions:
  contents: write

concurrency:
  group: sync-readme-coverage
  cancel-in-progress: false

jobs:
  sync:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Synchronize Spanish and English landing-page metrics
        run: python3 scripts/sync_readme_coverage.py
      - name: Publish synchronized READMEs race-safely
        shell: bash
        run: |
          set -euo pipefail
          cp README.md /tmp/README.md
          cp README.en.md /tmp/README.en.md
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          for attempt in 1 2 3; do
            git fetch origin main
            git reset --hard origin/main
            cp /tmp/README.md README.md
            cp /tmp/README.en.md README.en.md
            git add README.md README.en.md
            if git diff --cached --quiet; then exit 0; fi
            git commit -m 'docs: synchronize LTMD landing-page coverage'
            if git push origin HEAD:main; then exit 0; fi
            sleep $((attempt*2))
          done
          exit 1

name: probe-ltmd-u1-w3-special-viewers

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/probe-ltmd-u1-w3-special-viewers.yml'
      - 'scripts/probe_ltmd_u1_w3_special_viewers.py'
      - 'data/catalog/ltmd_u1_w3_architecture_exceptions.csv'

permissions:
  contents: write

jobs:
  probe:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - run: python3 scripts/probe_ltmd_u1_w3_special_viewers.py
      - name: Publish special-viewer probe race-safely
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/w3-special
          cp data/catalog/ltmd_u1_w3_special_viewer_probe.csv /tmp/w3-special/
          cp data/catalog/ltmd_u1_w3_special_viewer_probe.md /tmp/w3-special/
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          for attempt in 1 2 3; do
            git fetch origin main
            git reset --hard origin/main
            cp /tmp/w3-special/* data/catalog/
            git add data/catalog/ltmd_u1_w3_special_viewer_probe.csv data/catalog/ltmd_u1_w3_special_viewer_probe.md
            if git diff --cached --quiet; then exit 0; fi
            git commit -m 'Publish LTMD-U1 W3 special viewer probe'
            if git push origin HEAD:main; then exit 0; fi
            sleep $((attempt * 2))
          done
          exit 1

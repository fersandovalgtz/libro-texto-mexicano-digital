name: audit-ltmd-bibliographic-instance-resolution

on:
  workflow_dispatch:
  push:
    paths:
      - 'scripts/audit_ltmd_bibliographic_instance_resolution_v01.py'
      - 'data/catalog/ltmd_bibliographic_instance_resolution.csv'
      - 'data/catalog/ltmd_bibliographic_observations.csv'
      - 'data/catalog/ltmd_bibliographic_observation_evidence.csv'
      - '.github/workflows/audit-ltmd-bibliographic-instance-resolution.yml'

concurrency:
  group: ltmd-bibliographic-instance-resolution-audit
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  audit:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Audit bibliographic instance-resolution evidence topology
        run: python3 scripts/audit_ltmd_bibliographic_instance_resolution_v01.py
      - name: Publish resolution audit race-safely
        run: |
          set -euo pipefail
          rm -rf /tmp/ltmd-biblio-resolution-audit
          mkdir -p /tmp/ltmd-biblio-resolution-audit
          cp data/catalog/ltmd_bibliographic_instance_resolution_audit.csv /tmp/ltmd-biblio-resolution-audit/
          cp data/catalog/ltmd_bibliographic_instance_resolution_audit.md /tmp/ltmd-biblio-resolution-audit/
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          for attempt in 1 2 3; do
            git fetch origin main
            git reset --hard origin/main
            cp /tmp/ltmd-biblio-resolution-audit/* data/catalog/
            git add data/catalog/ltmd_bibliographic_instance_resolution_audit.csv \
                    data/catalog/ltmd_bibliographic_instance_resolution_audit.md
            if git diff --cached --quiet; then exit 0; fi
            git commit -m 'Publish LTMD bibliographic instance-resolution audit 0.1'
            if git push origin HEAD:main; then exit 0; fi
            sleep $((attempt * 2))
          done
          exit 1

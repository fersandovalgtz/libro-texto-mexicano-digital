name: build-cn-family-asset-readiness

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/build-cn-family-asset-readiness.yml'
      - 'scripts/build_cn_family_asset_readiness.py'
      - 'data/catalog/ciencias_naturales_technical_inventory.csv'
      - 'data/catalog/ciencias_naturales_pending_page_manifest_summary.csv'
      - 'data/catalog/cn2018_2019_catalog_alias_relationships.csv'
      - 'data/catalog/cn2008_internal_unserved_audit.csv'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Build conservative family asset readiness
        run: python3 scripts/build_cn_family_asset_readiness.py
      - name: Publish readiness race-safely
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/catalog/ciencias_naturales_family_asset_readiness.csv data/catalog/ciencias_naturales_family_asset_readiness.md
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Publish Ciencias Naturales family asset readiness'
          git pull --rebase origin main
          git push origin HEAD:main

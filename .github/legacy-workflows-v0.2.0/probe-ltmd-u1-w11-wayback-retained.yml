name: probe-ltmd-u1-w11-wayback-retained

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/probe-ltmd-u1-w11-wayback-retained.yml'
      - 'scripts/probe_ltmd_u1_w11_wayback_exact_urls.py'
      - 'data/catalog/ltmd_u1_w11_retained_source_holes.csv'
  workflow_run:
    workflows: ['build-ltmd-u1-w11-retained-hole-report']
    types: [completed]

permissions:
  contents: write

concurrency:
  group: probe-ltmd-u1-w11-wayback-retained
  cancel-in-progress: false

jobs:
  probe:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Refresh authoritative main
        run: |
          git fetch origin main
          git reset --hard origin/main
      - id: ready
        shell: bash
        run: |
          if [[ -f data/catalog/ltmd_u1_w11_retained_source_holes.csv ]]; then echo 'ready=true' >> "$GITHUB_OUTPUT"; else echo 'ready=false' >> "$GITHUB_OUTPUT"; fi
      - name: Query Wayback CDX for exact institutional paths
        if: steps.ready.outputs.ready == 'true'
        run: python3 scripts/probe_ltmd_u1_w11_wayback_exact_urls.py
      - name: Publish archive-probe metadata race-safely
        if: steps.ready.outputs.ready == 'true'
        shell: bash
        run: |
          set -euo pipefail
          cp data/catalog/ltmd_u1_w11_wayback_capture_candidates.csv /tmp/ltmd_u1_w11_wayback_capture_candidates.csv
          cp data/catalog/ltmd_u1_w11_wayback_query_log.csv /tmp/ltmd_u1_w11_wayback_query_log.csv
          cp docs/LTMD_U1_W11_WAYBACK_PROBE.md /tmp/LTMD_U1_W11_WAYBACK_PROBE.md
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          for attempt in 1 2 3; do
            git fetch origin main
            git reset --hard origin/main
            cp /tmp/ltmd_u1_w11_wayback_capture_candidates.csv data/catalog/
            cp /tmp/ltmd_u1_w11_wayback_query_log.csv data/catalog/
            cp /tmp/LTMD_U1_W11_WAYBACK_PROBE.md docs/
            git add data/catalog/ltmd_u1_w11_wayback_capture_candidates.csv data/catalog/ltmd_u1_w11_wayback_query_log.csv docs/LTMD_U1_W11_WAYBACK_PROBE.md
            if git diff --cached --quiet; then exit 0; fi
            git commit -m 'data(w11): publish bounded exact-URL Wayback probe'
            if git push origin HEAD:main; then exit 0; fi
            sleep $((attempt*2))
          done
          exit 1

name: analyze-ltmd-u1-w3-w4-w7-w8-technical-comparison

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'data/control/ltmd_u1_w3_w4_w7_w8_comparison_trigger.txt'

permissions:
  contents: write

concurrency:
  group: ltmd-u1-w3-w4-w7-w8-technical-comparison
  cancel-in-progress: false

jobs:
  compare:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Build nonsemantic four-cohort technical comparison
        run: python3 scripts/compare_ltmd_u1_w3_w4_w7_w8_technical_profiles.py
      - name: Publish comparison race-safely
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/ltmd-four-comparison
          mkdir -p /tmp/ltmd-four-comparison
          cp data/derived/ltmd_u1_w3_w4_w7_w8_technical_comparison.csv /tmp/ltmd-four-comparison/
          cp docs/LTMD_U1_W3_W4_W7_W8_TECHNICAL_COMPARISON.md /tmp/ltmd-four-comparison/
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          for attempt in 1 2 3; do
            git fetch origin main
            git reset --hard origin/main
            cp /tmp/ltmd-four-comparison/ltmd_u1_w3_w4_w7_w8_technical_comparison.csv data/derived/
            cp /tmp/ltmd-four-comparison/LTMD_U1_W3_W4_W7_W8_TECHNICAL_COMPARISON.md docs/
            git add data/derived/ltmd_u1_w3_w4_w7_w8_technical_comparison.csv docs/LTMD_U1_W3_W4_W7_W8_TECHNICAL_COMPARISON.md
            if git diff --cached --quiet; then exit 0; fi
            git commit -m 'Publish LTMD U1 W3-W4-W7-W8 technical comparison'
            if git push origin HEAD:main; then exit 0; fi
            sleep $((attempt * 2))
          done
          exit 1

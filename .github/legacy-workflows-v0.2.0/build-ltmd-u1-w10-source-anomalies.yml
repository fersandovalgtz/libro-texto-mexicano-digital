name: build-ltmd-u1-w10-source-anomalies

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/build-ltmd-u1-w10-source-anomalies.yml'
      - 'scripts/summarize_ltmd_u1_w10_source_anomalies.py'
      - 'data/catalog/ltmd_u1_w10_asset_manifest.csv'

permissions:
  contents: write

concurrency:
  group: build-ltmd-u1-w10-source-anomalies
  cancel-in-progress: false

jobs:
  summarize:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Build compact anomaly view
        run: python3 scripts/summarize_ltmd_u1_w10_source_anomalies.py
      - name: Publish W10 anomaly report race-safely
        shell: bash
        run: |
          set -euo pipefail
          cp data/catalog/ltmd_u1_w10_source_anomalies.csv /tmp/ltmd_u1_w10_source_anomalies.csv
          cp docs/LTMD_U1_W10_SOURCE_ANOMALIES.md /tmp/LTMD_U1_W10_SOURCE_ANOMALIES.md
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          for attempt in 1 2 3; do
            git fetch origin main
            git reset --hard origin/main
            cp /tmp/ltmd_u1_w10_source_anomalies.csv data/catalog/
            cp /tmp/LTMD_U1_W10_SOURCE_ANOMALIES.md docs/
            git add data/catalog/ltmd_u1_w10_source_anomalies.csv docs/LTMD_U1_W10_SOURCE_ANOMALIES.md
            if git diff --cached --quiet; then exit 0; fi
            git commit -m 'data(w10): publish compact source-anomaly report'
            if git push origin HEAD:main; then exit 0; fi
            sleep $((attempt*2))
          done
          exit 1

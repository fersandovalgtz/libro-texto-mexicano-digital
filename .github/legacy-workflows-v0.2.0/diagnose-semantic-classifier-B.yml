name: Diagnose SEMB prototype geometry

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/diagnose-semantic-classifier-B.yml'
      - 'tests/diagnose_semantic_classifier_B.py'

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      TOKENIZERS_PARALLELISM: 'false'
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned semantic runtime
        run: python3 -m pip install --disable-pip-version-check 'sentence-transformers==5.6.1'
      - name: Diagnose synthetic prototype geometry
        run: python3 tests/diagnose_semantic_classifier_B.py

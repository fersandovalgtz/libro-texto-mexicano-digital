name: build-ltmd-u1-w11-technical-routing

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/build-ltmd-u1-w11-technical-routing.yml'
      - 'scripts/build_ltmd_u1_w11_technical_routing.py'
      - 'data/catalog/ltmd_u1_w11_viewer_architecture.csv'
  workflow_run:
    workflows: ['build-ltmd-u1-w11-architecture']
    types: [completed]

permissions:
  contents: write

concurrency:
  group: build-ltmd-u1-w11-technical-routing
  cancel-in-progress: false

jobs:
  route:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Route W11 strictly by observed architecture
        run: python3 scripts/build_ltmd_u1_w11_technical_routing.py
      - name: Publish W11 technical routing race-safely
        shell: bash
        run: |
          set -euo pipefail
          cp data/catalog/ltmd_u1_w11_technical_routing.csv /tmp/ltmd_u1_w11_technical_routing.csv
          cp docs/LTMD_U1_W11_TECHNICAL_ROUTING.md /tmp/LTMD_U1_W11_TECHNICAL_ROUTING.md
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          for attempt in 1 2 3; do
            git fetch origin main
            git reset --hard origin/main
            cp /tmp/ltmd_u1_w11_technical_routing.csv data/catalog/ltmd_u1_w11_technical_routing.csv
            cp /tmp/LTMD_U1_W11_TECHNICAL_ROUTING.md docs/LTMD_U1_W11_TECHNICAL_ROUTING.md
            git add data/catalog/ltmd_u1_w11_technical_routing.csv docs/LTMD_U1_W11_TECHNICAL_ROUTING.md
            if git diff --cached --quiet; then exit 0; fi
            git commit -m 'data(w11): publish architecture-based technical routing'
            if git push origin HEAD:main; then exit 0; fi
            sleep $((attempt*2))
          done
          exit 1

name: Retired — sync LTMD-U1 technical status

# Retired on 2026-08-31.
#
# This workflow previously rebuilt docs/LTMD_U1_TECHNICAL_STATUS.md from a
# W2/W3/W4-only generator and pushed the result directly to main. After LTMD
# became corpus-wide, that behavior could regress the canonical all-wave U1
# status and bypass pull-request review. The file is preserved as an explicit
# tombstone so the old automation is not reintroduced accidentally.

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  retired:
    runs-on: ubuntu-latest
    steps:
      - name: Explain retirement
        run: |
          echo 'This direct-push workflow is retired.'
          echo 'Canonical LTMD-U1 status must be derived from the all-wave coverage contract and changed through reviewed repository updates.'

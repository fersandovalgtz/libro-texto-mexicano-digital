name: build-ltmd-u1-w4-completion-report

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/build-ltmd-u1-w4-completion-report.yml'
      - 'scripts/build_ltmd_u1_w4_completion_report.py'
      - 'data/catalog/ltmd_u1_w4_social_sciences_processing_inventory.csv'
      - 'data/catalog/ltmd_u1_w4_social_sciences_canonical_page_manifest.csv'
      - 'data/catalog/ltmd_u1_w4_social_sciences_ocr_metrics.csv'
      - 'data/catalog/ltmd_u1_w4_social_sciences_ocr_summary.csv'
      - 'data/catalog/ltmd_u1_w4_social_sciences_page_structure.csv'
      - 'data/catalog/ltmd_u1_w4_social_sciences_page_structure_summary.csv'
      - 'data/catalog/ltmd_u1_w4_social_sciences_fragment_manifest.csv'
      - 'data/catalog/ltmd_u1_w4_social_sciences_fragment_manifest_summary.csv'
      - 'data/catalog/ltmd_u1_w4_social_sciences_fragment_sequence_gaps.csv'
      - 'data/catalog/ltmd_u1_w4_social_sciences_exact_content_units.csv'
      - 'data/catalog/ltmd_u1_w4_social_sciences_exact_viewer_overlap.csv'

permissions:
  contents: write

concurrency:
  group: build-ltmd-u1-w4-completion-report
  cancel-in-progress: false

jobs:
  completion:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Validate and rebuild W4 technical closure
        run: python3 scripts/build_ltmd_u1_w4_completion_report.py

      - name: Publish completion report race-safely
        shell: bash
        run: |
          set -euo pipefail
          cp docs/LTMD_U1_W4_COMPLETION.md /tmp/LTMD_U1_W4_COMPLETION.md
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          for attempt in 1 2 3; do
            git fetch origin main
            git reset --hard origin/main
            cp /tmp/LTMD_U1_W4_COMPLETION.md docs/LTMD_U1_W4_COMPLETION.md
            git add docs/LTMD_U1_W4_COMPLETION.md
            if git diff --cached --quiet; then exit 0; fi
            git commit -m 'Publish executable LTMD-U1 W4 completion report'
            if git push origin HEAD:main; then exit 0; fi
            sleep $((attempt * 2))
          done
          exit 1

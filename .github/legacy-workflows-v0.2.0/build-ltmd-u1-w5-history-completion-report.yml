name: build-ltmd-u1-w5-history-completion-report

on:
  workflow_dispatch:
  workflow_run:
    workflows: ['analyze-ltmd-u1-w5-history-exact-reuse']
    types: [completed]

permissions:
  contents: write

jobs:
  build:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Verify finalized W5 technical artifacts exist
        run: |
          test -f data/catalog/ltmd_u1_w5_history_exact_content_units.csv
          test -f data/catalog/ltmd_u1_w5_history_exact_viewer_overlap.csv
          test -f data/catalog/ltmd_u1_w5_history_fragment_manifest.csv
          test -f data/catalog/ltmd_u1_w5_history_page_structure.csv
          test -f data/catalog/ltmd_u1_w5_history_ocr_metrics.csv
      - name: Build W5 technical completion report
        run: python3 scripts/build_ltmd_u1_w5_history_completion_report.py
      - name: Publish W5 completion report race-safely
        shell: bash
        run: |
          set -euo pipefail
          cp docs/LTMD_U1_W5_COMPLETION.md /tmp/LTMD_U1_W5_COMPLETION.md
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          for attempt in 1 2 3; do
            git fetch origin main
            git reset --hard origin/main
            cp /tmp/LTMD_U1_W5_COMPLETION.md docs/LTMD_U1_W5_COMPLETION.md
            git add docs/LTMD_U1_W5_COMPLETION.md
            if git diff --cached --quiet; then exit 0; fi
            git commit -m 'Publish LTMD-U1 W5 History completion report'
            if git push origin HEAD:main; then exit 0; fi
            sleep $((attempt * 2))
          done
          exit 1

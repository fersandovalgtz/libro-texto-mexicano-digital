name: summarize-cn-pending-asset-anomalies

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/summarize-cn-pending-asset-anomalies.yml'
      - 'scripts/summarize_cn_pending_asset_anomalies.py'
      - 'data/catalog/ciencias_naturales_pending_page_manifest.csv'

permissions:
  contents: write

jobs:
  summarize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Summarize internal missing positions
        run: python3 scripts/summarize_cn_pending_asset_anomalies.py
      - name: Publish compact anomaly summary
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/catalog/ciencias_naturales_pending_asset_anomaly_summary.md
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Publish compact CN asset anomaly summary'
          git pull --rebase origin main
          git push origin HEAD:main

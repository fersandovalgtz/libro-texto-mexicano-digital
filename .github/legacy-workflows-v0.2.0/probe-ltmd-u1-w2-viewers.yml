name: probe-ltmd-u1-w2-viewers

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/probe-ltmd-u1-w2-viewers.yml'
      - 'scripts/probe_viewer_architecture.py'
      - 'data/catalog/ltmd_u1_w2_scope.csv'

permissions:
  contents: write

jobs:
  probe:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Require frozen W2 scope
        run: test -f data/catalog/ltmd_u1_w2_scope.csv
      - name: Probe W2 viewer architecture without downloading book pages
        run: >-
          python3 scripts/probe_viewer_architecture.py
          --inventory data/catalog/ltmd_u1_w2_scope.csv
          --output data/catalog/ltmd_u1_w2_viewer_architecture.json
      - name: Publish architecture probe race-safely
        shell: bash
        run: |
          set -euo pipefail
          cp data/catalog/ltmd_u1_w2_viewer_architecture.json /tmp/ltmd_u1_w2_viewer_architecture.json
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          for attempt in 1 2 3; do
            git fetch origin main
            git reset --hard origin/main
            cp /tmp/ltmd_u1_w2_viewer_architecture.json data/catalog/ltmd_u1_w2_viewer_architecture.json
            git add data/catalog/ltmd_u1_w2_viewer_architecture.json
            if git diff --cached --quiet; then exit 0; fi
            git commit -m 'Publish LTMD-U1 W2 mathematics viewer architecture probe'
            if git push origin HEAD:main; then exit 0; fi
            sleep $((attempt * 2))
          done
          exit 1

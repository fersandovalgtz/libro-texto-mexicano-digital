name: build-research-integrity-manifest-v15

on:
  workflow_dispatch:
  workflow_run:
    workflows: ['build-ltmd-u1-w10-completion']
    types: [completed]

permissions:
  contents: write

concurrency:
  group: ltmd-research-integrity-manifest-v15
  cancel-in-progress: false

jobs:
  integrity:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Build gated integrity manifest 0.15
        run: python3 scripts/build_research_integrity_manifest_v15.py
      - name: Publish integrity manifest 0.15 race-safely
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/ltmd-integrity-v15
          mkdir -p /tmp/ltmd-integrity-v15
          cp data/derived/research_integrity_manifest.json /tmp/ltmd-integrity-v15/
          cp data/derived/research_integrity_manifest.md /tmp/ltmd-integrity-v15/
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          for attempt in 1 2 3; do
            git fetch origin main
            git reset --hard origin/main
            cp /tmp/ltmd-integrity-v15/* data/derived/
            git add data/derived/research_integrity_manifest.json data/derived/research_integrity_manifest.md
            if git diff --cached --quiet; then exit 0; fi
            git commit -m 'Publish LTMD research integrity manifest 0.15'
            if git push origin HEAD:main; then exit 0; fi
            sleep $((attempt * 2))
          done
          exit 1

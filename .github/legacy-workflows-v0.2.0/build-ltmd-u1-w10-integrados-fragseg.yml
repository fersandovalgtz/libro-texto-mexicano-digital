name: build-ltmd-u1-w10-integrados-fragseg

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'data/catalog/ltmd_u1_w10_integrados_page_structure.csv'
      - 'data/catalog/ltmd_u1_w10_integrados_page_structure_summary.csv'
  workflow_run:
    workflows: ['build-ltmd-u1-w10-integrados-pagestruct']
    types: [completed]

permissions:
  contents: write

concurrency:
  group: build-ltmd-u1-w10-integrados-fragseg
  cancel-in-progress: false

env:
  OMP_THREAD_LIMIT: '1'

jobs:
  matrix:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-24.04
    outputs:
      viewers: ${{ steps.make.outputs.viewers }}
    steps:
      - uses: actions/checkout@v4
      - id: make
        shell: bash
        run: |
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import csv,json
          rows=list(csv.DictReader(open('data/catalog/ltmd_u1_w10_integrados_page_structure.csv',encoding='utf-8')))
          proc=list(csv.DictReader(open('data/catalog/ltmd_u1_w10_processing_inventory.csv',encoding='utf-8')))
          keys=sorted({r['viewer_key'] for r in rows})
          expected={r['viewer_key'] for r in proc if r['source_admitted']=='1' and r['is_canonical_processing_object']=='1'}
          assert keys and set(keys)==expected
          assert {r['classifier_version'] for r in rows}=={'PAGESTRUCT_LTMD_U1_W10_INTEGRADOS_0.1'}
          eligible={k:0 for k in keys}
          for r in rows:
              if r['primary_structure'] in {'textual','mixed_text_image'}:eligible[r['viewer_key']]+=1
          bad=[k for k,n in eligible.items() if n==0]
          if bad:raise SystemExit(f'W10 FRAGSEG gate closed: viewers without eligible pages={bad}')
          print('viewers='+json.dumps(keys,separators=(',',':')))
          PY

  fragment:
    needs: matrix
    strategy:
      fail-fast: false
      max-parallel: 8
      matrix:
        viewer_key: ${{ fromJSON(needs.matrix.outputs.viewers) }}
    runs-on: ubuntu-24.04
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4
      - name: Install Spanish Tesseract
        run: |
          sudo apt-get update
          sudo apt-get install -y tesseract-ocr tesseract-ocr-spa
      - name: Segment one canonical W10 viewer
        run: python3 scripts/segment_ltmd_u1_w10_integrados_fragments.py --viewer-key '${{ matrix.viewer_key }}'
      - uses: actions/upload-artifact@v4
        with:
          name: ltmd-u1-w10-fragments-${{ matrix.viewer_key }}
          path: data/work/ltmd_u1_w10_integrados_fragments/*.csv
          if-no-files-found: error
          retention-days: 1

  combine:
    needs: fragment
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@v8
        with:
          pattern: ltmd-u1-w10-fragments-*
          path: data/work/ltmd_u1_w10_integrados_fragments
          merge-multiple: true
      - name: Combine exact W10 FRAGSEG layer
        run: python3 scripts/combine_ltmd_u1_w10_integrados_fragment_shards.py
      - name: Publish W10 FRAGSEG race-safely
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/w10-fragseg
          mkdir -p /tmp/w10-fragseg
          cp data/catalog/ltmd_u1_w10_integrados_fragment_manifest.csv /tmp/w10-fragseg/
          cp data/catalog/ltmd_u1_w10_integrados_fragment_manifest_summary.csv /tmp/w10-fragseg/
          cp data/catalog/ltmd_u1_w10_integrados_fragment_sequence_gaps.csv /tmp/w10-fragseg/
          cp docs/LTMD_U1_W10_FRAGSEG.md /tmp/w10-fragseg/
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          for attempt in 1 2 3; do
            git fetch origin main
            git reset --hard origin/main
            cp /tmp/w10-fragseg/ltmd_u1_w10_integrados_fragment_manifest.csv data/catalog/
            cp /tmp/w10-fragseg/ltmd_u1_w10_integrados_fragment_manifest_summary.csv data/catalog/
            cp /tmp/w10-fragseg/ltmd_u1_w10_integrados_fragment_sequence_gaps.csv data/catalog/
            cp /tmp/w10-fragseg/LTMD_U1_W10_FRAGSEG.md docs/
            git add data/catalog/ltmd_u1_w10_integrados_fragment_manifest.csv data/catalog/ltmd_u1_w10_integrados_fragment_manifest_summary.csv data/catalog/ltmd_u1_w10_integrados_fragment_sequence_gaps.csv docs/LTMD_U1_W10_FRAGSEG.md
            if git diff --cached --quiet; then exit 0; fi
            git commit -m 'data(w10): publish frozen-engine FRAGSEG'
            if git push origin HEAD:main; then exit 0; fi
            sleep $((attempt*2))
          done
          exit 1

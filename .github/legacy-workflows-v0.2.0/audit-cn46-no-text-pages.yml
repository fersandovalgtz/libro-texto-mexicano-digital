name: audit-cn46-no-text-pages

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/audit-cn46-no-text-pages.yml'
      - 'scripts/audit_cn46_no_text_pages.py'
      - 'data/expansion/cn46_ocr_page_metrics.csv'
      - 'data/expansion/cn46_page_manifest.csv'

permissions:
  contents: write

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install image runtime
        run: python3 -m pip install --disable-pip-version-check 'Pillow==11.3.0'
      - name: Audit no-text pages with visual proxies
        run: python3 scripts/audit_cn46_no_text_pages.py
      - name: Publish visual proxies race-safely
        run: |
          set -euo pipefail
          cp data/expansion/cn46_no_text_visual_proxies.csv /tmp/cn46_no_text_visual_proxies.csv
          cp data/expansion/cn46_no_text_visual_proxies.md /tmp/cn46_no_text_visual_proxies.md
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          for attempt in 1 2 3; do
            git fetch origin main
            git reset --hard origin/main
            mkdir -p data/expansion
            cp /tmp/cn46_no_text_visual_proxies.csv data/expansion/
            cp /tmp/cn46_no_text_visual_proxies.md data/expansion/
            git add data/expansion/cn46_no_text_visual_proxies.csv data/expansion/cn46_no_text_visual_proxies.md
            if git diff --cached --quiet; then exit 0; fi
            git commit -m 'Publish CN4/CN6 no-text visual proxy audit'
            if git push origin HEAD:main; then exit 0; fi
            sleep $((attempt * 2))
          done
          exit 1

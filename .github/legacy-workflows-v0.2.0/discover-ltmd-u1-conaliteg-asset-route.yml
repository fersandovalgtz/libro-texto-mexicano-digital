name: discover-ltmd-u1-conaliteg-asset-route

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/discover-ltmd-u1-conaliteg-asset-route.yml'
      - 'scripts/discover_ltmd_u1_conaliteg_asset_route.py'

permissions:
  contents: write

concurrency:
  group: discover-ltmd-u1-conaliteg-asset-route
  cancel-in-progress: false

jobs:
  discover:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Derive official asset route
        run: python3 scripts/discover_ltmd_u1_conaliteg_asset_route.py
      - name: Publish route metadata race-safely
        shell: bash
        run: |
          set -euo pipefail
          cp data/catalog/ltmd_u1_conaliteg_asset_route.csv /tmp/ltmd_u1_conaliteg_asset_route.csv
          cp docs/LTMD_U1_CONALITEG_ASSET_ROUTE.md /tmp/LTMD_U1_CONALITEG_ASSET_ROUTE.md
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          for attempt in 1 2 3; do
            git fetch origin main
            git reset --hard origin/main
            cp /tmp/ltmd_u1_conaliteg_asset_route.csv data/catalog/
            cp /tmp/LTMD_U1_CONALITEG_ASSET_ROUTE.md docs/
            git add data/catalog/ltmd_u1_conaliteg_asset_route.csv docs/LTMD_U1_CONALITEG_ASSET_ROUTE.md
            if git diff --cached --quiet; then exit 0; fi
            git commit -m 'data(u1): publish CONALITEG asset-route metadata'
            if git push origin HEAD:main; then exit 0; fi
            sleep $((attempt*2))
          done
          exit 1

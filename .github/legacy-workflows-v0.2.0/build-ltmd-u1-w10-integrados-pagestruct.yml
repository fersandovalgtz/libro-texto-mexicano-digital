name: build-ltmd-u1-w10-integrados-pagestruct

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'data/catalog/ltmd_u1_w10_integrados_ocr_metrics.csv'
      - 'data/catalog/ltmd_u1_w10_integrados_ocr_summary.csv'
  workflow_run:
    workflows: ['build-ltmd-u1-w10-integrados-ocr']
    types: [completed]

permissions:
  contents: write

concurrency:
  group: build-ltmd-u1-w10-integrados-pagestruct
  cancel-in-progress: false

env:
  OMP_THREAD_LIMIT: '1'

jobs:
  matrix:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-24.04
    outputs:
      viewers: ${{ steps.make.outputs.viewers }}
    steps:
      - uses: actions/checkout@v4
      - id: make
        shell: bash
        run: |
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import csv,json
          rows=list(csv.DictReader(open('data/catalog/ltmd_u1_w10_integrados_ocr_metrics.csv',encoding='utf-8')))
          proc=list(csv.DictReader(open('data/catalog/ltmd_u1_w10_processing_inventory.csv',encoding='utf-8')))
          keys=sorted({r['viewer_key'] for r in rows})
          expected={r['viewer_key'] for r in proc if r['source_admitted']=='1' and r['is_canonical_processing_object']=='1'}
          assert keys and set(keys)==expected and len({r['page_id'] for r in rows})==len(rows)
          assert all(r['source_sha256_verified']=='1' and r['ocr_status']=='ok' for r in rows)
          print('viewers='+json.dumps(keys,separators=(',',':')))
          PY

  structural:
    needs: matrix
    strategy:
      fail-fast: false
      max-parallel: 8
      matrix:
        viewer_key: ${{ fromJSON(needs.matrix.outputs.viewers) }}
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - name: Install Spanish Tesseract
        run: |
          sudo apt-get update
          sudo apt-get install -y tesseract-ocr tesseract-ocr-spa
      - name: Extract structural flags
        run: python3 scripts/extract_ltmd_u1_w10_integrados_structural_flags_book.py --viewer-key '${{ matrix.viewer_key }}'
      - uses: actions/upload-artifact@v4
        with:
          name: ltmd-u1-w10-structkw-${{ matrix.viewer_key }}
          path: data/work/ltmd_u1_w10_integrados_structkw/*.csv
          if-no-files-found: error
          retention-days: 1

  classify:
    needs: structural
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@v8
        with:
          pattern: ltmd-u1-w10-structkw-*
          path: data/work/ltmd_u1_w10_integrados_structkw
          merge-multiple: true
      - name: Combine structural flags
        run: python3 scripts/combine_ltmd_u1_w10_integrados_structural_flags.py
      - name: Classify PAGESTRUCT conservatively
        run: python3 scripts/classify_ltmd_u1_w10_integrados_page_structure.py
      - name: Publish W10 PAGESTRUCT race-safely
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/w10-pagestruct
          mkdir -p /tmp/w10-pagestruct
          cp data/catalog/ltmd_u1_w10_integrados_structural_keyword_flags.csv /tmp/w10-pagestruct/
          cp data/catalog/ltmd_u1_w10_integrados_page_structure.csv /tmp/w10-pagestruct/
          cp data/catalog/ltmd_u1_w10_integrados_page_structure_summary.csv /tmp/w10-pagestruct/
          cp docs/LTMD_U1_W10_PAGESTRUCT.md /tmp/w10-pagestruct/
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          for attempt in 1 2 3; do
            git fetch origin main
            git reset --hard origin/main
            cp /tmp/w10-pagestruct/ltmd_u1_w10_integrados_structural_keyword_flags.csv data/catalog/
            cp /tmp/w10-pagestruct/ltmd_u1_w10_integrados_page_structure.csv data/catalog/
            cp /tmp/w10-pagestruct/ltmd_u1_w10_integrados_page_structure_summary.csv data/catalog/
            cp /tmp/w10-pagestruct/LTMD_U1_W10_PAGESTRUCT.md docs/
            git add data/catalog/ltmd_u1_w10_integrados_structural_keyword_flags.csv data/catalog/ltmd_u1_w10_integrados_page_structure.csv data/catalog/ltmd_u1_w10_integrados_page_structure_summary.csv docs/LTMD_U1_W10_PAGESTRUCT.md
            if git diff --cached --quiet; then exit 0; fi
            git commit -m 'data(w10): publish conservative PAGESTRUCT'
            if git push origin HEAD:main; then exit 0; fi
            sleep $((attempt*2))
          done
          exit 1

name: validate-ltmd-u1-w7-provenance

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/validate-ltmd-u1-w7-provenance.yml'
      - 'scripts/validate_ltmd_u1_w7_provenance.py'
      - 'data/catalog/ltmd_u1_w7_declared_inventory.csv'
      - 'data/catalog/ltmd_u1_w7_civics_ethics_asset_manifest.csv'
      - 'data/catalog/ltmd_u1_w7_civics_ethics_asset_summary.csv'

permissions:
  contents: write

concurrency:
  group: validate-ltmd-u1-w7-provenance
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Validate W7 provenance invariants
        run: python3 scripts/validate_ltmd_u1_w7_provenance.py

      - name: Publish validation report race-safely
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/ltmd-u1-w7-provenance
          cp data/validation/ltmd_u1_w7_provenance_validation.md /tmp/ltmd-u1-w7-provenance/
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          for attempt in 1 2 3; do
            git fetch origin main
            git reset --hard origin/main
            mkdir -p data/validation
            cp /tmp/ltmd-u1-w7-provenance/ltmd_u1_w7_provenance_validation.md data/validation/
            git add data/validation/ltmd_u1_w7_provenance_validation.md
            if git diff --cached --quiet; then exit 0; fi
            git commit -m 'Publish LTMD-U1 W7 provenance validation'
            if git push origin HEAD:main; then exit 0; fi
            sleep $((attempt * 2))
          done
          exit 1

      - name: Download pages, hash, encrypt, destroy clear copy
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p work
          curl -fsSL --retry 3 --connect-timeout 15 --max-time 90 'https://historico.conaliteg.gob.mx/c/H1972P5CI084/189.jpg' -o work/LTMD-CER-1972-Q3_3.jpg
          curl -fsSL --retry 3 --connect-timeout 15 --max-time 90 'https://historico.conaliteg.gob.mx/c/H1972P5CI084/215.jpg' -o work/LTMD-CER-1972-Q4_1.jpg
          curl -fsSL --retry 3 --connect-timeout 15 --max-time 90 'https://historico.conaliteg.gob.mx/c/H1972P5CI084/246.jpg' -o work/LTMD-CER-1972-Q4_2.jpg
          sha256sum work/*.jpg > working-copy.sha256
          tar -cf working-copy.tar -C work .
          openssl cms -encrypt -binary -aes256 -in working-copy.tar -outform DER -out working-copy.p7m cert.pem
          rm -rf work working-copy.tar cert.pem
      - name: Upload ciphertext and hashes only
        uses: actions/upload-artifact@v4
        with:
          name: ltmd-cer-1972-batch4-encrypted-working-copy
          path: |
            working-copy.p7m
            working-copy.sha256
          retention-days: 1
          if-no-files-found: error
